  <script>
    // ---- Back office: sidebar state (see "Sidebar state" in docs/backoffice.md) ----
    // 1024px+ : the sidebar is always there, full or the icon rail (.side-rail, a saved per-device pref).
    // Under it: an overlay, shut unless .side-open -- in memory only, dropped on every crossing of 1024px.
    (function () {
      var app = document.getElementById('app');
      var btn = document.getElementById('boSidebarToggle');
      if (!app) return;
      var wide = window.matchMedia('(min-width: 1024px)');
      function setOpen(on) { app.classList.toggle('side-open', !!on && !wide.matches); }
      wide.addEventListener('change', function () { setOpen(false); });
      btn.addEventListener('click', function () { setOpen(!app.classList.contains('side-open')); });
      document.addEventListener('click', function (e) {
        if (!app.classList.contains('side-open')) return;
        var t = e.target;
        if (btn.contains(t)) return;
        // Picking a page shuts it (peeking a tree with the chevron doesn't); so does a tap on the backdrop.
        if (t.closest('.bo-sidebar') ? t.closest('.side-link, .side-sublink') && !t.closest('.side-chev') : true) setOpen(false);
      });

      // Drag the sidebar's right edge to resize (desktop only); the width is a per-device pref.
      var grip = document.getElementById('sideResizer');
      // Dragged left of FOLD_AT it previews the icon rail; back past OPEN_AT (hysteresis, so it
      // doesn't flicker on the line) it opens again. Only letting go commits the fold.
      var MIN_W = 168, MAX_W = 320, FOLD_AT = 96, OPEN_AT = 128;
      var dragFromW = '', foldedAt = 0;
      function setSideW(w) { document.body.style.setProperty('--po-sidebar-w', w + 'px'); }
      var savedW = +HWPOS_STORE.ui.get('sidebarW');
      if (savedW >= MIN_W && savedW <= MAX_W) {
        // Apply with transitions off so the page doesn't slide in from the default width on load.
        app.classList.add('side-resizing');
        setSideW(savedW);
        void app.offsetWidth;
        app.classList.remove('side-resizing');
      }
      if (grip) {
        grip.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          grip.setPointerCapture(e.pointerId);
          app.classList.add('side-resizing');
          dragFromW = document.body.style.getPropertyValue('--po-sidebar-w');
        });
        // One width change per frame: every change re-lays out the page beside it, and a mouse can
        // fire several moves a frame.
        var dragX = null;
        grip.addEventListener('pointermove', function (e) {
          if (!grip.hasPointerCapture(e.pointerId)) return;
          if (dragX === null) requestAnimationFrame(dragTo);
          dragX = e.clientX;
        });
        function dragTo() {
          var x = dragX;
          dragX = null;
          if (x === null) return;   // let go before this frame
          var railed = app.classList.contains('side-rail');
          if (railed ? x <= OPEN_AT : x < FOLD_AT) {
            if (!railed) {   // transitions back on, so the preview folds in its one motion
              app.classList.remove('side-resizing');
              setRail(true);
              foldedAt = Date.now();
            }
            return;
          }
          // Under MIN_W the edge still follows, at half speed, so it leans into the fold rather than
          // stopping dead at 168 and then jumping; letting go there springs back to MIN_W.
          setSideW(Math.round(x < MIN_W ? MIN_W - (MIN_W - x) / 2 : Math.min(MAX_W, x)));
          if (railed) { setRail(false); foldedAt = Date.now(); }
          // Let an open/fold finish its .24s slide before the drag goes back to tracking 1:1.
          if (Date.now() - foldedAt > 240) app.classList.add('side-resizing');
        }
        grip.addEventListener('lostpointercapture', function () {
          dragTo();   // a flick let go before its frame still lands where it was let go
          app.classList.remove('side-resizing');
          if (app.classList.contains('side-rail')) {
            // Folded: keep the width it had before the drag for when it unfolds.
            if (dragFromW) document.body.style.setProperty('--po-sidebar-w', dragFromW);
            else document.body.style.removeProperty('--po-sidebar-w');
            setRail(true, true);
          } else if (parseInt(document.body.style.getPropertyValue('--po-sidebar-w'), 10) < MIN_W) {
            setSideW(MIN_W);
          }
          HWPOS_STORE.ui.set('sidebarW', parseInt(document.body.style.getPropertyValue('--po-sidebar-w'), 10) || '');
        });
        grip.addEventListener('dblclick', function () {
          document.body.style.removeProperty('--po-sidebar-w');
          HWPOS_STORE.ui.set('sidebarW', '');
        });
      }

      // Fold to an icon rail (desktop only -- CSS ignores .side-rail below 1024px, where the
      // overlay's .side-open rules). A per-device pref, like the width.
      var railBtn = document.getElementById('sideRailBtn');
      function setRail(on, save) {
        app.classList.toggle('side-rail', on);
        railBtn.setAttribute('aria-expanded', String(!on));
        railBtn.querySelector('.tl').textContent = on ? 'Expand navigation' : 'Collapse navigation';
        document.querySelectorAll('.bo-sidebar .side-link').forEach(function (l) {
          var t = l.querySelector('span');
          if (on && t) l.title = t.textContent.trim(); else l.removeAttribute('title');
        });
        if (save) HWPOS_STORE.ui.set('sidebarRail', on ? '1' : '');
      }
      if (HWPOS_STORE.ui.get('sidebarRail') === '1') {
        app.classList.add('side-resizing');   // no slide on load, as with the saved width
        setRail(true);
        void app.offsetWidth;
        app.classList.remove('side-resizing');
      }
      document.addEventListener('keydown', function (e) {
        if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'b' && wide.matches) { e.preventDefault(); railBtn.click(); }
      });
      railBtn.addEventListener('click', function () {
        if (typeof closeSideMenus === 'function') closeSideMenus();
        setRail(!app.classList.contains('side-rail'), true);
      });
      // The store and account menus need the full width, so a badge clicked on the rail unfolds first.
      document.querySelectorAll('.bo-sidebar .side-switch').forEach(function (b) {
        b.addEventListener('click', function () {
          if (app.classList.contains('side-rail') && wide.matches) setRail(false, true);
        });
      });
    })();
  </script>
