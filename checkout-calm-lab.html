<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout Calm Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   CHECKOUT CALM LAB. Round 4: a tablet checkout (iPad landscape first: 1180×820, 1024×768).
   One page that moves forward. The big total sits at the top of the middle column and never moves;
   only the area under it changes: how they pay → that method's one detail → done.
   Every choice is the same 2×2 tile. A tap that decides (a cash amount, a wallet payment arriving)
   finishes the sale; a step that still needs input ends in one "Complete sale" under it.
   The items column is the list itself (no box): tinted head and Total pinned, only the rows scroll.
   Once the sale is done that column prints the actual receipt (printer.js layout).
   Tokens are the back office's --b-* set. Money is integer centavos.
   =========================================================================== */
:root {
  --b-font: "Inter";
  --b-page:      #FFFFFF;
  --b-card:      #F9F9F9;
  --b-raised:    #FFFFFF;
  --b-line:      #ECECEC;
  --b-outline:   #E1E1E1;
  --b-track:     #EFEFEF;
  --b-btn-line:  #D4D4D4;
  --b-ink:       #303030;
  --b-ink-2:     #616161;
  --b-ink-3:     #8C8C8C;
  --b-up:        #047B5D;
  --b-down:      #D72C0D;
  --b-up-tint:   #D3ECDD;
  --b-data-1:    #BCD7FA;
  --b-data-tint: #DCE9FB;
  --b-data-ink:  #1F5FB8;
  --b-t-label:   13px;
  --b-t-meta:    12.5px;
  --b-r-card:    14px;
  --b-r-cell:    10px;
  --b-shadow:    0 1px 2px -1px rgb(26 26 26 / .07);   /* THE card shadow */
  --ease:        cubic-bezier(.2,.8,.2,1);
  --m:           20px;                                  /* the page margin: Cancel's inset, column gutters */
  --tap:         48px;                                  /* the smallest thing a finger hits */
  --items-w:     clamp(340px, 32vw, 420px);
  --cust-h:      50px;                                  /* the customer row on top of the items; its centre lines up with Cancel's */
  --mono:        ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--b-page); color: var(--b-ink);
  font-family: var(--b-font), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--b-t-label); line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; }
h1, h2, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--b-data-1); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- the screen ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) var(--items-w); height: 100vh; height: 100dvh; }
.app[data-side="left"] { grid-template-columns: var(--items-w) minmax(0, 1fr); }
.app[data-side="left"] .items { order: -1; border-left: 0; border-right: 1px solid var(--b-line); }
.pay { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
/* Cancel is a plain text button. Its box is nudged so the chevron's ink sits exactly var(--m) from the top and from the left
   (18px icon: the chevron ink starts 6px in and 5.25px down; 44px box). */
.top { display: flex; align-items: center; gap: 10px; padding: calc(var(--m) - 16.75px) var(--m) 0 calc(var(--m) - 14px); }
.cancel { display: inline-flex; align-items: center; gap: 4px; min-width: 92px; /* Cancel's width, so Back doesn't shift the title */ height: 44px; padding: 0 12px 0 8px; border: 0; border-radius: var(--b-r-cell);
          background: none; color: var(--b-ink); font-size: 15px; font-weight: 560; cursor: pointer; transition: background-color .12s, opacity .25s; }
.cancel:hover { background: #F4F4F4; }
.cancel:active { background: #EDEDED; }
.cancel .ic { width: 18px; height: 18px; stroke-width: 2; color: var(--b-ink-2); }
.is-done .cancel { opacity: 0; pointer-events: none; }
.stage-wrap { overflow: auto; padding: 0 var(--m) 56px; }
.col { width: 100%; max-width: 820px; margin: 0 auto; }
.step > :not(.tiles) { width: 100%; max-width: 440px; justify-self: center; }
.host { position: relative; }

/* the total: one fixed place at the top of the middle; nothing above it ever changes height */
.hero { padding: clamp(16px, 4vh, 40px) 0 clamp(20px, 4vh, 36px); text-align: center; font-size: clamp(54px, 5.4vw, 72px); font-weight: 600;
        letter-spacing: -.04em; line-height: 1; }

/* ---------- a step: one question, its tiles, and (only if needed) Complete sale ---------- */
.step { display: grid; gap: 12px; }
.ask { color: var(--b-ink-2); font-size: 14px; font-weight: 500; text-align: center; }
/* Tiles flow: --cols is how many across the count wants (4 → 2×2, 6 → 3×2, 8 → 4×2). One tile size for every count
   (160×112, near-square), so 4 methods make a compact block about as wide as the total and 8 make a wider one with
   the same air between tiles — never stretched to fill the column. A tight column drops to fewer across on its own. */
.step { --tw: 160px; --gap: 14px; }
.tiles { --cols: 2; display: grid; gap: var(--gap); justify-self: center; width: 100%;
         max-width: calc(var(--cols) * var(--tw) + (var(--cols) - 1) * var(--gap));
         grid-template-columns: repeat(auto-fill, minmax(max(140px, (100% - (var(--cols) - 1) * var(--gap)) / var(--cols)), 1fr)); }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 112px; padding: 0 10px;
        border: 1px solid var(--b-outline); border-radius: var(--b-r-card); background: var(--b-raised); box-shadow: var(--b-shadow);
        font-size: 15px; font-weight: 560; text-align: center; cursor: pointer; transition: background-color .12s, border-color .12s, color .12s, transform .1s; }
.tile:hover { background: #F7F7F7; }
.tile:active { transform: scale(.98); background: #F1F1F1; }
.tile .ic { width: 26px; height: 26px; stroke-width: 1.5; color: var(--b-ink-2); }
.tile .big { font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.tile small { color: var(--b-ink-3); font-size: 12.5px; font-weight: 400; }
.tile small.up { color: var(--b-up); font-weight: 500; }
/* lab: tile fill (Fill button) — grey (default), outline, or a blue tint; a filled tile keeps a clear 1px border so .on still shows */
.app[data-fill="grey"] .tile { background: #F3F3F3; border-color: transparent; box-shadow: none; }
.app[data-fill="grey"] .tile:hover { background: #EDEDED; }
.app[data-fill="grey"] .tile:active { background: #E4E4E4; }
.app[data-fill="blue"] .tile { background: var(--b-data-tint); border-color: transparent; box-shadow: none; color: var(--b-data-ink); }
.app[data-fill="blue"] .tile .ic { color: var(--b-data-ink); }
.app[data-fill="blue"] .tile:hover { filter: brightness(.97); }
.tile.on, .tile.on:hover { background: var(--b-data-tint); border-color: var(--b-data-1); color: var(--b-data-ink); }

/* ---------- buttons (bo-blocks.css shapes at tablet size) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; padding: 0 18px; border-radius: 12px;
       font-size: 15px; font-weight: 600; white-space: nowrap; color: var(--b-ink); background: #fff; border: 1px solid var(--b-btn-line);
       box-shadow: 0 1px 0 rgba(0,0,0,.05); cursor: pointer; user-select: none; transition: background-color .12s, box-shadow .12s, opacity .2s; }
.btn:hover { background: #F7F7F7; }
.btn:active { background: #F0F0F0; box-shadow: none; }
.btn.primary { background: var(--b-ink); color: #fff; border-color: var(--b-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 0 rgba(0,0,0,.2); }
.btn.primary:hover { background: #1F1F1F; border-color: #1F1F1F; }
.btn.primary:active { background: #000; box-shadow: none; }
.btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
.btn .ic { width: 16px; height: 16px; stroke-width: 2; }
.step > .btn { margin-top: 6px; }
/* cash: the typed amount is a full line under the quick amounts, as wide as their row */
.step > .cash-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; max-width: calc(var(--cols) * var(--tw) + (var(--cols) - 1) * var(--gap)); margin-top: 2px; }
.cash-in .field { justify-content: flex-start; height: 56px; font-size: 22px; }
.cash-in .field input { flex: 1; width: auto; }
.cash-in .btn { width: auto; height: 56px; padding: 0 22px; }

/* ---------- typed cash ---------- */
.field { display: flex; align-items: center; justify-content: center; gap: 6px; height: 62px; padding: 0 18px; border: 1px solid var(--b-outline); border-radius: 12px;
         background: var(--b-raised); box-shadow: var(--b-shadow); font-size: 28px; font-weight: 600; letter-spacing: -.02em; cursor: text; }
.field:focus-within { border-color: var(--b-data-1); outline: 2px solid var(--b-data-1); outline-offset: -1px; }
.field .cur { color: var(--b-ink-3); font-weight: 500; }
.field input { width: 7.5ch; min-width: 0; padding: 0; border: 0; outline: 0; background: none; font: inherit; letter-spacing: inherit; }
.field input::placeholder { color: #C8C8C8; }
.change { min-height: 24px; text-align: center; font-size: 17px; font-weight: 560; color: var(--b-ink-3); }
.change.up { color: var(--b-up); }
.change.down { color: var(--b-down); }
.ref { width: 100%; height: 50px; padding: 0 16px; border: 1px solid var(--b-outline); border-radius: 12px; background: var(--b-raised); font-size: 15px; }
.ref:focus { border-color: var(--b-data-1); outline: 2px solid var(--b-data-1); outline-offset: -1px; }

/* ---------- reveal ---------- */
.rv { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .36s var(--ease), opacity .26s; }
.rv.open { grid-template-rows: 1fr; opacity: 1; }
.rv > * { min-height: 0; overflow: hidden; }
.rv-in { display: grid; gap: 10px; padding: 2px; }

/* ---------- GCash / QR Ph: waiting ---------- */
.wait { display: grid; justify-items: center; gap: 14px; }
.qr { width: clamp(160px, 24vh, 196px); aspect-ratio: 1; padding: 12px; border: 1px solid var(--b-outline); border-radius: var(--b-r-card); background: #fff; box-shadow: var(--b-shadow); }
.qr svg { display: block; width: 100%; height: 100%; fill: var(--b-ink); }
.gc { display: grid; justify-items: center; gap: 2px; width: 100%; padding: 18px 14px; border: 1px solid var(--b-outline); border-radius: var(--b-r-card); background: var(--b-card); }
.gc .meta { color: var(--b-ink-3); font-size: 13px; }
.gc-num { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.w-status { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 99px; background: var(--b-track); color: var(--b-ink-2);
            font-size: 14px; font-weight: 500; transition: background-color .3s, color .3s; }
.w-status.ok { background: var(--b-up-tint); color: var(--b-up); }
.spin { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid var(--b-btn-line); border-top-color: var(--b-ink-2); animation: spin .8s linear infinite; }
.w-ok { display: none; }
.w-status.ok .spin { display: none; }
.w-status.ok .w-ok { display: inline-flex; }
.w-ok .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.w-ok path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: draw .3s .05s var(--ease) forwards; }

/* ---------- items column: the list itself, no box ---------- */
.items { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--b-line); }
.list { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
/* the customer sits on top of the list it belongs to; it stays put when the receipt replaces the list */
.i-cust { display: flex; align-items: center; gap: 10px; height: var(--cust-h); padding: 0 var(--m); border: 0; border-bottom: 1px solid var(--b-line); background: none;
          font-size: 14px; font-weight: 560; text-align: left; cursor: pointer; transition: background-color .12s; }
.i-cust:hover { background: #F6F6F6; }
.i-cust span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.i-cust .ic { width: 18px; height: 18px; color: var(--b-ink-2); }
.i-cust .chev { width: 16px; height: 16px; color: var(--b-ink-3); }
.i-head { display: flex; justify-content: space-between; gap: 12px; padding: 11px var(--m); background: var(--b-card); border-bottom: 1px solid var(--b-line);
          color: var(--b-ink-2); font-size: 12px; font-weight: 500; }
.i-rows { overflow-y: auto; overscroll-behavior: contain; }
.i-row { display: flex; align-items: center; gap: 12px; min-height: 45px; padding: 7px var(--m); }
.i-row + .i-row { border-top: 1px solid var(--b-line); }
.i-row .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.i-row .nm small { display: block; color: var(--b-ink-3); font-size: 12px; }
.i-row .amt { font-size: 13px; font-weight: 600; white-space: nowrap; }
.i-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px var(--m) 16px; border-top: 1px solid var(--b-line); }
.i-total .l { font-size: 14px; font-weight: 600; }
.i-total .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }

/* ---------- after the sale: the printed receipt (printer.js layout) ---------- */
.rcpt { position: absolute; inset: var(--cust-h) 0 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--m); background: var(--b-card);
        visibility: hidden; opacity: 0; transition: opacity .25s, visibility 0s .25s; }
.is-done .rcpt { visibility: visible; opacity: 1; transition: opacity .25s; }
.paper { max-width: 340px; margin: 0 auto; padding: 22px 20px 26px; background: #fff; border: 1px solid var(--b-line); border-radius: 4px; box-shadow: 0 1px 3px rgb(26 26 26 / .08);
         font: 12.5px/1.5 var(--mono); color: #1F1F1F; font-variant-numeric: tabular-nums; }
.paper.printing { animation: print .9s var(--ease) both; }
.p-c { text-align: center; }
.p-store { font: 700 18px/1.3 var(--b-font), sans-serif; letter-spacing: -.01em; }
.p-r { display: flex; justify-content: space-between; gap: 12px; }
.p-r > :last-child { white-space: nowrap; }
.p-hr { margin: 8px 0; border-top: 1px dashed #BDBDBD; }
.p-hr.dbl { border-top: 3px double #BDBDBD; }
.p-b { font-weight: 700; }
.p-item + .p-item { margin-top: 3px; }
.p-q { padding-left: 2ch; color: var(--b-ink-2); }
.p-total { font-size: 16px; font-weight: 700; }

/* ---------- sale complete: round 1's moment, unchanged ---------- */
.done { display: grid; justify-items: center; gap: 4px; padding: 16px 0 4px; text-align: center; }
.done > :not(.mark) { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 160ms); }
.mark { position: relative; width: 72px; height: 72px; margin-bottom: 14px; animation: pop .42s var(--ease) both; }
.mark::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--b-up-tint); animation: pulse .85s .38s ease-out both; }
.mark svg { position: relative; display: block; width: 100%; height: 100%; }
.m-c { fill: var(--b-up-tint); stroke: var(--b-up); stroke-width: 3; stroke-dasharray: 189; stroke-dashoffset: 189; transform: rotate(-90deg); transform-origin: center; animation: draw .5s .05s var(--ease) forwards; }
.m-k { fill: none; stroke: var(--b-up); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 36; stroke-dashoffset: 36; animation: draw .3s .42s var(--ease) forwards; }
.done-h { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.done-num { font-size: 64px; font-weight: 600; letter-spacing: -.035em; line-height: 1.1; transition: color .4s; }
.done-num.settled { color: var(--b-up); }
.dl { font-size: 12px; line-height: 1.4; color: var(--b-ink-3); font-weight: 500; }
/* done: the fixed total is gone, so the moment sits in the middle of the column, top to bottom */
.is-done .stage-wrap { display: grid; align-content: center; }
.flow-done { padding-top: 8px; }
/* the total + the first step sit in the middle of the screen on any height; --lift is set once per size (centre()),
   never per step, so the total still never moves while you go through the steps */
#flow { padding-top: var(--lift, 0px); }
.is-done #flow { padding-top: 0; }
/* negative letter-spacing leaves a trailing gap after the last glyph; give it back so the number sits on the axis */
.done-num { margin-right: -.035em; }
/* the one number on this screen is the change to hand back, said in one line */
.done-chg { display: flex; align-items: baseline; justify-content: center; gap: 14px; margin-top: 6px; }
.done-chg > span:first-child { color: var(--b-ink-2); font-size: 22px; font-weight: 560; }
.done-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 380px; margin-top: 28px; }

/* ---------- lab control: small, bottom centre, out of the way ---------- */
.lab { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 99px;
       background: var(--b-track); font-size: 11px; opacity: .55; transition: opacity .15s; }
.lab:hover, .lab:focus-within { opacity: 1; }
.lab button { height: 24px; min-width: 24px; padding: 0 8px; border: 0; border-radius: 99px; background: none; color: var(--b-ink-2); font-weight: 500; cursor: pointer; white-space: nowrap; }
.lab button[aria-pressed="true"] { background: var(--b-raised); color: var(--b-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.lab i { width: 1px; height: 12px; margin: 0 3px; background: var(--b-btn-line); }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes print { from { clip-path: inset(0 0 100% 0); transform: translateY(-24px); } to { clip-path: inset(0 0 0 0); transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<div class="app" id="app" data-side="right" data-fill="grey">
  <section class="pay" aria-label="Payment">
    <header class="top">
      <button type="button" class="cancel" id="back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backText">Cancel</span></button>
    </header>
    <div class="stage-wrap"><div class="col host" id="flow"></div></div>
  </section>
  <aside class="items" aria-label="Items">
    <button type="button" class="i-cust" title="Change customer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>Walk-in customer</span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="list">
      <div class="i-head"><span>Item</span><span>Amount</span></div>
      <div class="i-rows" id="irows"></div>
      <div class="i-total"><span class="l">Total</span><span class="v num" id="total"></span></div>
    </div>
    <div class="rcpt" id="rcpt" aria-label="Receipt"></div>
  </aside>
</div>
<div class="lab" id="lab" role="group" aria-label="Lab controls">
  <button type="button" data-flip title="Move the items column to the other side">Items ⇄</button>
  <i></i>
  <button type="button" data-n="4" title="A 4-item cart">4</button>
  <button type="button" data-n="100" title="A 100-item cart">100</button>
  <i></i>
  <button type="button" data-methods title="A store with 8 payment methods">8 methods</button>
  <i></i>
  <button type="button" data-fill title="Tile fill: outline → grey → blue">Fill: outline</button>
  <i></i>
  <button type="button" data-reset>Reset</button>
</div>

<script>
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

// ---------- money: integer centavos ----------
const commas = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const peso = c => (c < 0 ? '−' : '') + '₱' + commas(String(Math.floor(Math.abs(c) / 100))) + '.' + String(Math.abs(c) % 100).padStart(2, '0');
const pesoShort = c => c % 100 ? peso(c) : peso(c).slice(0, -3);
const toCentavos = buf => { const [p, d = ''] = String(buf).split('.'); return (parseInt(p, 10) || 0) * 100 + parseInt((d + '00').slice(0, 2), 10); };
function sanitize(s) {
  s = s.replace(/[^\d.]/g, '');
  const i = s.indexOf('.');
  if (i > -1) s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, '').slice(0, 2);
  const [p, d] = s.split('.');
  return p.slice(0, 7).replace(/^0+(?=\d)/, '') + (d !== undefined ? '.' + d : '');
}
// Quick cash: Exact, then the next ₱500 / ₱1,000 / ₱5,000 / ₱10,000 above the total — three of them, never below the total.
const above = (t, m) => (Math.floor(t / m) + 1) * m;
const quick = t => [t, ...[...new Set([50000, 100000, 500000, 1000000].map(m => above(t, m)))].slice(0, 3)];
const refNo = () => String(Math.floor(1e12 + Math.random() * 9e12)).replace(/(\d{4})(\d{3})(\d{3})(\d{3})/, '$1 $2 $3 $4');

// ---------- carts ----------
const BASE = [
  {name: 'Flat Washer M10', qty: 20, unit: 'pc', price: 250},
  {name: 'PVC Elbow ½″', qty: 4, unit: 'pc', price: 1875},
  {name: 'Boysen Permacoat 1L, White', qty: 1, unit: 'can', price: 28900},
  {name: 'Teflon Tape 12mm', qty: 1, unit: 'roll', price: 2350},
];
const NAMES = ['Common Nail 2″', 'Deformed Bar 10mm', 'Portland Cement 40kg', 'Marine Plywood ¼″', 'GI Tie Wire #16', 'Paint Brush 2″', 'Sandpaper #120',
  'Electrical Tape, Black', 'Wall Switch 1-gang', 'Duplex Outlet', 'THHN Wire 2.0mm', 'Hacksaw Blade 12″', 'Concrete Screw 3″', 'Brass Hinge 3″', 'Padlock 40mm', 'Cable Tie 8″'];
const SIZES = ['', ', Small', ', Large', ' (pack of 10)', ', Grey', ', Heavy duty'];
// lab: a deterministic 100-line cart (first four lines are the usual ones)
const cartOf = n => n === 4 ? BASE : Array.from({length: n}, (_, i) => i < 4 ? BASE[i]
  : {name: NAMES[i % NAMES.length] + SIZES[Math.floor(i / NAMES.length) % SIZES.length], qty: 1 + (i * 7) % 12, unit: 'pc', price: Math.round((150 + (i * 1373) % 48000) / 25) * 25});
let CART, TOTAL, VATABLE, VAT;
function setCart(n) {
  CART = cartOf(n);
  TOTAL = CART.reduce((s, i) => s + i.qty * i.price, 0);
  VATABLE = Math.round(TOTAL * 100 / 112); VAT = TOTAL - VATABLE; // prices are VAT-inclusive
}

// self-check: the money path
setCart(4);
console.assert(TOTAL === 43750 && VATABLE === 39063 && VAT === 4687, 'totals');
console.assert(peso(43750) === '₱437.50' && peso(100000) === '₱1,000.00' && pesoShort(50000) === '₱500' && peso(-5) === '−₱0.05', 'peso');
console.assert(toCentavos('500') === 50000 && toCentavos('437.5') === 43750 && toCentavos('.05') === 5 && toCentavos('') === 0, 'toCentavos');
console.assert(sanitize('12a3.456') === '123.45' && sanitize('0007') === '7' && sanitize('1.2.3') === '1.23' && sanitize('123456789') === '1234567', 'sanitize');
console.assert(quick(43750).join() === '43750,50000,100000,500000' && quick(2431875).join() === '2431875,2450000,2500000,3000000'
  && quick(90000).join() === '90000,100000,500000,1000000' && quick(50000).join() === '50000,100000,500000,1000000', 'quick');
console.assert(cartOf(100).length === 100 && cartOf(100).every(i => Number.isInteger(i.price) && i.price > 0), 'cart');

// ---------- icons ----------
const svg = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
// step: which screen the tile opens. cash → amounts, wallet → waiting, ref → optional reference + Complete sale, other → pick a kind.
const PHONE = svg('<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01" stroke-width="2.4"/>');
const ALL = {
  cash:   {label: 'Cash', step: 'cash', icon: svg('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8L2 7"/><circle cx="12" cy="14" r="3"/>')},
  gcash:  {label: 'GCash', step: 'wallet', icon: PHONE},
  maya:   {label: 'Maya', step: 'wallet', icon: PHONE},
  qr:     {label: 'QR Ph', step: 'wallet', icon: svg('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h2v2h-2v2h2M18 14h3M18 18h1v1h1v2M21 14v2M14 18v3h2"/>')},
  card:   {label: 'Card', step: 'ref', icon: svg('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>')},
  bank:   {label: 'Bank transfer', step: 'ref', icon: svg('<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>')},
  cheque: {label: 'Cheque', step: 'ref', icon: svg('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 11h6M6 14h9M16 11h2"/>')},
  credit: {label: 'Credit', step: 'ref', icon: svg('<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h5"/>')},
  other:  {label: 'Other', step: 'other', icon: svg('<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>')},
};
const LISTS = {4: ['cash', 'gcash', 'qr', 'other'], 8: ['cash', 'gcash', 'maya', 'qr', 'card', 'bank', 'cheque', 'credit']}; // lab: short vs long store setup
const KINDS = ['Card', 'Bank transfer', 'Maya', 'Cheque'];
const mLabel = id => ALL[id]?.label ?? '';
const cols = n => n <= 4 ? 2 : n <= 6 ? 3 : 4; // how many across the count wants; CSS drops it when space is tight
const tiles = (items, n = cols(items.length)) => `<div class="tiles" style="--cols:${n}">${items.join('')}</div>`;
const CHECK = svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
const MARK = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle class="m-c" cx="32" cy="32" r="30"/><path class="m-k" d="M20 33l8 8 16-17"/></svg>';
let qrCache;
function qrSVG() {
  if (qrCache) return qrCache;
  const n = 25; let s = 7, d = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && rnd() < .5) d += `M${x} ${y}h1v1h-1z`;
  const f = (x, y) => `M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5zM${x + 2} ${y + 2}h3v3h-3z`;
  return qrCache = `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="QR Ph code"><path fill-rule="evenodd" d="${d}${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}"/></svg>`;
}

// ---------- motion (from payment-flows-lab.html) ----------
function tween(el, to, dur = 260, from) {
  if (from === undefined) from = el._v ?? 0;
  el._v = to; cancelAnimationFrame(el._raf);
  if (RM || !dur || from === to) { el.textContent = peso(to); return; }
  const t0 = performance.now();
  const f = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - (1 - k) ** 3;
    el.textContent = peso(Math.round(from + (to - from) * e));
    if (k < 1) el._raf = requestAnimationFrame(f);
  };
  el._raf = requestAnimationFrame(f);
}
// Replace host's content with html: old pane fades out (absolute), new pane slides/fades in, host height animates.
function swap(host, html, dir = 0) {
  const nu = document.createElement('div');
  nu.className = 'pane'; nu.innerHTML = html;
  $$(':scope > [data-leaving]', host).forEach(n => n.remove());
  const old = host.firstElementChild;
  if (!old || RM) { host.replaceChildren(nu); return nu; }
  const h0 = host.offsetHeight;
  old.dataset.leaving = ''; old.inert = true;
  Object.assign(old.style, {position: 'absolute', top: 0, left: 0, right: 0});
  host.append(nu);
  const h1 = host.offsetHeight, ease = 'cubic-bezier(.2,.8,.2,1)', dx = dir * 28;
  old.animate([{opacity: 1, transform: 'none'}, {opacity: 0, transform: `translateX(${-dx}px)`}], {duration: 180, easing: 'ease-in', fill: 'forwards'}).onfinish = () => old.remove();
  nu.animate([{opacity: 0, transform: dir ? `translateX(${dx}px)` : 'translateY(6px)'}, {opacity: 1, transform: 'none'}], {duration: 300, delay: 70, easing: ease, fill: 'backwards'});
  if (h0 !== h1) {
    Object.assign(host.style, {overflow: 'clip', overflowClipMargin: '12px'});
    host.animate([{height: h0 + 'px'}, {height: h1 + 'px'}], {duration: 320, easing: ease}).onfinish = () => { host.style.overflow = ''; };
  }
  return nu;
}

// ---------- the middle: fixed total, one step under it ----------
const app = $('#app'), flow = $('#flow');
let stage, trail = [], timer = 0, orSeq = 131;
const tile = (attrs, inner) => `<button type="button" class="tile" ${attrs}>${inner}</button>`;
const STEPS = {
  method: {
    html: () => `${tiles(LISTS[methodsN].map(id => tile(`data-m="${id}"`, `${ALL[id].icon}<span>${ALL[id].label}</span>`)))}`,
    bind: p => $$('[data-m]', p).forEach(b => b.onclick = () => { const id = b.dataset.m, s = ALL[id].step; open(s === 'cash' || s === 'other' ? s : s + ':' + id); }),
  },
  cash: {
    html: () => { const q = quick(TOTAL); return `
      ${tiles(q.map(v => tile(`data-v="${v}"`, v === TOTAL
        ? '<span class="big">Exact</span><small>No change</small>'
        : `<span class="big num">${pesoShort(v)}</span><small class="up num">Change ${peso(v - TOTAL)}</small>`)), q.length)}
      <div class="cash-in" style="--cols:${q.length}">
        <label class="field num"><span class="cur">₱</span><input class="amt" inputmode="decimal" autocomplete="off" placeholder="Other amount" aria-label="Cash received"></label>
        <button type="button" class="btn primary" data-complete disabled>Complete sale</button></div>
      <div class="change num" aria-live="polite"></div>`; },
    bind: p => {
      $$('[data-v]', p).forEach(b => b.onclick = () => finish({method: 'cash', amount: +b.dataset.v})); // the tap decides
      const inp = $('.amt', p), ch = $('.change', p), go = $('[data-complete]', p);
      inp.oninput = () => {
        const s = sanitize(inp.value); if (s !== inp.value) inp.value = s;
        const t = toCentavos(s), d = t - TOTAL;
        ch.textContent = !t ? '' : d < 0 ? `Short ${peso(-d)}` : d ? `Change ${peso(d)}` : 'No change';
        ch.className = 'change num ' + (!t ? '' : d < 0 ? 'down' : 'up');
        go.disabled = t < TOTAL;
      };
      inp.onkeydown = e => { if (e.key === 'Enter') go.click(); };
      go.onclick = () => { const t = toCentavos(inp.value); if (t >= TOTAL) finish({method: 'cash', amount: t}); }; // no autofocus: a tablet keyboard would cover the tiles
    },
  },
  wallet: {
    html: m => `<h2 class="ask">${m === 'qr' ? 'Customer scans to pay' : 'Customer sends with ' + mLabel(m)}</h2>
      <div class="wait">${m === 'qr' ? `<div class="qr">${qrSVG()}</div>`
        : `<div class="gc"><span class="meta">Send to</span><span class="gc-num num">0917 555 0142</span><span class="meta">EJ Hardware</span></div>`}
        <div class="w-status" aria-live="polite"><span class="spin"></span><span class="w-ok">${CHECK}</span><span class="w-text">Waiting for ${mLabel(m)}…</span></div></div>
      <button type="button" class="btn" data-mark>Mark as paid</button>`,
    bind: (p, m) => {
      const mark = $('[data-mark]', p);
      const ok = () => {
        clearTimeout(timer);
        if (!p.isConnected || mark.disabled) return;
        mark.disabled = true;
        $('.w-status', p).classList.add('ok');
        $('.w-text', p).textContent = 'Payment received';
        const ref = refNo();
        timer = setTimeout(() => finish({method: m, amount: TOTAL, ref}), RM ? 0 : 750); // the payment arriving decides
      };
      timer = setTimeout(ok, 3000); // lab: stands in for the wallet's callback
      mark.onclick = ok;
    },
  },
  other: {
    html: () => `<h2 class="ask">Paid with</h2>
      ${tiles(KINDS.map(k => tile(`data-k="${k}"`, `<span>${k}</span>`)))}
      <div class="rv"><div><div class="rv-in">
        <input class="ref" autocomplete="off" placeholder="Reference no. (optional)" aria-label="Reference number (optional)">
        <button type="button" class="btn primary" data-complete>Complete sale</button></div></div></div>`,
    bind: p => {
      const rv = $('.rv', p); let kind = null;
      rv.inert = true;
      $$('[data-k]', p).forEach(b => b.onclick = () => {
        kind = b.dataset.k;
        $$('[data-k]', p).forEach(x => x.classList.toggle('on', x === b));
        rv.classList.add('open'); rv.inert = false;
      });
      $('.ref', p).onkeydown = e => { if (e.key === 'Enter') $('[data-complete]', p).click(); };
      $('[data-complete]', p).onclick = () => kind && finish({method: 'other', kind, amount: TOTAL, ref: $('.ref', p).value.trim()});
    },
  },
  ref: { // a direct non-cash method (long list): nothing to wait for, just an optional reference
    html: m => `<h2 class="ask">Paid with ${esc(mLabel(m))}</h2>
      <input class="ref" autocomplete="off" placeholder="Reference no. (optional)" aria-label="Reference number (optional)">
      <button type="button" class="btn primary" data-complete>Complete sale</button>`,
    bind: (p, m) => {
      $('.ref', p).onkeydown = e => { if (e.key === 'Enter') $('[data-complete]', p).click(); };
      $('[data-complete]', p).onclick = () => finish({method: 'other', kind: mLabel(m), amount: TOTAL, ref: $('.ref', p).value.trim()});
    },
  },
};
// Centre what you SEE — from the top of the total's digits to the bottom of the tiles — in the viewport. The hero's top
// padding and the space above the digits are invisible, so they're left out (counting them sat the block ~20px low).
// Measured from the method step only, so later, taller or shorter steps grow downward and the total stays put.
// 4 or 8 methods are both two rows, so they land in the same place; a third row re-centres on its own.
let baseH = 0;
function centre() {
  const hero = $('.hero', flow), wrap = $('.stage-wrap');
  if (!hero || !baseH || app.classList.contains('is-done')) return;
  const cs = getComputedStyle(hero);
  const inkTop = parseFloat(cs.paddingTop) + parseFloat(cs.fontSize) * .14; // Inter digits start ~.14em below a line-height:1 box
  // optical centre: 3% of the screen above the true middle — dead centre reads slightly low
  const lift = innerHeight * .47 - (inkTop + hero.offsetHeight + baseH) / 2 - wrap.getBoundingClientRect().top;
  app.style.setProperty('--lift', Math.max(0, Math.round(lift)) + 'px');
}
addEventListener('resize', centre);
function show(key, dir) {
  clearTimeout(timer);
  const [name, arg] = key.split(':'), s = STEPS[name];
  const p = swap(stage, `<div class="step">${s.html(arg)}</div>`, dir);
  s.bind(p, arg);
  if (name === 'method') { baseH = p.offsetHeight; centre(); }
  $('#backText').textContent = trail.length > 1 ? 'Back' : 'Cancel';
}
const open = key => { trail.push(key); show(key, 1); };
function back() {
  if (app.classList.contains('is-done')) return;
  if (trail.length < 2) return; // lab: Cancel on the first step returns to the cart in the real app
  trail.pop(); show(trail.at(-1), -1);
}

// ---------- items column ----------
function paintItems() {
  $('#irows').innerHTML = CART.map(i => `<div class="i-row"><span class="nm">${esc(i.name)}<small class="num">${i.qty} × ${peso(i.price)}</small></span><span class="amt num">${peso(i.qty * i.price)}</span></div>`).join('');
  $('#total').textContent = peso(TOTAL);
}

// ---------- the receipt: printer.js layout() on paper ----------
const via = s => s.method === 'other' ? s.kind : mLabel(s.method);
function receiptHTML(sale) {
  const r = (l, v, cls = '') => `<div class="p-r ${cls}"><span>${l}</span><span>${v}</span></div>`;
  const hr = (cls = '') => `<div class="p-hr ${cls}"></div>`;
  const d = sale.at;
  const date = d.toLocaleDateString('en-PH', {month: 'short', day: 'numeric', year: 'numeric'}) + ' ' + d.toLocaleTimeString('en-PH', {hour: 'numeric', minute: '2-digit'});
  const pay = sale.method === 'cash'
    ? r('CASH', peso(sale.amount)) + (sale.change > 0 ? r('CHANGE', peso(sale.change)) : '')
    : r(esc(via(sale).toUpperCase()), peso(sale.amount)) + (sale.ref ? r('Ref', esc(sale.ref)) : '');
  return `<div class="paper">
    <div class="p-c"><div class="p-store">EJ Hardware</div><div>Main Store, Laguna</div><div>Tel: 0917-000-0000</div></div>
    ${hr()}${r('Receipt #', sale.or)}${r('Date', date)}${r('Cashier', 'Joy')}${r('Register', '1')}
    <div class="p-b">PICKUP</div>
    ${hr()}${CART.map(i => `<div class="p-item"><div>${esc(i.name)}</div>${r(`${i.qty} ${i.unit} × ${peso(i.price)}`, peso(i.qty * i.price), 'p-q')}</div>`).join('')}
    ${hr()}${r('Subtotal', peso(TOTAL))}${r('VATable sales', peso(VATABLE))}${r('VAT (12%)', peso(VAT))}
    ${hr('dbl')}${r('TOTAL', peso(TOTAL), 'p-total')}${pay}
    ${hr()}<div class="p-c"><div class="p-b">Thank you!</div><div>This serves as your official receipt.</div><div>Goods sold are not returnable.</div></div>
  </div>`;
}
function printIn() { // lab: the paper feeds in from the top, like the printer
  const p = $('#rcpt .paper');
  p.classList.remove('printing'); void p.offsetWidth; p.classList.add('printing');
}

// ---------- done ----------
function finish(o) {
  clearTimeout(timer);
  const sale = {...o, or: String(orSeq++).padStart(6, '0'), at: new Date(), change: o.amount - TOTAL};
  const hasChange = sale.change > 0;
  app.classList.add('is-done');
  const p = swap(flow, `<div class="flow-done"><div class="done" aria-live="polite">
    <div class="mark">${MARK}</div>
    <h2 class="done-h" style="--i:1">Sale complete</h2>
    ${hasChange ? `<div class="done-chg" style="--i:2"><span>Change</span><span class="done-num num" data-to="${sale.change}">${peso(0)}</span></div>` : ''}
    <div class="done-acts" style="--i:4"><button type="button" class="btn" data-print>Print receipt</button><button type="button" class="btn primary" data-new>New sale</button></div>
  </div></div>`);
  const n = $('.done-num', p); // only there when there's change; method, cash and total are on the receipt
  if (n) setTimeout(() => { tween(n, +n.dataset.to, 700, 0); setTimeout(() => n.classList.add('settled'), RM ? 0 : 720); }, RM ? 0 : 280);
  const pr = $('[data-print]', p);
  pr.onclick = () => { // lab: fake printer
    pr.disabled = true; pr.textContent = 'Printing…'; printIn();
    setTimeout(() => { pr.disabled = false; pr.innerHTML = `${CHECK} Printed`; }, 900);
  };
  $('[data-new]', p).onclick = () => start();
  const rc = $('#rcpt');
  rc.innerHTML = receiptHTML(sale); rc.scrollTop = 0;
  printIn();
}
function start(n) {
  clearTimeout(timer);
  app.classList.remove('is-done');
  if (n) { setCart(n); paintItems(); $('#irows').scrollTop = 0; }
  const p = swap(flow, `<div class="hero num">${peso(TOTAL)}</div><div class="host" id="stage"></div>`);
  stage = $('#stage', p);
  trail = ['method'];
  show('method', 0);
  paintLab();
}

// ---------- lab control + keys ----------
let cartN = 4, methodsN = 4;
function paintLab() {
  $$('#lab [data-n]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === cartN));
  $('#lab [data-methods]').setAttribute('aria-pressed', methodsN === 8);
  $('#lab [data-fill]').textContent = 'Fill: ' + (app.dataset.fill || 'outline');
  history.replaceState(null, '', `#${app.dataset.side}-${cartN}-${methodsN}-${app.dataset.fill || 'outline'}`);
}
const FILLS = ['outline', 'grey', 'blue'];
$('#lab [data-fill]').onclick = () => { app.dataset.fill = FILLS[(FILLS.indexOf(app.dataset.fill || 'outline') + 1) % 3]; paintLab(); };
$('#lab [data-methods]').onclick = () => { methodsN = methodsN === 4 ? 8 : 4; start(); };
$('#lab [data-flip]').onclick = () => {
  const flip = () => { app.dataset.side = app.dataset.side === 'right' ? 'left' : 'right'; paintLab(); };
  if (document.startViewTransition && !RM) document.startViewTransition(flip); else flip();
};
$$('#lab [data-n]').forEach(b => b.onclick = () => { cartN = +b.dataset.n; start(cartN); });
$('#lab [data-reset]').onclick = () => start();
$('#back').onclick = back;
addEventListener('keydown', e => { if (e.key === 'Escape') back(); });

const [hs, hn, hm, hf] = location.hash.slice(1).split('-');
if (FILLS.includes(hf)) app.dataset.fill = hf;
if (hs === 'left') app.dataset.side = 'left';
if (hn === '100') cartN = 100;
if (hm === '8') methodsN = 8;
start(cartN);
</script>
