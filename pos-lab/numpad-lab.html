<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numpad lab</title>
<!-- One keypad for every number in the POS (checkout cash, split, quantity, discounts, price ask, shift, PIN):
     round keys like the iPhone lock screen, digits only, no letters (owner 2026-10-19). Four takes, light + dark. -->
<style>
:root { --bg: #FFFFFF; --surface: #F9F9F9; --canvas: #F2F2F2; --tile: #F3F3F3; --ink: #303030; --ink-2: #8A8A8A; --line: #E1E1E1; --pk: 76px; }
.dk { --bg: #121212; --canvas: #000000; --tile: #2A2A2A; --ink: #FFFFFF; --ink-2: #8E8E8E; --line: rgba(255, 255, 255, .08); }
* { box-sizing: border-box; margin: 0; }
body { font: 15px/1.4 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; background: #E8E8E8; color: #303030; padding: 24px 16px 48px; }
h1 { font-size: 20px; font-weight: 600; text-align: center; }
.sub { text-align: center; color: #777; margin: 4px 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 700px), 1fr)); gap: 28px 20px; max-width: 1560px; margin: 0 auto; }
.take h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px 4px; }
.take h2 small { font-weight: 400; color: #777; margin-left: 6px; }
.pair { display: flex; flex-wrap: wrap; gap: 10px; }
/* a phone page: the hero amount, then the keys */
.ph { flex: 1 0 330px; height: 600px; border-radius: 28px; background: var(--canvas); color: var(--ink); overflow: hidden;
      display: flex; flex-direction: column; align-items: center; padding: 56px 0 24px; }
.ph p { font-size: 13px; color: var(--ink-2); }
.hero { font-size: 44px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-bottom: auto; }
.kp { display: grid; grid-template-columns: repeat(3, var(--pk)); gap: 14px 22px; margin-top: 28px; }
.kp button { width: var(--pk); height: var(--pk); border: 0; border-radius: 50%; padding: 0; color: var(--ink); cursor: pointer;
             font-family: inherit; font-size: 34px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; display: grid; place-items: center;
             -webkit-tap-highlight-color: transparent; transition: transform .1s, filter .1s, background .1s; }
.kp button:active { transform: scale(.94); }
.kp svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.kp .bare { background: none !important; box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
.ink { margin-top: 22px; height: 50px; width: 220px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: inherit; font-size: 16px; font-weight: 600; }

/* Today's shape (owner 2026-10-19, "keep them as the one now, just add a bit of liquid glass"): .es-kp's
   rounded squares, 56 tall, --es-r 12, 22px digits; on the sheet's white (--bg) and the checkout's grey (--canvas) */
.sq { --es-r: 12px; }
.sq .ph { flex-basis: 300px; height: 540px; padding: 48px 20px 20px; }
.sq .ph.sheet { background: var(--bg); }
.sq .kp { grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.sq .kp button { width: auto; height: 56px; border-radius: var(--es-r); font-size: 22px; font-weight: 500; }
.sq .kp button:active { transform: scale(.97); }
.sq .kp svg { width: 22px; height: 22px; }
.sq .ink { width: 100%; }
/* 0  Today, for reference */
.t0 .kp button { background: var(--tile); }
.t0 .ph:not(.sheet):not(.dk) .kp button, .t1 .ph:not(.sheet):not(.dk) .kp button { background: color-mix(in srgb, var(--surface) 75%, transparent); }   /* checkout: its keys are a step lighter than the page */
/* 1  Grey glass: today's grey, see-through, a light edge on top and a hairline ring */
.t1 .kp button { background: color-mix(in srgb, var(--tile) 70%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
                 box-shadow: 0 0 0 .5px rgb(0 0 0 / .06), inset 0 1px 0 rgb(255 255 255 / .9); }
.t1 .ph.sheet .kp button { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.t1 .ph.dk .kp button { background: color-mix(in srgb, var(--ink) 12%, transparent); box-shadow: 0 0 0 .5px rgb(255 255 255 / .1), inset 0 1px 0 rgb(255 255 255 / .12); }
.t1 .kp button:active { filter: brightness(.94); }
/* 2  Clear glass: the ☰ / Back pill's glass, a key that floats */
.t2 .kp button { background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
                 box-shadow: 0 1px 4px rgb(0 0 0 / .06), 0 0 0 .5px rgb(0 0 0 / .08), inset 0 1px 0 rgb(255 255 255 / .8); }
.t2 .ph.dk .kp button { background: color-mix(in srgb, var(--ink) 14%, color-mix(in srgb, var(--bg) 75%, transparent)); box-shadow: 0 1px 4px rgb(0 0 0 / .3), inset 0 0 0 .5px rgb(255 255 255 / .2); }
.t2 .kp button:active { filter: brightness(.95); }
/* 3  Glass + shine: 2 with a sheen down from the top and a soft shade at the foot */
.t3 .kp button { background: linear-gradient(180deg, rgb(255 255 255 / .95), color-mix(in srgb, var(--tile) 80%, transparent));
                 -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
                 box-shadow: 0 1px 4px rgb(0 0 0 / .07), 0 0 0 .5px rgb(0 0 0 / .09), inset 0 1px 1px rgb(255 255 255 / .95), inset 0 -1px 2px rgb(0 0 0 / .04); }
.t3 .ph.dk .kp button { background: linear-gradient(180deg, rgb(255 255 255 / .16), rgb(255 255 255 / .07));
                        box-shadow: 0 1px 4px rgb(0 0 0 / .4), 0 0 0 .5px rgb(255 255 255 / .14), inset 0 1px 0 rgb(255 255 255 / .18), inset 0 -1px 2px rgb(0 0 0 / .25); }
.t3 .kp button:active { filter: brightness(1.05); }

/* A  Lock screen: the ☰'s glass on every key, . and ⌫ bare like the phone's Delete */
.a .kp button { background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
                box-shadow: 0 1px 4px rgb(0 0 0 / .06), 0 0 0 .5px rgb(0 0 0 / .08), inset 0 1px 0 rgb(255 255 255 / .8); }
.dk.a .kp button, .dk .a .kp button { background: color-mix(in srgb, var(--ink) 16%, transparent); box-shadow: 0 1px 4px rgb(0 0 0 / .3), 0 0 0 .5px rgb(255 255 255 / .12), inset 0 1px 0 rgb(255 255 255 / .1); }
.a .kp button:active { filter: brightness(.94); }

/* B  Liquid drop: A plus a shine across the top and a soft lens rim, like the photo's bubbles */
.b .kp button { background: radial-gradient(120% 90% at 50% 0%, rgb(255 255 255 / .95), rgb(255 255 255 / .55) 45%, color-mix(in srgb, var(--tile) 90%, transparent) 100%);
                -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
                box-shadow: 0 2px 8px rgb(0 0 0 / .08), 0 0 0 .5px rgb(0 0 0 / .1), inset 0 1px 1px rgb(255 255 255 / .9), inset 0 -2px 6px rgb(0 0 0 / .05); }
.dk .b .kp button { background: radial-gradient(120% 90% at 50% 0%, rgb(255 255 255 / .2), rgb(255 255 255 / .1) 50%, rgb(255 255 255 / .08) 100%);
                    box-shadow: 0 2px 8px rgb(0 0 0 / .4), 0 0 0 .5px rgb(255 255 255 / .18), inset 0 1px 1px rgb(255 255 255 / .25), inset 0 -2px 6px rgb(0 0 0 / .3); }
.b .kp button:active { filter: brightness(1.08); }

/* C  Dialer: flat grey circles, the Phone app's keypad; all twelve round */
.c .kp button { background: color-mix(in srgb, var(--ink) 8%, var(--canvas)); }
.c .kp button:active { filter: brightness(.92); }

/* D  Ring: a thin outline only, the old lock screen; fills on press */
.d .kp button { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.dk .d .kp button { box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .22); }
.d .kp button:active { background: var(--tile); }
</style>
</head>
<body>
<h1>Numpad</h1>
<p class="sub">Today's keys with glass, digits only. Tap them. Each take: a sheet (white), checkout (grey), dark.</p>
<div class="grid sq" id="sq"></div>
<h1 style="margin-top:40px">Round</h1>
<p class="sub">The first four, for comparing.</p>
<div class="grid" id="grid"></div>
<script>
const TAKES = [
  ['a', 'A · Lock screen', 'the menu button\'s glass, . and ⌫ bare'],
  ['b', 'B · Liquid drop', 'A with a shine on top, like the photo'],
  ['c', 'C · Dialer', 'flat grey circles, all twelve round'],
  ['d', 'D · Ring', 'thin outline, fills when pressed'],
];
const DEL = '<svg viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>';
const keys = (bare) => [...'123456789', '.', '0', 'del'].map(k => `<button type="button" data-k="${k}"${bare && (k === '.' || k === 'del') ? ' class="bare"' : ''}${k === 'del' ? ' aria-label="Delete"' : ''}>${k === 'del' ? DEL : k}</button>`).join('');
const page = (dk, bare, sheet) => `<div class="ph${dk ? ' dk' : ''}${sheet ? ' sheet' : ''}"><p>Starting cash?</p><div class="hero" data-v="0">₱0</div><div class="kp">${keys(bare)}</div><button type="button" class="ink">Start shift</button></div>`;
document.getElementById('grid').innerHTML = TAKES.map(([c, t, s]) =>
  `<section class="take ${c}"><h2>${t}<small>${s}</small></h2><div class="pair">${page(false, c === 'a' || c === 'b')}${page(true, c === 'a' || c === 'b')}</div></section>`).join('');
const SQ = [
  ['t0', 'Today', 'the grey keys as they are now'],
  ['t1', '1 · Grey glass', 'today\'s grey, see-through, a light top edge'],
  ['t2', '2 · Clear glass', 'the menu and Back buttons\' glass'],
  ['t3', '3 · Glass + shine', '2 with a sheen from the top'],
];
document.getElementById('sq').innerHTML = SQ.map(([c, t, s]) =>
  `<section class="take ${c}" style="grid-column:1/-1"><h2>${t}<small>${s}</small></h2><div class="pair">${page(false, false, true)}${page(false, false, false)}${page(true, false, false)}</div></section>`).join('');
// type like the app's esPress: digits, one dot, two decimals, ⌫
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const h = b.closest('.ph').querySelector('.hero'), k = b.dataset.k; let v = h.dataset.v;
  if (k === 'del') v = v.length > 1 ? v.slice(0, -1) : '0';
  else if (k === '.') { if (!v.includes('.')) v += '.'; }
  else if (!/\.\d\d$/.test(v) && v.replace('.', '').length < 7) v = v === '0' ? k : v + k;
  h.dataset.v = v; h.textContent = '₱' + v.replace(/^(\d+)/, (m) => (+m).toLocaleString('en-PH'));
});
</script>
</body>
</html>
