<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gemini Sidebar Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
<!-- Lab: our POS sidebar in the Gemini iPhone drawer style. All sizes in pt, measured from the owner's
     screenshot (1179×2556 @3x) — see img/gemini-sidebar/measured.png. Reference only, not wired in. -->
<style>
:root {
  --bg: #FAF9F9;
  --pill: #F2F0F0;          /* active row */
  --ink: #000000;           /* labels AND icons — same black */
  --sub: #717070;           /* section titles, subtitle */
  --circle: #FFFFFF;

  --row-h: 44px;
  --list-top: 126px;        /* active pill top */
  --pill-x: 8px;            /* pill 8 in from both sides, fully round */
  --icon-cx: 37.8px;
  --icon-box: 25px;         /* glyphs fill ~17/24 → ~21, Gemini's size */
  --icon-sw: 1.45;          /* 1.5pt line at 25px — same as the text stem */
  --text-x: 65.3px;
  --label-fs: 16.5px;       /* pixel-matched to the screenshot: Google Sans 400 at 16.5 */
  --label-fw: 400;          /* regular: stem 1.33pt, 0.108 of letter height */
  --title-x: 25px;
  --title-cy: 93.6px;        /* text centre; the circles share it */
  --title-fs: 20px;        /* pixel-matched: Google Sans 550 at 20 — smaller and heavier than the rows */
  --circle-d: 48px;
  --circle-cx: 353px;
  --foot-cy: 785.8px;
  --avatar-d: 40px;
  --avatar-cx: 36.8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E5E5E5; }
body {
  font-family: "Google Sans", -apple-system, system-ui, sans-serif;   /* Gemini's own font, free on Google Fonts */
  color: var(--ink); -webkit-font-smoothing: antialiased;
  display: flex; justify-content: center;
}
.phone { position: relative; width: 393px; height: 852px; background: var(--bg); overflow: hidden; }
@media (max-width: 430px) { html, body { background: var(--bg); } .phone { width: 100%; height: 100vh; } }

.title {
  position: absolute; left: var(--title-x); top: var(--title-cy); transform: translateY(-50%);
  font-size: var(--title-fs); font-weight: 550;
}
.circle {
  position: absolute; top: calc(var(--title-cy) - var(--circle-d) / 2);
  left: calc(var(--circle-cx) - var(--circle-d) / 2);
  width: var(--circle-d); height: var(--circle-d); border-radius: 50%; border: 0;
  background: var(--circle); box-shadow: 0 4px 24px rgba(0,0,0,.07); color: var(--ink);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.circle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

nav { position: absolute; top: var(--list-top); left: 0; right: 0; bottom: 0;
  overflow-y: auto; padding-bottom: 120px; scrollbar-width: none; }   /* list runs on under the footer */
nav::-webkit-scrollbar { display: none; }
.head { height: 22px; margin: 21.7px 0 13.5px; padding-left: var(--title-x);   /* row → title 54.7, title → row 46.5 */
  display: flex; align-items: center; font-size: var(--label-fs); color: var(--sub); }
.row {
  position: relative; height: var(--row-h); display: flex; align-items: center;
  font-size: var(--label-fs); font-weight: var(--label-fw); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.row.on::before {
  content: ""; position: absolute; inset: 0 var(--pill-x);
  background: var(--pill); border-radius: 999px;
}
.row > * { position: relative; }
.row .ic { position: absolute; left: calc(var(--icon-cx) - var(--icon-box) / 2);
  width: var(--icon-box); height: var(--icon-box);
  fill: none; stroke: var(--ink); stroke-width: var(--icon-sw); stroke-linecap: round; stroke-linejoin: round; }
/* Gemini-round: big corner radii, circles, round ends. Selected = solid: shapes fill, inner lines cut out in the pill grey. */
.row .ic .dot { fill: var(--ink); stroke: none; }
.row.on .ic .f { fill: var(--ink); }
.row.on .ic .d { stroke: var(--pill); stroke-width: 1.8; }
.row span { position: absolute; left: var(--text-x); transform: translateY(-0.5px); }   /* Gemini sits a hair above centre */
.row .ext { position: relative; top: 1px; margin-left: 4px; width: 14px; height: 14px;
  fill: none; stroke: var(--sub); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.fade {   /* Gemini's frosted footer: rows behind it blur and fade — ~35% ink at 750, ~8% at 840 */
  position: absolute; left: 0; right: 0; top: 712px; bottom: 0;
  background: linear-gradient(rgba(250,249,249,0), rgba(250,249,249,.3) 38px, rgba(250,249,249,.8) 128px);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  -webkit-mask-image: linear-gradient(transparent, #000 32px); mask-image: linear-gradient(transparent, #000 32px);
  pointer-events: none;
}
.foot { position: absolute; left: 0; right: 0; top: var(--foot-cy); height: 0; }
.avatar {
  position: absolute; left: calc(var(--avatar-cx) - var(--avatar-d) / 2); top: calc(var(--avatar-d) / -2);
  width: var(--avatar-d); height: var(--avatar-d); border-radius: 50%;
  background: #1F1F1F; color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
}
.who { position: absolute; left: var(--text-x); top: -21px; font-size: var(--label-fs); line-height: 22px; }
.who small { display: block; font-size: 14px; line-height: 18px; color: var(--sub); }
/* Full page (owner 2026-10-17): ☰ slides the sidebar in from the left over the whole screen, pushing the page out right;
   ✕, a row or a swipe left slides it back. iOS's sheet curve. */
.side, .page { position: absolute; inset: 0; background: var(--bg); transition: transform .45s cubic-bezier(.32,.72,0,1); }
.side { transform: translateX(-100%); }
.phone.open .side { transform: none; }
.phone.open .page { transform: translateX(100%); }
.page .circle { left: calc(393px - var(--circle-cx) - var(--circle-d) / 2); }   /* ☰ mirrors ✕ */
.page .title { left: 0; right: 0; text-align: center; pointer-events: none; }   /* full width: it sat over ☰ */
.gear { position: absolute; left: calc(var(--circle-cx) - 13px); top: -13px; width: 26px; height: 26px;
  fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
</style>
</head>
<body>
<div class="phone">
<main class="page">
  <button class="circle" id="open" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg></button>
  <div class="title" id="pageTitle">Sell</div>
</main>
<aside class="side">
  <div class="title">EJ Hardware</div>
  <button class="circle" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>

  <nav id="nav">
    <div class="row on"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M4 10.3a2 2 0 0 1 .8-1.6l6-4.5a2 2 0 0 1 2.4 0l6 4.5a2 2 0 0 1 .8 1.6V19a2 2 0 0 1-2 2h-3.5v-4.5a2.5 2.5 0 0 0-5 0V21H6a2 2 0 0 1-2-2z"/></svg><span>Sell</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="4.5" y="3" width="15" height="18" rx="4"/><path class="d" d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg><span>Orders</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="2.5"/><circle class="dot" cx="15" cy="15" r="1.4"/><circle class="dot" cx="19" cy="19" r="1.4"/><circle class="dot" cx="19" cy="15" r="1.4"/><circle class="dot" cx="15" cy="19" r="1.4"/></svg><span>QR codes</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M3.5 5.5a2 2 0 0 1 2-2h5.7a2 2 0 0 1 1.4.6l7.6 7.6a2.5 2.5 0 0 1 0 3.5l-5.3 5.3a2.5 2.5 0 0 1-3.5 0l-7.6-7.6a2 2 0 0 1-.3-1.4z"/><circle class="d" cx="8" cy="8" r="1.5"/></svg><span>Items</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle class="f" cx="12" cy="8" r="4"/><path class="f" d="M4.5 19c0-3.2 3.4-5.5 7.5-5.5s7.5 2.3 7.5 5.5a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/></svg><span>Customers</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="8.5"/><path class="d" d="M12 7.5V12l3 2"/></svg><span>Shift</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="17" height="17" rx="5"/><path class="d" d="M8.5 16v-3M12 16V8M15.5 16v-5"/></svg><span>Reports</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="13.5" width="7" height="7" rx="2.5"/></svg><span>Back office<svg class="ext" viewBox="0 0 24 24"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg></span></div>

    <!-- Gemini's "Notebooks" section → Chat: new chat, recent chats, all chats. -->
    <div class="head">Chat</div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5"/><path class="f" d="M12.2 13.6l-2.6.6.6-2.6 7.3-7.3a1.4 1.4 0 0 1 2 2z"/></svg><span>New chat</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7l-1 3.9a.6.6 0 0 0 .7.7l3.9-1A8.5 8.5 0 1 0 12 3.5z"/></svg><span>Low stock this week</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7l-1 3.9a.6.6 0 0 0 .7.7l3.9-1A8.5 8.5 0 1 0 12 3.5z"/></svg><span>Cash short on POS 1</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7l-1 3.9a.6.6 0 0 0 .7.7l3.9-1A8.5 8.5 0 1 0 12 3.5z"/></svg><span>Price of GI pipe ½"</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7l-1 3.9a.6.6 0 0 0 .7.7l3.9-1A8.5 8.5 0 1 0 12 3.5z"/></svg><span>Supplier order for Monday</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle class="dot" cx="5.5" cy="12" r="1.4"/><circle class="dot" cx="12" cy="12" r="1.4"/><circle class="dot" cx="18.5" cy="12" r="1.4"/></svg><span>All chats</span></div>
  </nav>

  <!-- Gemini's account row: avatar + name + plan, gear on the right → our user (log out) + POS, Settings. -->
  <div class="fade"></div>
  <div class="foot">
    <div class="avatar" title="Log out">E</div>
    <div class="who">El John<small>EJ Hardware · POS 1</small></div>
    <svg class="gear" viewBox="0 0 24 24" aria-label="Settings"><circle cx="12" cy="12" r="3"/><path d="M10.3 3.4a1.8 1.8 0 0 1 3.4 0l.3.8a1.8 1.8 0 0 0 2.4 1l.8-.4a1.8 1.8 0 0 1 2.4 2.4l-.4.8a1.8 1.8 0 0 0 1 2.4l.8.3a1.8 1.8 0 0 1 0 3.4l-.8.3a1.8 1.8 0 0 0-1 2.4l.4.8a1.8 1.8 0 0 1-2.4 2.4l-.8-.4a1.8 1.8 0 0 0-2.4 1l-.3.8a1.8 1.8 0 0 1-3.4 0l-.3-.8a1.8 1.8 0 0 0-2.4-1l-.8.4a1.8 1.8 0 0 1-2.4-2.4l.4-.8a1.8 1.8 0 0 0-1-2.4l-.8-.3a1.8 1.8 0 0 1 0-3.4l.8-.3a1.8 1.8 0 0 0 1-2.4l-.4-.8a1.8 1.8 0 0 1 2.4-2.4l.8.4a1.8 1.8 0 0 0 2.4-1z"/></svg>
  </div>
</aside>
</div>
<script>
const phone = document.querySelector('.phone'), open = on => phone.classList.toggle('open', on);
document.getElementById('open').onclick = () => open(true);
document.getElementById('close').onclick = () => open(false);
// Tap a row → the grey pill moves to it, the page takes its name, the sidebar slides away.
document.getElementById('nav').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  document.querySelector('.row.on')?.classList.remove('on'); row.classList.add('on');
  document.getElementById('pageTitle').textContent = row.querySelector('span').firstChild.textContent;
  setTimeout(() => open(false), 150);   // the pill lands first
});
// Swipe right opens, left closes. ponytail: a flick, not a finger-following drag; add the drag if it feels dead on the phone
let x0 = null;
phone.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
phone.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) open(dx > 0); }, { passive: true });
</script>
</body>
</html>
