<style>
/* light theme, measured off gemini.google.com with prefers-color-scheme: light */
:root { --bg: rgb(250,249,249); --side: rgb(255,255,255); --ink: rgb(31,31,31); --icon: rgb(0,0,0); --dim: rgb(68,71,70); --link: rgb(11,87,208); --hover: rgba(0,0,0,.08);
  --side-w: 52px; --ease: cubic-bezier(.2,0,0,1); }
body.open { --side-w: 288px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Google Sans Flex", "Google Sans", Helvetica, Arial, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.ic { font-family: "Luminous Symbols"; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga";
  font-variation-settings: "FILL" 0, "GRAD" 0, "ROND" 100, "opsz" 20, "wght" 320; display: inline-block; width: 1em; height: 1em; overflow: hidden; flex: none; }
.ic.l { font-size: 24px; font-variation-settings: "FILL" 0, "GRAD" 0, "ROND" 100, "opsz" 24, "wght" 300; }
.t13 { font-size: 13px; line-height: 17px; font-variation-settings: "wdth" 92, "wght" 400; }

/* sidebar: 52px rail (page grey) <-> 288px panel (white), 300ms */
.side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w); background: var(--bg); z-index: 2; overflow: hidden;
  transition: width .3s var(--ease), background-color .3s var(--ease); }
body.open .side { background: var(--side); }
.head { position: absolute; left: 0; top: 0; right: 0; height: 52px; }
.logo-btn { position: absolute; left: 8px; top: 10px; width: 36px; height: 36px; border-radius: 9999px; display: grid; place-items: center; }
.logo-btn img { width: 22px; height: 22px; }
.logo-btn .ic { display: none; color: rgba(0,0,0,.55); }
.logo-btn:hover { background: var(--hover); }
body:not(.open) .logo-btn:hover img { display: none; }
body:not(.open) .logo-btn:hover .ic { display: inline-block; }
body.open .logo-btn { pointer-events: none; }
.word { position: absolute; left: 46px; top: 16px; font-size: 17px; line-height: 24px; color: #000; font-variation-settings: "ROND" 20, "wdth" 94, "wght" 470; }
.close { position: absolute; left: 244px; top: 8px; width: 36px; height: 36px; border-radius: 9999px; display: grid; place-items: center; color: rgba(0,0,0,.55); }
.close:hover { background: var(--hover); }
/* labels fade out first, fade in after the slide (Gemini: 150ms, 100ms delay) */
.lbl { opacity: 1; visibility: visible; white-space: nowrap; transition: opacity 150ms linear 100ms, visibility 0s; }
body:not(.open) .lbl { opacity: 0; visibility: hidden; transition: opacity 100ms linear, visibility 0s 100ms; }

.item { position: absolute; left: 8px; width: 272px; height: 32px; padding: 0 8px; border-radius: 9999px; display: flex; align-items: center; gap: 12px; color: #000; }
body:not(.open) .item { left: 10px; width: 32px; }
.item:hover { background: var(--hover); }
.item.off { cursor: default; background: none; }
.item.off > * { opacity: .38; }
.note { position: absolute; left: 18px; top: 144px; display: flex; align-items: center; gap: 8px; color: #000; }
.note a { text-decoration: underline 1.04px dotted; }

.foot-sign { position: absolute; left: 16px; bottom: 14px; height: 36px; padding: 0 12px; border-radius: 9999px; background: rgb(242,240,240); color: #000; font-size: 15px; line-height: 20px; font-variation-settings: "wdth" 92, "wght" 400; }
.foot-sign:hover { background: rgb(230,228,228); }
.acct { position: absolute; left: 14px; bottom: 12px; width: 32px; height: 32px; border-radius: 9999px; display: grid; place-items: center; color: #000; }
.gear { position: absolute; left: 8px; bottom: 50px; width: 36px; height: 36px; border-radius: 9999px; display: grid; place-items: center; color: #000; transition: left .3s var(--ease), bottom .3s var(--ease); }
body.open .gear { left: 244px; bottom: 14px; }
.acct:hover, .gear:hover { background: var(--hover); }
body.open .acct, body:not(.open) .foot-sign { opacity: 0; visibility: hidden; }

/* top right */
.top { position: fixed; top: 12px; right: 12px; display: flex; align-items: center; gap: 8px; z-index: 2; }
.tb { height: 40px; padding: 0 12px; border-radius: 9999px; display: flex; align-items: center; color: var(--link); font-size: 14px; font-weight: 500; font-variation-settings: "wdth" 92, "wght" 370; }
.tb:hover { background: rgba(11,87,208,.08); }
.signin { height: 40px; padding: 0 16px; border-radius: 9999px; background: rgb(194,231,255); color: rgb(0,74,119); font-size: 14px; font-weight: 500; }
.signin:hover { background: rgb(180,220,250); }

/* everything right of the sidebar follows its width */
.stage, main, footer { position: fixed; left: var(--side-w); right: 0; transition: left .3s var(--ease); }
/* the glow: Gemini's .lm-glow (light-blue body, white bloom, both through glow_mask.svg) */
.stage { top: 70px; bottom: 0; overflow: clip; z-index: 0; pointer-events: none; }
.stage::before, .stage::after { content: ""; position: absolute; left: 50%; top: calc(50% + 15px); width: 202.18%; max-width: 1601.27px; aspect-ratio: 1.4338 / 1; transform: translate(-50%, -50%);
  mask-image: var(--glow-mask); mask-size: 100% 200%; mask-repeat: no-repeat; -webkit-mask-image: var(--glow-mask); -webkit-mask-size: 100% 200%; -webkit-mask-repeat: no-repeat; }
.stage::before { background: radial-gradient(ellipse 42% 100% at 66% 81%, #9dd2ff 0, #9dd2ff 50%, #9dd2ff 100%); mask-position: 0 0; -webkit-mask-position: 0 0; }
.stage::after { background: #fff; opacity: .5; mask-position: 0 100%; -webkit-mask-position: 0 100%; }

/* centre column: headline 236, CTA 304, input 398 at 860 tall */
main { top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding-top: calc(50vh - 194px); z-index: 1; }
h1 { margin: 0; font-size: 36px; line-height: 44px; font-weight: 320; font-variation-settings: "ROND" 100, "wdth" 100, "wght" 320; color: var(--ink); text-align: center; }
.cta-wrap { position: relative; margin-top: 24px; display: inline-flex; border-radius: 9999px; isolation: isolate; }
.cta-halo { position: absolute; inset: -2px; border-radius: 9999px; pointer-events: none; opacity: .24; filter: blur(7px);
  background: conic-gradient(from var(--a, 0deg), rgb(66,133,244), rgb(155,114,203), rgb(217,101,112), rgb(255,182,131), rgb(128,218,136), rgb(161,201,255), rgb(66,133,244));
  transition: opacity .24s var(--ease), filter .24s var(--ease); }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
.cta-wrap:hover .cta-halo { opacity: .48; filter: blur(8px); animation: spin 2.4s linear infinite; }
.cta { position: relative; z-index: 1; height: 38px; padding: 0 12px; border: 1px solid rgba(255,255,255,.92); border-radius: 9999px; background: #fff; color: #000;
  font-size: 15px; line-height: 20px; font-variation-settings: "wdth" 92, "wght" 400; transition: border-color .2s; }
.cta:hover { border-color: #fff; }

.input { margin-top: 56px; width: 660px; max-width: calc(100% - 32px); height: 64px; border-radius: 32px; background: #fff; box-shadow: rgba(0,0,0,.16) 0 2px 8px -2px;
  display: flex; align-items: center; padding: 0 16px 0 20px; }
.ibtn { width: 32px; height: 32px; border-radius: 9999px; display: grid; place-items: center; color: var(--icon); flex: none; }
.ibtn:hover, .model:hover { background: var(--hover); }
.editor { flex: 1; min-width: 0; height: 24px; padding: 0; margin-left: 8px; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 17px; line-height: 24px; font-variation-settings: "wdth" 92, "wght" 400; }
.editor::placeholder { color: rgb(95,99,104); }
.model { height: 40px; padding: 0 16px; margin-right: 17px; border-radius: 9999px; display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 14px; font-weight: 500; flex: none; }

footer { bottom: 0; z-index: 1; text-align: center; }
footer p { margin: 16px 0; font-size: 13px; line-height: 17px; color: var(--dim); font-variation-settings: "wdth" 92, "wght" 400; }
footer a { color: var(--dim); text-decoration: underline 1.04px dotted; white-space: nowrap; }
