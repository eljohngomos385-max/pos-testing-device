<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale complete A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* tokens copied from pos-lab/styles.css :root + body.light-theme; the tints and bill pastels are this lab's own */
:root {
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cta-solid: #4388F7;
  --cta-bg: radial-gradient(75% 80% at 50% 120%, #8EC2F0, transparent 85%), linear-gradient(#6A9FF9, var(--cta-solid) 50%, #5592F7);
  --cta-ink: #DDF4FF;
  --cta-shadow: inset 0 0 0 .5px rgb(170 228 255 / .32), inset 1px 1px 1.5px -.5px rgb(170 228 255 / .55), inset -1px -1px 1.5px -.5px rgb(170 228 255 / .45), 0 1px 2px rgb(41 85 151 / .22);
  --hero-fs: 59px; --hero-fw: 550;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
body.light {
  --page: #E7E7E5; --page-ink: #303030;
  --screen: #F2F2F2; --row: #FCFCFC; --soft: #EDEDED; --line: #E1E1E1;
  --ink: #303030; --ink2: #616161; --ink3: #8C8C8C; --ink4: #B5B5B5;
  --lift: inset 0 0 0 .5px rgb(0 0 0 / .05), 0 1px 2px -1px rgb(0 0 0 / .06);
  --home: #1A1A1A;
  --give: #FCE9D6; --give-ink: #7A4512; --give-mid: #B4794A;
  --ok: #DCF0E4;   --ok-ink: #17603F;   --ok-mid: #4E9A76;
  --pay: #DDE9FB;  --pay-ink: #1C4C93;  --pay-mid: #5C88C9;
  --glassy: rgb(255 255 255 / .6);
  --tile: #FFFFFF; --paper: #FFFFFF; --paper-ink: #303030;
  --b1000: #DCE7FA; --b500: #FAF0C4; --b200: #DCEFD6; --b100: #EADCF2; --b50: #F8DADA; --b20: #FCE6D2; --coin: #E9E9E6; --coin-ring: #D6D6D2;
  color-scheme: light;
}
body.dark {
  --page: #050505; --page-ink: #FFFFFF;
  --screen: #121212; --row: #2A2A2A; --soft: #1C1C1C; --line: rgba(255,255,255,.08);
  --ink: #FFFFFF; --ink2: rgba(255,255,255,.70); --ink3: rgba(255,255,255,.45); --ink4: rgba(255,255,255,.28);
  --lift: none;
  --home: #FFFFFF;
  --give: #33261B; --give-ink: #F5CDA6; --give-mid: #B88A62;
  --ok: #1A2E24;   --ok-ink: #A6DDBF;   --ok-mid: #5FA583;
  --pay: #1A2638;  --pay-ink: #B0CCF7;  --pay-mid: #6F98D6;
  --glassy: rgb(255 255 255 / .08);
  --tile: #2A2A2A; --paper: #222222; --paper-ink: #EDEDED;
  --b1000: #22314A; --b500: #3A3420; --b200: #23361F; --b100: #33263C; --b50: #3D2324; --b20: #3D2C1E; --coin: #2C2C2C; --coin-ring: #3A3A3A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--page-ink); font-family: var(--font); font-size: 14px; letter-spacing: -.15px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- page chrome ---------- */
.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 24px; background: var(--page); }
.top h1 { font-size: 17px; font-weight: 590; margin: 0 auto 0 0; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: rgb(118 118 128 / .14); }
.seg button { height: 30px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--page-ink); }
.seg button.on { background: var(--row); box-shadow: 0 3px 8px rgb(0 0 0 / .12), 0 3px 1px rgb(0 0 0 / .04); font-weight: 590; }
.row { display: flex; flex-wrap: wrap; gap: 40px 28px; padding: 8px 24px 48px; }
figure { margin: 0; width: 393px; }
figcaption { margin-top: 14px; font-size: 13px; line-height: 1.45; color: var(--page-ink); opacity: .75; }
figcaption b { display: block; font-size: 15px; font-weight: 590; opacity: 1; color: var(--page-ink); }

/* ---------- phone ---------- */
.phone { position: relative; width: 393px; height: 852px; border-radius: 48px; overflow: hidden; background: var(--screen); color: var(--ink);
         box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 24px 60px -20px rgb(0 0 0 / .25); isolation: isolate; }
body.dark .phone { box-shadow: 0 0 0 1px rgb(255 255 255 / .1); }
.phone::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--home); z-index: 9; }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 54px 16px 30px; }

/* ---------- shared pieces ---------- */
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px;
       background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); font-size: 17px; font-weight: 560; letter-spacing: -.2px; }
.cta .ic { width: 20px; height: 20px; stroke-width: 2; }
.soft { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-radius: 18px; background: var(--row); box-shadow: var(--lift);
        font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.soft .ic { color: var(--ink2); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.duo .soft { justify-content: center; padding: 0 10px; }
.cap { font-size: 17px; font-weight: 500; color: var(--ink2); letter-spacing: -.2px; }
.hero { font-size: var(--hero-fs); font-weight: var(--hero-fw); letter-spacing: -.035em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big { font-size: 72px; }
.word { font-size: 52px; letter-spacing: -.03em; }
.sub { font-size: 15px; color: var(--ink3); font-variant-numeric: tabular-nums; }

/* calm entrance */
.rise { animation: rise .55s var(--ease) both; animation-delay: calc(var(--d, 0) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

/* ===== 1. Big plate ===== */
.c1 .scr { padding-bottom: 12px; }
.c1-top { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding-bottom: 24px; }
.c1-top .sub { margin-top: 4px; }
.c1-plate { margin: 8px -4px 0; height: 236px; border-radius: 36px; flex-direction: column; gap: 12px; font-size: 26px; font-weight: 560; letter-spacing: -.4px; }
.c1-plate .ic { width: 34px; height: 34px; stroke-width: 1.8; }
.c1 { --home: rgb(221 244 255 / .85); }

/* ===== 2. Drawer count ===== */
.c2-head { padding: 34px 8px 0; }
.c2-head .hero { margin-top: 6px; }
.c2-tray { margin-top: 28px; padding: 18px 16px 18px; border-radius: 24px; background: var(--row); box-shadow: var(--lift); }
.c2-tray .t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 560; color: var(--ink3); letter-spacing: 0; }
.c2-tray .t .ic { width: 18px; height: 18px; }
.c2-cash { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.bill, .coin { display: grid; place-items: center; font-size: 17px; font-weight: 590; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.3px;
               animation: deal .5s var(--ease) both; animation-delay: calc(200ms + var(--i) * 90ms); }
.bill { width: 96px; height: 52px; border-radius: 8px; background: var(--b); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .04); }
.coin { width: var(--s); height: var(--s); border-radius: 50%; background: var(--coin); box-shadow: inset 0 0 0 1.5px var(--coin-ring); font-size: 15px; }
@keyframes deal { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
.c2-tray .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.c2-tray.calm { background: var(--tint); box-shadow: none; }
.c2-tray.calm .t { color: var(--tint-mid); }
.c2-tray.calm .say { margin-top: 10px; font-size: 22px; font-weight: 560; letter-spacing: -.4px; color: var(--tint-ink); line-height: 1.25; }
.c2-tray.calm .foot { border-top-color: color-mix(in srgb, var(--tint-mid) 25%, transparent); color: var(--tint-mid); }
.c2-bar { margin-top: auto; display: flex; align-items: flex-start; gap: 6px; }
.c2-bar .round { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.c2-bar .round span:first-child { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--row); box-shadow: var(--lift); color: var(--ink); }
.c2-bar .cta { flex: 1; margin-left: 4px; }

/* ===== 3. Across the counter ===== */
.c3 .scr { padding: 0; }
.c3-cust { height: 400px; flex: none; background: var(--tint); color: var(--tint-ink); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
           transform: rotate(180deg); padding: 40px 24px 70px; text-align: center; }
.c3-cust .cap { color: var(--tint-mid); }
.c3-cust .sub { color: var(--tint-mid); font-size: 17px; }
.c3-me { flex: 1; display: flex; flex-direction: column; padding: 28px 16px 30px; }
.c3-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.c3-line .v { font-size: 40px; font-weight: 560; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.c3-me .sub { padding: 6px 4px 0; }
.c3-me .duo { margin-top: auto; }
.c3-me .cta { margin-top: 10px; }
.c3-seam { position: absolute; left: 0; right: 0; top: 400px; display: flex; justify-content: center; transform: translateY(-50%); }
.c3-seam span { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 13px; background: var(--screen); font-size: 12px; font-weight: 500; color: var(--ink3); }
.c3-seam .ic { width: 15px; height: 15px; }

/* ===== 4. Paper ===== */
.c4-slot { position: relative; z-index: 2; justify-content: center; }
.c4-paperwrap { flex: 1; min-height: 0; margin: 0 22px; overflow: hidden; position: relative; z-index: 1; }
.c4-paper { position: relative; background: var(--paper); color: var(--paper-ink); padding: 22px 22px 34px; font-variant-numeric: tabular-nums;
            box-shadow: 0 1px 3px rgb(0 0 0 / .06); animation: feed 1s var(--ease) both .1s;
            -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 7px repeat-x;
                    mask: linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) bottom / 14px 7px repeat-x; }
@keyframes feed { from { transform: translateY(-100%); } }
.c4-paper .shop { text-align: center; font-size: 13px; font-weight: 590; letter-spacing: .02em; }
.c4-paper .when { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 2px; }
.c4-paper .ln { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; line-height: 1.9; }
.c4-paper .ln span:first-child { color: var(--ink2); }
.c4-paper hr { border: 0; border-top: 1px dashed var(--ink4); margin: 12px 0; }
.c4-paper .ln.tot { font-weight: 590; font-size: 14px; }
.c4-paper .ln.tot span:first-child { color: var(--paper-ink); }
.c4-paper .end { text-align: center; margin-top: 10px; }
.c4-paper .end .cap { font-size: 13px; font-weight: 590; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
.c4-paper .end .hero { font-size: 50px; margin-top: 4px; }
.c4-paper .end .hero.word { font-size: 40px; }
.c4-low { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 16px; }
.c4-low .cta { height: 56px; }

/* ===== 5. Colour field ===== */
.c5 { background: var(--tint); color: var(--tint-ink); --home: var(--tint-ink); }
.c5 .scr { padding: 54px 24px 30px; }
.c5-how { display: flex; align-items: center; gap: 8px; margin-top: 30px; font-size: 15px; font-weight: 500; color: var(--tint-mid); font-variant-numeric: tabular-nums; }
.c5-how .ic { width: 20px; height: 20px; }
.c5-say { margin-top: 26px; font-size: 30px; font-weight: 560; letter-spacing: -.6px; line-height: 1.1; }
.c5 .hero { margin-top: 6px; font-size: 76px; }
.c5 .hero.word { font-size: 64px; line-height: 1; }
.c5-ref { margin-top: 14px; font-size: 15px; color: var(--tint-mid); font-variant-numeric: tabular-nums; }
.c5-low { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.c5-acts { display: flex; flex-direction: column; gap: 8px; }
.c5-acts .soft { background: var(--glassy); box-shadow: none; color: var(--tint-ink); height: 52px; border-radius: 26px; padding: 0 20px 0 16px; }
.c5-acts .soft .ic { color: var(--tint-ink); }
.c5-go { width: 124px; height: 124px; border-radius: 50%; flex-direction: column; gap: 6px; font-size: 17px; }
.c5-go .ic { width: 26px; height: 26px; }

/* ===== 6. Next in line ===== */
.c6 .scr { padding: 54px 12px 30px; }
.c6-card { position: relative; z-index: 2; border-radius: 26px; background: var(--row); box-shadow: 0 10px 30px -8px rgb(0 0 0 / .18), 0 0 0 .5px rgb(0 0 0 / .05); padding: 6px; }
body.dark .c6-card { background: #333333; }   /* --surface-hover: a step above the #2A2A2A tiles */
.c6-res { border-radius: 20px; background: var(--tint); color: var(--tint-ink); padding: 16px 16px 14px; }
.c6-res .l { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.c6-res .cap { color: var(--tint-mid); }
.c6-res .v { font-size: 44px; font-weight: 560; letter-spacing: -.035em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.c6-res .sub { color: var(--tint-mid); margin-top: 2px; }
.c6-card .duo { margin-top: 6px; }
.c6-card .duo .soft { background: transparent; box-shadow: none; height: 48px; }
.c6-grid { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 112px; gap: 6px; margin-top: 12px; align-content: start; }
.c6-grid span { display: flex; align-items: flex-end; padding: 12px; border-radius: 12px; background: var(--tile); font-size: 14px; font-weight: 590; line-height: 1.25; color: var(--ink); }
.c6-hint { text-align: center; font-size: 13px; color: var(--ink3); margin: 10px 0 8px; }
.c6 .cta { margin: 0 auto; width: 260px; }

/* tints per case */
.k-give { --tint: var(--give); --tint-ink: var(--give-ink); --tint-mid: var(--give-mid); }
.k-ok   { --tint: var(--ok);   --tint-ink: var(--ok-ink);   --tint-mid: var(--ok-mid); }
.k-pay  { --tint: var(--pay);  --tint-ink: var(--pay-ink);  --tint-mid: var(--pay-mid); }
</style>
</head>
<body class="light">
<div class="top">
  <h1>Sale complete · A</h1>
  <div class="seg" id="caseSeg"><button data-v="change" class="on">Change</button><button data-v="exact">Exact cash</button><button data-v="gcash">GCash</button></div>
  <div class="seg" id="themeSeg"><button data-v="light" class="on">Light</button><button data-v="dark">Dark</button></div>
</div>
<div class="row" id="row"></div>

<script>
const peso = n => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = n => '₱' + n.toLocaleString('en-PH');   // a bill or coin face: ₱200
const CASES = {
  change: { method: 'cash',  total: 615, paid: 1000, change: 385 },
  exact:  { method: 'cash',  total: 615, paid: 615,  change: 0 },
  gcash:  { method: 'gcash', total: 615, paid: 615,  change: 0, ref: '7012 345 678' },
};
const GRID = ['Brass Faucet 1/2"', 'Teflon Tape 1/2"', 'LED Bulb 9W Daylight', 'Duplex Outlet 2-Gang', 'Switch 1-Gang', 'Electrical Tape Black', 'Circuit Breaker 30A', 'Wood Screw #8 × 1"', 'Hex Bolt M10 × 100mm', 'Flat Washer M10', 'Claw Hammer 16oz', 'Phillips Screwdriver'];
const ITEMS = [['Circuit Breaker 30A', 320], ['Claw Hammer 16oz', 285], ['Teflon Tape 1/2"', 10]];

// the change as Philippine bills and coins, largest first (greedy works for the peso's denominations)
const BILLS = [1000, 500, 200, 100, 50], COINS = [20, 10, 5, 1];
function breakdown(amount) {
  let left = Math.round(amount), out = [];
  for (const d of [...BILLS, ...COINS]) while (left >= d) { out.push(d); left -= d; }
  return out;   // ponytail: whole pesos only; centavo coins when a price ever ends in .25
}
console.assert(breakdown(385).join() === '200,100,50,20,10,5', 'breakdown 385');
console.assert(breakdown(0).length === 0, 'breakdown 0');

const P = {
  print: '<path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v6H7z"/>',
  rcpt:  '<path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  plus:  '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M4 12.5l5.2 7.1L19.8 4.4"/>',
  cash:  '<rect x="3" y="6.5" width="18" height="11" rx="2"/><circle cx="12" cy="12" r="2.4"/>',
  phone: '<rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 18h2"/>',
  drawer:'<path d="M4 10h16v9H4z"/><path d="M6 10l1.5-4h9L18 10"/><path d="M10 14.5h4"/>',
  flip:  '<path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/>',
};
const I = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const printBtn = (d = 3) => `<button class="soft rise" style="--d:${d}">${I('print')}Print receipt</button>`;
const showBtn = (d = 3) => `<button class="soft rise" style="--d:${d}">${I('rcpt')}Show receipt</button>`;
const newSale = (cls = '', d = 4, inner = `${I('plus')}New sale`) => `<button class="cta rise ${cls}" style="--d:${d}">${inner}</button>`;

// one case, read the way every concept needs it
const noChange = s => s.give ? peso(s.change) : 'No change';   // the big figure is only ever money going back
function read(c) {
  const give = c.change > 0, gcash = c.method === 'gcash';
  return { ...c, give, gcash, k: give ? 'k-give' : gcash ? 'k-pay' : 'k-ok' };
}

const CONCEPTS = [
  { name: 'Big plate', line: 'New sale is the bottom third of the screen: a thumb finds it without looking while the other hand is in the drawer.',
    draw: s => `
      <div class="c1-top">
        <div class="cap rise">${s.give ? 'Give back' : s.gcash ? 'Paid with GCash' : 'Exact cash'}</div>
        <div class="hero big rise ${s.give ? '' : 'word'}" style="--d:1">${noChange(s)}</div>
        <div class="sub rise" style="--d:2">${s.give ? `${peso(s.paid)} cash · ${peso(s.total)} sale` : s.gcash ? `${peso(s.total)} paid · Ref ${s.ref}` : `${peso(s.total)} paid · nothing to give back`}</div>
      </div>
      <div class="duo">${printBtn()}${showBtn()}</div>
      ${newSale('c1-plate', 4)}` },

  { name: 'Drawer count', line: 'Says what to do with the drawer: the exact bills and coins to take out, or that it can stay shut.',
    draw: s => {
      let i = 0;
      const pieces = breakdown(s.change).map(d => BILLS.includes(d)
        ? `<span class="bill" style="--b:var(--b${d});--i:${i++}">${short(d)}</span>`
        : `<span class="coin" style="--s:${({ 20: 60, 10: 54, 5: 50, 1: 44 })[d]}px;--i:${i++}">${short(d)}</span>`).join('');
      const tray = s.give
        ? `<div class="c2-tray rise" style="--d:2"><div class="t">${I('drawer')}Take from the drawer</div><div class="c2-cash">${pieces}</div>
             <div class="foot">${peso(s.paid)} cash in · ${peso(s.total)} sale</div></div>`
        : s.gcash
        ? `<div class="c2-tray calm ${s.k} rise" style="--d:2"><div class="t">${I('phone')}GCash</div><div class="say">No cash. The drawer stays shut.</div>
             <div class="foot">${peso(s.total)} · Ref ${s.ref}</div></div>`
        : `<div class="c2-tray calm ${s.k} rise" style="--d:2"><div class="t">${I('drawer')}Exact cash</div><div class="say">Put ${peso(s.paid)} in the drawer.</div>
             <div class="foot">Nothing to give back</div></div>`;
      return `
      <div class="c2-head">
        <div class="cap rise">${s.give ? 'Give back' : s.gcash ? 'Paid with GCash' : 'Paid in cash'}</div>
        <div class="hero big rise ${s.give ? '' : 'word'}" style="--d:1">${noChange(s)}</div>
      </div>
      ${tray}
      <div class="c2-bar rise" style="--d:3">
        <button class="round"><span>${I('print')}</span><span>Print receipt</span></button>
        <button class="round"><span>${I('rcpt')}</span><span>Show receipt</span></button>
        ${newSale('', 3)}
      </div>`; } },

  { name: 'Across the counter', line: 'Lay the phone flat: the top half reads right-side up for the customer, the bottom half is yours.',
    draw: s => `
      <div class="c3-cust ${s.k}">
        <div class="cap rise">${s.give ? 'Your change' : s.gcash ? 'Paid with GCash' : 'Paid in cash'}</div>
        <div class="hero big rise" style="--d:1">${s.give ? peso(s.change) : peso(s.total)}</div>
        <div class="sub rise" style="--d:2">${s.gcash ? `Ref ${s.ref}` : 'Thank you!'}</div>
      </div>
      <div class="c3-seam"><span>${I('flip')}Customer side</span></div>
      <div class="c3-me">
        <div class="c3-line rise" style="--d:2"><span class="cap">${s.give ? 'Give back' : s.gcash ? 'GCash' : 'Exact cash'}</span><span class="v">${noChange(s)}</span></div>
        <div class="sub rise" style="--d:2">${s.give ? `${peso(s.paid)} cash · ${peso(s.total)} sale` : s.gcash ? `${peso(s.total)} received · nothing to give back` : `${peso(s.total)} paid · nothing to give back`}</div>
        <div class="duo">${printBtn()}${showBtn()}</div>
        ${newSale()}
      </div>` },

  { name: 'Paper', line: 'The receipt feeds out under Print receipt, the change printed big at its foot; the screen is the slip.',
    draw: s => `
      <button class="soft c4-slot">${I('print')}Print receipt</button>
      <div class="c4-paperwrap"><div class="c4-paper">
        <div class="shop">EJ HARDWARE</div><div class="when">POS 1</div>
        <hr>
        ${ITEMS.map(([n, p]) => `<div class="ln"><span>${n}</span><span>${peso(p)}</span></div>`).join('')}
        <hr>
        <div class="ln tot"><span>Total</span><span>${peso(s.total)}</span></div>
        <div class="ln"><span>${s.gcash ? 'GCash' : 'Cash'}</span><span>${peso(s.paid)}</span></div>
        ${s.gcash ? `<div class="ln"><span>Ref</span><span>${s.ref}</span></div>` : ''}
        <hr>
        <div class="end">${s.give ? '<div class="cap">Change</div>' : ''}
          <div class="hero ${s.give ? '' : 'word'}">${noChange(s)}</div></div>
      </div></div>
      <div class="c4-low">${showBtn(5)}${newSale('', 5)}</div>` },

  { name: 'Colour field', line: 'The whole screen takes a soft tint: peach = money goes back, mint = done, blue = GCash. Read from a step away.',
    draw: s => `
      <div class="c5-how rise">${I(s.gcash ? 'phone' : 'cash')}${s.gcash ? 'GCash' : `${peso(s.paid)} cash`} · ${peso(s.total)} sale</div>
      <div class="c5-say rise" style="--d:1">${s.give ? 'Give back' : s.gcash ? 'Paid.' : 'Exact.'}</div>
      <div class="hero rise ${s.give ? '' : 'word'}" style="--d:2">${noChange(s)}</div>
      ${s.gcash ? `<div class="c5-ref rise" style="--d:2">Ref ${s.ref}</div>` : ''}
      <div class="c5-low">
        <div class="c5-acts">${printBtn()}${showBtn()}</div>
        ${newSale('c5-go', 4, `${I('plus')}<span>New sale</span>`)}
      </div>` },

  { name: 'Next in line', line: 'The Sell page is already back, the result rides on top. New sale sits where Check out was; or just tap the next customer’s first item.',
    draw: s => `
      <div class="c6-card rise">
        <div class="c6-res">
          <div class="l"><span class="cap">${s.give ? 'Give back' : s.gcash ? 'GCash' : 'Exact cash'}</span><span class="v">${noChange(s)}</span></div>
          <div class="sub">${s.give ? `${peso(s.paid)} cash · ${peso(s.total)} sale` : s.gcash ? `${peso(s.total)} paid · Ref ${s.ref}` : `${peso(s.total)} paid`}</div>
        </div>
        <div class="duo">${printBtn(1)}${showBtn(1)}</div>
      </div>
      <div class="c6-grid rise" style="--d:2">${GRID.map(n => `<span>${n}</span>`).join('')}</div>
      <div class="c6-hint rise" style="--d:3">or tap the next item</div>
      ${newSale('', 3)}` },
];

let state = 'change';
function render() {
  const s = read(CASES[state]);
  document.getElementById('row').innerHTML = CONCEPTS.map((c, n) => `
    <figure data-n="${n + 1}">
      <div class="phone c${n + 1} ${s.k}"><div class="scr">${c.draw(s)}</div></div>
      <figcaption><b>${n + 1}. ${c.name}</b>${c.line}</figcaption>
    </figure>`).join('');
}
function seg(id, fn) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...b.parentNode.children].forEach(x => x.classList.toggle('on', x === b));
    fn(b.dataset.v);
  });
}
seg('caseSeg', v => { state = v; render(); });
seg('themeSeg', v => { document.body.className = v; render(); });
render();
</script>
</body>
</html>
