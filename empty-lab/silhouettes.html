<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silhouettes</title>
<style>
body { margin: 0; background: #F2F2F2; font: 14px "Inter", -apple-system, "Segoe UI", sans-serif; color: #303030; }
header { padding: 28px 40px 0; } h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; } header p { margin: 0; color: #8C8C8C; max-width: 70ch; line-height: 1.45; }
.sz { margin-top: 14px; display: flex; gap: 6px; } .sz button { font: inherit; border: 0; border-radius: 999px; padding: 7px 14px; background: #E4E4E4; color: #616161; cursor: pointer; } .sz button.on { background: #303030; color: #fff; }
main { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 40px 60px; }
figure { margin: 0; } figure img { display: block; width: var(--s, 320px); height: var(--s, 320px); }
figcaption { display: flex; justify-content: space-between; margin-top: 4px; padding: 0 8px; color: #616161; } figcaption a { color: #4388F7; text-decoration: none; }
</style></head><body>
<header><h1>Silhouettes · 19</h1>
<p>Each one is its own .svg file in empty-lab/silhouettes/: vector shapes plus SVG blur and grain, drawn by the browser at whatever size it is shown, so it stays sharp on any screen. Use the sizes to zoom in.</p>
<div class="sz"><button class="on" data-s="320">320px</button><button data-s="525">525px</button><button data-s="800">800px</button><button data-s="1200">1200px</button></div></header>
<main><figure><img src="silhouettes/search.svg" alt="search"><figcaption><span>search</span><a href="silhouettes/search.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/box.svg" alt="box"><figcaption><span>box</span><a href="silhouettes/box.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/folder.svg" alt="folder"><figcaption><span>folder</span><a href="silhouettes/folder.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/folders.svg" alt="folders"><figcaption><span>folders</span><a href="silhouettes/folders.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/tags.svg" alt="tags"><figcaption><span>tags</span><a href="silhouettes/tags.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/bag.svg" alt="bag"><figcaption><span>bag</span><a href="silhouettes/bag.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/receipt.svg" alt="receipt"><figcaption><span>receipt</span><a href="silhouettes/receipt.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/person.svg" alt="person"><figcaption><span>person</span><a href="silhouettes/person.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/people.svg" alt="people"><figcaption><span>people</span><a href="silhouettes/people.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/chart.svg" alt="chart"><figcaption><span>chart</span><a href="silhouettes/chart.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/cash.svg" alt="cash"><figcaption><span>cash</span><a href="silhouettes/cash.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/clock.svg" alt="clock"><figcaption><span>clock</span><a href="silhouettes/clock.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/sliders.svg" alt="sliders"><figcaption><span>sliders</span><a href="silhouettes/sliders.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/addon.svg" alt="addon"><figcaption><span>addon</span><a href="silhouettes/addon.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/discount.svg" alt="discount"><figcaption><span>discount</span><a href="silhouettes/discount.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/printer.svg" alt="printer"><figcaption><span>printer</span><a href="silhouettes/printer.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/truck.svg" alt="truck"><figcaption><span>truck</span><a href="silhouettes/truck.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/eye.svg" alt="eye"><figcaption><span>eye</span><a href="silhouettes/eye.svg" download>.svg</a></figcaption></figure><figure><img src="silhouettes/barcode.svg" alt="barcode"><figcaption><span>barcode</span><a href="silhouettes/barcode.svg" download>.svg</a></figcaption></figure></main>
<script>document.querySelectorAll('.sz button').forEach(b => b.onclick = () => { document.body.style.setProperty('--s', b.dataset.s + 'px'); document.querySelectorAll('.sz button').forEach(x => x.classList.toggle('on', x === b)); });</script>
</body></html>
