<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty states · A3 Orb</title>
<style>
  /* body.light-theme in pos-lab/styles.css — white first */
  :root {
    --bg: #FFFFFF; --bg-soft: #EDEDED; --surface: #F9F9F9; --line: #E1E1E1;
    --ink: #303030; --ink-secondary: #616161; --ink-tertiary: #8C8C8C;
    --cta-solid: #4388F7;
    --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --page: #EDEDED;
    /* orb recipe — measured on ref-12, proven in a3-orb-copy.html, see refs/a3-orb-notes.md.
       Ref's Azure #3875FC swapped for the app blue; Iris and the light end keep the ref's step from it. */
    --o0: #6C5BEF;   /* Iris core, t 0 */
    --o1: #6365F1;   /* t .139 */
    --o2: #5970F3;   /* t .278 */
    --o3: #4E7CF5;   /* t .417 */
    --o4: var(--cta-solid); /* Azure body, t .556 */
    --o5: #5C9BF8;   /* t .694 */
    --o6: #7FB6F9;   /* t .833 */
    --o7: #A8D5FB;   /* t .972 */
    --o8: #B0DBFB;   /* t 1, the lower rim */
    --mist: #C9EEFF; --mist-o: .8;   /* rim light inside the edge */
  }
  /* pos-lab/styles.css :root (dark). Orb values are a guess: no dark ref. Lower rim less pale so it doesn't glare on #121212. */
  body.dark {
    --bg: #121212; --bg-soft: #1C1C1C; --surface: #2A2A2A; --line: rgba(255,255,255,.08);
    --ink: #FFFFFF; --ink-secondary: rgba(255,255,255,.70); --ink-tertiary: rgba(255,255,255,.45);
    --page: #0A0A0A;
    --o5: #5494F8; --o6: #6CA6F9; --o7: #87BAFA; --o8: #8DBEFA;
    --mist-o: .45;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-stack); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 28px 40px 8px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-tertiary); margin-top: 4px; letter-spacing: 0; }
  .toggle { display: flex; background: var(--bg-soft); border-radius: 999px; padding: 3px; }
  .toggle button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-secondary); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  body.dark .toggle button[aria-pressed="true"] { background: var(--surface); }
  main { padding: 0 40px 48px; }
  h2 { font-size: 15px; font-weight: 600; color: var(--ink-secondary); margin: 30px 0 14px; }
  .grid { display: flex; flex-wrap: wrap; gap: 22px 18px; }
  figure { margin: 0; }
  .card { width: 300px; height: 420px; background: var(--bg); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 28px 20px; text-align: center; border: 1px solid var(--line); }
  .card svg { width: 128px; height: 128px; margin-bottom: 26px; }
  .card b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .card p { margin: 8px 0 0; font-size: 14px; line-height: 1.35; color: var(--ink-tertiary); }
  figcaption { font-size: 12px; color: var(--ink-tertiary); margin-top: 8px; padding-left: 4px; }
</style>
</head>
<body>
<header>
  <h1>A3 · Orb<small>One opaque object per state, lit like the orb in ref-12: violet core near the top, app blue body, pale Mist toward the lower rim. Details are cut out of it.</small></h1>
  <div class="toggle" role="group" aria-label="Theme">
    <button id="tLight" aria-pressed="true">Light</button>
    <button id="tDark" aria-pressed="false">Dark</button>
  </div>
</header>
<main id="main"></main>

<!-- One gradient for every picture: objectBoundingBox, so it maps onto each object's own box. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <radialGradient id="orb" fx="0.4444" fy="0.31" cx="0.4789" cy="0.4189" r="0.5906">
    <stop offset="0"      style="stop-color:var(--o0)"/>
    <stop offset="0.1389" style="stop-color:var(--o1)"/>
    <stop offset="0.2778" style="stop-color:var(--o2)"/>
    <stop offset="0.4167" style="stop-color:var(--o3)"/>
    <stop offset="0.5556" style="stop-color:var(--o4)"/>
    <stop offset="0.6944" style="stop-color:var(--o5)"/>
    <stop offset="0.8333" style="stop-color:var(--o6)"/>
    <stop offset="0.9722" style="stop-color:var(--o7)"/>
    <stop offset="1"      style="stop-color:var(--o8)"/>
  </radialGradient>
</svg>

<script>
// Each art = body (one merged silhouette, 140-unit box) + cut (holes through it). No second layer.
const seal = (() => {  // discount badge: 12 soft scallops
  let d = '';
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * 2 * Math.PI - Math.PI / 2, r = i % 2 ? 60 : 50;
    const x = (70 + r * Math.cos(a)).toFixed(1), y = (70 + r * Math.sin(a)).toFixed(1);
    d += i === 0 ? `M${x} ${y}` : i % 2 ? `Q${x} ${y} ` : `${x} ${y}`;
  }
  const a = -Math.PI / 2; return d + `${(70 + 50 * Math.cos(a)).toFixed(1)} ${(70 + 50 * Math.sin(a)).toFixed(1)}Z`;
})();
const ART = {
  search: {   /* lens ring + handle, one shape */
    body: '<circle cx="58" cy="58" r="42"/><rect x="-12" y="0" width="24" height="56" rx="12" transform="translate(84 84) rotate(-45)"/>',
    cut:  '<circle cx="58" cy="58" r="25"/>',
  },
  tag: {
    body: '<path d="M58 30H112Q124 30 124 42V98Q124 110 112 110H58Q52 110 47 105L20 78Q14 70 20 62L47 35Q52 30 58 30Z"/>',
    cut:  '<circle cx="46" cy="70" r="8"/>',
  },
  folder: {
    body: '<path d="M14 40Q14 28 26 28H54Q61 28 65 33L72 42H114Q126 42 126 54V104Q126 116 114 116H26Q14 116 14 104Z"/>',
  },
  box: {   /* open box: flaps grow out of the body's top corners */
    body: '<path d="M24 58L10 36Q7 30 14 30L60 34L66 58Z"/><path d="M116 58L130 36Q133 30 126 30L80 34L74 58Z"/><rect x="22" y="54" width="96" height="66" rx="12"/>',
    cut:  '<rect x="54" y="76" width="32" height="8" rx="4"/>',
  },
  bag: {
    body: '<path fill-rule="evenodd" d="M44 58V44A26 26 0 0 1 96 44V58H84V44A14 14 0 0 0 56 44V58Z"/><path d="M26 64Q26 52 38 52H102Q114 52 114 64L118 110Q119 122 107 122H33Q21 122 22 110Z"/>',
  },
  receipt: {
    body: '<path d="M28 30Q28 18 40 18H100Q112 18 112 30V122L103 114L94 122L85 114L76 122L67 114L58 122L49 114L40 122L28 112Z"/>',
    cut:  '<rect x="44" y="40" width="52" height="8" rx="4"/><rect x="44" y="58" width="36" height="8" rx="4"/><rect x="44" y="84" width="52" height="8" rx="4"/>',
  },
  calendar: {
    body: '<rect x="18" y="28" width="104" height="92" rx="16"/><rect x="38" y="14" width="14" height="26" rx="7"/><rect x="88" y="14" width="14" height="26" rx="7"/>',
    cut:  '<rect x="80" y="82" width="24" height="22" rx="6"/>',
  },
  select: {   /* a list panel: rows cut into it */
    body: '<rect x="18" y="18" width="104" height="104" rx="18"/>',
    cut:  '<circle cx="40" cy="44" r="6"/><rect x="54" y="40" width="46" height="8" rx="4"/><circle cx="40" cy="70" r="6"/><rect x="54" y="66" width="34" height="8" rx="4"/><circle cx="40" cy="96" r="6"/><rect x="54" y="92" width="40" height="8" rx="4"/>',
  },
  grid: {   /* four rounded tiles side by side: one plane, one light, nothing on top of anything */
    body: '<rect x="18" y="18" width="48" height="48" rx="15"/><rect x="74" y="18" width="48" height="48" rx="15"/><rect x="18" y="74" width="48" height="48" rx="15"/><rect x="74" y="74" width="48" height="48" rx="15"/>',
  },
  toggle: {   /* "on" track, the knob is a hole (white like a real knob) */
    body: '<rect x="10" y="40" width="120" height="60" rx="30"/>',
    cut:  '<circle cx="100" cy="70" r="20"/>',
  },
  plus: {
    body: '<circle cx="70" cy="70" r="54"/>',
    cut:  '<rect x="65" y="44" width="10" height="52" rx="5"/><rect x="44" y="65" width="52" height="10" rx="5"/>',
  },
  percent: {
    body: `<path d="${seal}"/>`,
    cut:  '<circle cx="54" cy="54" r="8"/><circle cx="86" cy="86" r="8"/><rect x="-5" y="-30" width="10" height="60" rx="5" transform="translate(70 70) rotate(45)"/>',
  },
  person: {   /* head and shoulders joined at the neck */
    body: '<circle cx="70" cy="46" r="27"/><path d="M24 112Q24 70 70 70Q116 70 116 112V114Q116 122 108 122H32Q24 122 24 114Z"/>',
  },
  cash: {
    body: '<rect x="12" y="32" width="116" height="76" rx="14"/>',
    cut:  '<circle cx="70" cy="70" r="17"/><circle cx="32" cy="70" r="5"/><circle cx="108" cy="70" r="5"/>',
  },
  clock: {
    body: '<circle cx="70" cy="70" r="54"/>',
    cut:  '<rect x="65" y="34" width="10" height="42" rx="5"/><rect x="65" y="65" width="32" height="10" rx="5"/>',
  },
  printer: {
    body: '<rect x="38" y="16" width="64" height="40" rx="8"/><rect x="12" y="46" width="116" height="58" rx="16"/><rect x="36" y="90" width="68" height="34" rx="6"/>',
    cut:  '<rect x="26" y="86" width="88" height="5" rx="2.5"/><circle cx="108" cy="66" r="6"/><rect x="48" y="102" width="44" height="6" rx="3"/>',
  },
  bars: {   /* three bars on one base */
    body: '<rect x="18" y="58" width="28" height="64" rx="9"/><rect x="56" y="24" width="28" height="98" rx="9"/><rect x="94" y="42" width="28" height="80" rx="9"/><rect x="18" y="104" width="104" height="18" rx="9"/>',
  },
};

const PAGES = [
  ['Sell', [
    ['search',  'No results',               'Try another word or spelling.',      'Sell · search'],
    ['tag',     'No items yet',             'Add items to start selling.',        'Sell · catalog empty'],
    ['folder',  'No items in this category','Move items here from Items.',        'Sell · empty category'],
    ['box',     'All sold out',             'Every option of this item is out.',  'Sell · variants sold out'],
    ['bag',     'Cart is empty',            'Tap an item to add it.',             'Sell · cart'],
    ['search',  'No customer found',        'Check the name or phone number.',    'Sell · customer picker'],
  ]],
  ['Orders', [
    ['receipt', 'No orders yet',            'Sales on this POS show up here.',    'Orders · no orders'],
    ['calendar','Nothing sold today',       'Today’s sales show up here.',        'Orders · today'],
    ['search',  'No orders match',          'Try clearing a filter.',             'Orders · filters'],
    ['select',  'No order selected',        'Pick one from the list.',            'Orders · iPad detail pane'],
  ]],
  ['Items', [
    ['tag',     'No items yet',             'Add your first item with +.',        'Items · items'],
    ['grid',    'No categories',            'Group items, like Drinks or Snacks.','Items · categories'],
    ['toggle',  'No modifiers yet',         'Choices like size or sugar level.',  'Items · modifiers'],
    ['plus',    'No add-ons yet',           'Extras sold with an item.',          'Items · add-ons'],
    ['percent', 'No discounts yet',         'Save one to use at checkout.',       'Items · discounts'],
  ]],
  ['Customers', [
    ['person',  'No customers yet',         'Save a customer to see their orders.','Customers · list'],
    ['select',  'No customer selected',     'Pick one from the list.',            'Customers · iPad detail pane'],
  ]],
  ['Shift', [
    ['cash',    'No cash in or out yet',    'Drawer money moves show up here.',   'Shift · cash in / out'],
    ['clock',   'No past shifts yet',       'Each closed shift shows up here.',   'Shift · past shifts'],
  ]],
  ['Reports', [
    ['bars',    'Nothing sold today',       'Sales show up here as they happen.', 'Reports · today'],
  ]],
  ['Settings', [
    ['printer', 'No printer connected',     'Tap Scan to search your Wi-Fi.',     'Settings · printers'],
  ]],
];

// Paint = a box-sized rect in the orb gradient, masked to body minus cut; rim = Mist inside every edge
// (σ = 2.5% of the object's size, as fitted on ref-12). Box + σ are set from the measured silhouette below.
let n = 0;
function svg(a) {
  const id = 'o' + (n++);
  return `<svg viewBox="0 0 140 140" aria-hidden="true" data-id="${id}">
  <defs>
    <mask id="${id}m" maskUnits="userSpaceOnUse" x="0" y="0" width="140" height="140">
      <g fill="#fff">${a.body}</g>${a.cut ? `<g fill="#000">${a.cut}</g>` : ''}
    </mask>
    <filter id="${id}r" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="arithmetic" k2="1" k3="-1" result="ring"/>
      <feFlood style="flood-color:var(--mist);flood-opacity:var(--mist-o)"/>
      <feComposite in2="ring" operator="in" result="mist"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="mist"/></feMerge>
    </filter>
  </defs>
  <g visibility="hidden" class="sil">${a.body}</g>
  <g filter="url(#${id}r)"><rect class="paint" width="140" height="140" fill="url(#orb)" mask="url(#${id}m)"/></g>
</svg>`;
}
document.getElementById('main').innerHTML = PAGES.map(([page, states]) =>
  `<h2>${page}</h2><div class="grid">${states.map(([art, t, line, label]) =>
    `<figure><div class="card">${svg(ART[art])}<b>${t}</b><p>${line}</p></div><figcaption>${label}</figcaption></figure>`
  ).join('')}</div>`).join('');
for (const s of document.querySelectorAll('.card svg')) {
  const b = s.querySelector('.sil').getBBox(), r = s.querySelector('.paint');
  r.setAttribute('x', b.x); r.setAttribute('y', b.y); r.setAttribute('width', b.width); r.setAttribute('height', b.height);
  s.querySelector('feGaussianBlur').setAttribute('stdDeviation', (0.025 * Math.max(b.width, b.height)).toFixed(2));
}

const setTheme = dark => {
  document.body.classList.toggle('dark', dark);
  tDark.setAttribute('aria-pressed', dark);
  tLight.setAttribute('aria-pressed', !dark);
};
tDark.onclick = () => setTheme(true);
tLight.onclick = () => setTheme(false);
if (location.hash === '#dark') setTheme(true);
</script>
</body>
</html>
