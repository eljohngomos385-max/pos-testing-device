<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidebar Lab</title>
<!-- Lab: Shopify's iPhone nav drawer in white. All sizes in pt, measured from the owner's
     screenshot — see img/shopify-sidebar/measured.png. Reference only, not wired into the app. -->
<style>
:root {
  --bg: #FFFFFF;
  --pill: #EDEDED;          /* active row (dark: #181818 on #010101) */
  --ink: #111111;           /* labels, chevrons */
  --icon: #626262;          /* dark: #9D9D9D — mirrored */
  --btn: #F2F2F2;           /* bottom buttons (dark: #0D0D0D) */
  --btn-rim: #DBDBDB;       /* 1pt rim (dark: #242424) */

  --row-h: 48px;
  --pill-x: 8px;            /* pill left */
  --pill-w: 320.6px;
  --pill-r: 12px;
  --icon-cx: 35.8px;        /* icon centre from screen edge */
  --icon-box: 24px;          /* glyph ~17 */
  --text-x: 60.8px;
  --chev-cx: 357px;
  --label-fs: 18px;
  --head-x: 24.6px;
  --head-fs: 17px;
  --btn-h: 56px;
  --btn-pill-w: 148px;
  --btn-gap: 8px;
  --bar-bottom: 28.3px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E5E5E5; }
body {
  font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  display: flex; justify-content: center;
}
.phone {
  position: relative; width: 393px; min-height: 852px; background: var(--bg);
  padding-top: 60.4px;      /* Home pill top */
  overflow: hidden;
}
@media (max-width: 430px) { html, body { background: var(--bg); } .phone { width: 100%; min-height: 100vh; } }

.row {
  position: relative; display: flex; align-items: center; height: var(--row-h);
  font-size: var(--label-fs); font-weight: 500; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.row.on::before {
  content: ""; position: absolute; inset: 0 auto 0 var(--pill-x); width: var(--pill-w);
  background: var(--pill); border-radius: var(--pill-r);
}
.row > * { position: relative; }
.row svg.ic {
  position: absolute; left: calc(var(--icon-cx) - var(--icon-box) / 2);
  width: var(--icon-box); height: var(--icon-box);
  fill: none; stroke: var(--icon); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}
.row.on svg.ic { stroke: var(--ink); }
.row.on svg.ic .fill { fill: var(--ink); }
.row span { position: absolute; left: var(--text-x); }
.row .chev {
  position: absolute; left: calc(var(--chev-cx) - 6.5px); width: 13px; height: 13px;
  fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.row svg.app { stroke: var(--icon); }
.head {
  display: flex; align-items: center; gap: 8px; height: 22px; padding-left: var(--head-x);
  font-size: var(--head-fs); font-weight: 600;
}
.head svg { width: 12px; height: 12px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.head.sales { margin: 23.3px 0 16.6px; }   /* Analytics → header 58.3, header → Online Store 51.6 */
.head.apps  { margin-top: 24.1px; }        /* Agentic → Apps 59.1 */

.bar {
  position: absolute; left: 0; right: 0; bottom: var(--bar-bottom);
  display: flex; justify-content: center; gap: var(--btn-gap);
}
.bar button {
  height: var(--btn-h); min-width: var(--btn-h); border-radius: 999px;
  background: var(--btn); border: 1px solid var(--btn-rim); color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font: inherit; font-size: var(--label-fs); font-weight: 500; cursor: pointer;
}
.bar button.wide { width: var(--btn-pill-w); }
.bar svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="phone">
  <nav id="nav">
    <div class="row on"><svg class="ic" viewBox="0 0 24 24"><path class="fill" d="M4 9.5 12 4l8 5.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M8.5 16h7" stroke="#fff" stroke-width="2"/></svg><span>Home</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 12.5h4.5l1.5 2h5l1.5-2h4.5"/></svg><span>Orders</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M13 3.5h6.5V10L11 18.5a1.5 1.5 0 0 1-2.1 0L4.5 14a1.5 1.5 0 0 1 0-2.1z"/><circle cx="15.8" cy="7.2" r="1.2"/></svg><span>Products</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c0-3.3 3-5.5 7-5.5s7 2.2 7 5.5z"/></svg><span>Customers</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M5 17.5a8 8 0 1 1 14 0"/><path d="M12 13.5 15.5 9"/><circle cx="12" cy="14" r="1.5"/></svg><span>Growth</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 2.3 1.6 2.8-.1.9 2.7 2.2 1.7-.9 2.7.9 2.7-2.2 1.7-.9 2.7-2.8-.1L12 21l-2.3-1.6-2.8.1-.9-2.7-2.2-1.7.9-2.7-.9-2.7 2.2-1.7.9-2.7 2.8.1z"/><path d="m9.5 14.5 5-5"/><circle cx="9.5" cy="9.5" r=".6"/><circle cx="14.5" cy="14.5" r=".6"/></svg><span>Discounts</span></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19.5H5a1.5 1.5 0 0 1-1.5-1.5V6A1.5 1.5 0 0 1 5 4.5h4l2 2h8A1.5 1.5 0 0 1 20.5 8v3"/><path d="M15.5 14v4a2 2 0 0 0 4 0v-5"/></svg><span>Content</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-8.5 8.9"/><path d="M5 7.5c2 .5 3 2 2.5 4s1 3 2.5 3"/><path d="M18 14v6m1.8-4.8c-.4-.6-1-.9-1.8-.9-1 0-1.8.5-1.8 1.3 0 1.7 3.6.9 3.6 2.6 0 .8-.8 1.3-1.8 1.3-.8 0-1.4-.3-1.8-.9"/></svg><span>Markets</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9.5 12 5l8 4.5z"/><path d="M6 10.5v6m4-6v6m4-6v6m4-6v6M4 19.5h16"/></svg><span>Finance</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M6.5 12.5h2l1.5-3.5 2.5 7 2-5 1 1.5h2"/></svg><span>Analytics</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>

    <div class="head sales">Sales channels<svg viewBox="0 0 12 12"><path d="M4 1.5 8.5 6 4 10.5"/></svg></div>
    <div class="row"><svg class="ic app" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M7 9.5h10l-1-3H8zM7.5 9.5V17h9V9.5M10.5 17v-3.5h3V17"/></svg><span>Online Store</span><svg class="chev" viewBox="0 0 13 13"><path d="M1.5 4.2 6.5 9l5-4.8"/></svg></div>
    <div class="row"><svg class="ic app" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><path d="M8.5 8.5 15.5 15.5M15.5 8.5l-7 7"/></svg><span>Agentic</span></div>

    <div class="head apps">Apps<svg viewBox="0 0 12 12"><path d="M4 1.5 8.5 6 4 10.5"/></svg></div>
  </nav>

  <div class="bar">
    <button aria-label="Settings"><svg style="width:30px;height:30px" viewBox="0 0 24 24" fill="currentColor"><path d="M10.3 2h3.4l.5 2.6 1.6.9 2.5-.9 1.7 2.9-2 1.7v1.6l2 1.7-1.7 2.9-2.5-.9-1.6.9-.5 2.6h-3.4l-.5-2.6-1.6-.9-2.5.9-1.7-2.9 2-1.7v-1.6l-2-1.7 1.7-2.9 2.5.9 1.6-.9zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" transform="translate(0 1)"/></svg></button>
    <button class="wide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9 9.5a4 4 0 0 1 0 5M12 7.5a7 7 0 0 1 0 9M15 5.5a10 10 0 0 1 0 13" fill="none" stroke="var(--btn)" stroke-width="1.6" stroke-linecap="round"/></svg>Quick sale</button>
    <button aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
<script>
// Tap a row → the grey pill moves to it.
document.getElementById('nav').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  document.querySelector('.row.on')?.classList.remove('on'); row.classList.add('on');
});
</script>
</body>
</html>
