<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop-up box lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Copied from pos-lab/styles.css body.light-theme (a lab keeps its own copy so the app's global rules stay out) */
:root {
  --bg: #FFFFFF; --bg-soft: #EDEDED; --surface: #F9F9F9; --line: #E1E1E1; --line-strong: #D4D4D4; --tile: #F3F3F3; --canvas: #F2F2F2;
  --ink: #303030; --ink-secondary: #616161; --ink-tertiary: #8C8C8C; --ink-quaternary: #B5B5B5;
  --danger: #FF453A; --r-input: 10px;
  --cta-solid: #4388F7; --cta-ink: #DDF4FF;
  --cta-bg: radial-gradient(75% 80% at 50% 120%, #8EC2F0, transparent 85%), linear-gradient(#6A9FF9, var(--cta-solid) 50%, #5592F7);
  --cta-shadow: inset 0 0 0 .5px rgb(170 228 255 / .32), inset 1px 1px 1.5px -.5px rgb(170 228 255 / .55), inset -1px -1px 1.5px -.5px rgb(170 228 255 / .45), 0 1px 2px rgb(41 85 151 / .22);
  --font: "Inter", -apple-system, system-ui, sans-serif;
  /* The box, measured from the two reference pictures. Only what the reference adds is new. */
  --bx-shadow: 0 8px 32px rgb(0 0 0 / .10), 0 1px 4px rgb(0 0 0 / .04);
}
.dev-phone { --W: 393; --H: 852; --bx-w: 234px; --bx-wide: 330px; --bx-row: 52px; --bx-py: 3px; --bx-r: 17px; --bx-ic: 24px; --bx-x: 16px; --bx-gap: 13px;
  --bx-fs: 17px; --bx-t: 17px; --bx-m: 14px; --bx-near: 14px; --bx-edge: 13; --bx-key: 46px; --bx-btn: 44px; --bx-hero: 34px; --top: 58px; --cap: 6.5; }
.dev-ipad { --W: 1180; --H: 820; --bx-w: 247px; --bx-wide: 340px; --bx-row: 39px; --bx-py: 2px; --bx-r: 13px; --bx-ic: 18px; --bx-x: 11px; --bx-gap: 9px;
  --bx-fs: 13px; --bx-t: 13px; --bx-m: 12px; --bx-near: 8px; --bx-edge: 8; --bx-key: 40px; --bx-btn: 34px; --bx-hero: 26px; --top: 16px; --cap: 8.5; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.35 var(--font); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* the lab's own bar */
.bar { position: sticky; top: 0; z-index: 50; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar select { min-width: 0; flex: 0 1 auto; height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r-input); background: var(--surface); color: var(--ink); font: 14px var(--font); }
.bar #jump { flex: 1 1 0; max-width: 340px; }
.kind { padding: 26px 16px 4px; }
.kind h2 { margin: 0 0 3px; font-size: 18px; font-weight: 600; }
.kind p { margin: 0; color: var(--ink-secondary); max-width: 60ch; }
.case { padding: 18px 0 0; scroll-margin-top: 58px; }
.case h3 { margin: 0; padding: 0 16px; font-size: 15px; font-weight: 600; }
.case .note { margin: 2px 0 0; padding: 0 16px; color: var(--ink-secondary); }
.strip { display: flex; gap: 12px; padding: 8px 0 0; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.strip > figure { flex: none; margin: 0; scroll-snap-align: center; }
figcaption { padding: 0 16px 4px; font-size: 12px; color: var(--ink-tertiary); }
.wrap { width: calc(var(--W) * var(--s) * 1px); height: calc(var(--H) * var(--s) * 1px); overflow: hidden; background: var(--bg); }

/* one device screen, true size, scaled as a whole */
.fr { position: relative; width: calc(var(--W) * 1px); height: calc(var(--H) * 1px); transform: scale(var(--s)); transform-origin: 0 0; overflow: hidden; background: var(--bg); }

/* THE BOX */
.bx { position: absolute; z-index: 5; display: flex; flex-direction: column; width: var(--bx-w); max-height: calc(100% - 16px); padding: var(--bx-py) 0; overflow: hidden auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--bx-r); box-shadow: var(--bx-shadow); }
.bx.wide { width: var(--bx-wide); }
.bx-row { display: flex; align-items: center; gap: var(--bx-gap); flex: none; width: 100%; min-height: var(--bx-row); padding: 0 var(--bx-x); font-size: var(--bx-fs); text-align: left; }
.bx-row .ic { width: var(--bx-ic); height: var(--bx-ic); }
.bx-row > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bx-row > small { flex: none; max-width: 60%; font-size: inherit; color: var(--ink-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bx-row.red { color: var(--danger); }
.bx-row.cur > span { font-weight: 560; }
.bx-row.off { color: var(--ink-quaternary); }
.bx-list { flex: 0 1 auto; min-height: 0; overflow-y: auto; max-height: calc(var(--bx-row) * var(--cap)); }
.bx-head { padding: 10px var(--bx-x) 4px; }
.bx-head b { display: block; font-size: var(--bx-t); font-weight: 600; text-wrap: balance; }
.bx-head p { margin: 2px 0 0; font-size: var(--bx-m); color: var(--ink-secondary); text-wrap: pretty; }
.ud { display: inline-block; width: 1em; height: 1em; vertical-align: -.14em; }
.bx-hero { padding: 6px var(--bx-x) 8px; font-size: var(--bx-hero); font-weight: 600; font-variant-numeric: tabular-nums; }
.bx-find { display: flex; align-items: center; gap: var(--bx-gap); flex: none; min-height: var(--bx-row); padding: 0 var(--bx-x); font-size: var(--bx-fs); color: var(--ink-tertiary); }
.bx-find .ic { width: var(--bx-ic); height: var(--bx-ic); }
.bx-btns { display: flex; justify-content: flex-end; gap: 8px; flex: none; padding: 8px var(--bx-x) 10px; }
.bx-btns button { min-width: 72px; height: var(--bx-btn); padding: 0 16px; border-radius: 999px; font-size: var(--bx-m); font-weight: 560; background: var(--bg-soft); white-space: nowrap; }
.bx-btns .cta { background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); }
.bx-keys { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px var(--bx-x) 0; flex: none; }
.bx-keys span { display: grid; place-items: center; height: var(--bx-key); font-size: calc(var(--bx-fs) + 3px); font-variant-numeric: tabular-nums; }
.bx-seg { display: flex; gap: 2px; margin: 0 var(--bx-x) 4px; padding: 2px; flex: none; background: var(--bg-soft); border-radius: 9px; font-size: var(--bx-m); }
.bx-seg span { flex: 1; padding: 5px 0; text-align: center; border-radius: 7px; }
.bx-seg .on { background: var(--bg); font-weight: 560; }
.bx-sw { flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--ink-quaternary); position: relative; }
.bx-sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.bx-sw.on { background: var(--ink); } .bx-sw.on::after { left: 18px; }
.bx-step { display: flex; align-items: center; gap: 14px; flex: none; }
.bx-step .ic { width: calc(var(--bx-ic) - 4px); height: calc(var(--bx-ic) - 4px); }
.bx-pin { display: flex; justify-content: center; gap: 14px; padding: 8px 0 6px; }
.bx-pin i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink-tertiary); }
.bx-map { position: relative; margin: 2px var(--bx-x) 6px; height: 170px; border-radius: 10px; background: var(--tile); display: grid; place-items: center; color: var(--ink-tertiary); flex: none; }
.bx-map .ic { width: 28px; height: 28px; color: var(--ink); }
.bx-cam { margin: 4px var(--bx-x) 10px; height: 200px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; color: var(--bg); font-size: var(--bx-m); flex: none; }
.bx-paper { margin: 4px var(--bx-x) 6px; padding: 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow: hidden; flex: none; }
.bx-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 6px var(--bx-x); flex: none; }
.bx-tiles i { aspect-ratio: 1; border-radius: 50%; }
.bx-tiles span { display: grid; place-items: center; aspect-ratio: 1; }
.bx-tiles span .ic { width: 22px; height: 22px; }
.bx-tile { width: 54px; height: 54px; margin: 8px var(--bx-x); border-radius: 13px; background: #4388F7; color: #fff; display: grid; place-items: center; flex: none; }
.bx-tile .ic { width: 28px; height: 28px; }

/* rough stand-ins of the pages */
.pg { position: absolute; inset: 0; padding: var(--top) 16px 0; }
.pg-split { position: absolute; inset: 0; display: grid; grid-template-columns: 340px 1fr; }
.pg-split .pg { position: relative; inset: auto; border-left: 1px solid var(--line); }
.pg-side { padding: var(--top) 16px; }
.pg-side i { display: block; height: 14px; margin: 26px 0; width: 80%; border-radius: 4px; background: var(--tile); }
.pg-side i:nth-child(odd) { width: 60%; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.top b { font-size: 17px; font-weight: 600; }
.rb { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--tile); flex: none; }
.rb .ic { width: 20px; height: 20px; } .rb-no { width: 40px; flex: none; }
.pg-hero { padding: 26px 0 18px; font-size: 40px; font-weight: 600; text-align: center; }
.pg-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--line); font-size: 15px; }
.pg-row span:last-child { color: var(--ink-tertiary); }
.pg-btn { position: absolute; left: 16px; right: 16px; bottom: 34px; height: 54px; display: grid; place-items: center; border-radius: 999px; font-weight: 560; background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); }
.pg-fab { position: absolute; right: 16px; bottom: 34px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); }
.pg-fab .ic { width: 24px; height: 24px; }
.dev-ipad .pg-btn { left: auto; right: 24px; width: 180px; height: 48px; bottom: 24px; }
.sell { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr; }
.dev-ipad .sell { grid-template-columns: 1fr 400px; }
.sell-l { position: relative; padding: var(--top) 16px 0; }
.search { flex: 1; height: 40px; border-radius: 999px; background: var(--tile); color: var(--ink-tertiary); display: flex; align-items: center; padding: 0 16px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.dev-ipad .tiles { grid-template-columns: repeat(4, 1fr); }
.tl { min-height: 104px; padding: 10px; border-radius: var(--r-input); background: var(--tile); font-size: 13px; font-weight: 500; }
.dev-ipad .tl { min-height: 128px; }
.ct { position: absolute; inset: 0; display: flex; flex-direction: column; padding: var(--top) 16px 34px; background: var(--bg); }
.dev-ipad .ct { position: relative; inset: auto; border-left: 1px solid var(--line); padding-bottom: 24px; }
.ct-c { padding: 0 14px; height: 40px; display: flex; align-items: center; border-radius: 999px; background: var(--tile); font-weight: 500; }
.ct-l { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.ct-l small { display: block; font-size: 13px; color: var(--ink-tertiary); }
.ct-f { margin-top: auto; }
.ct-h { display: flex; justify-content: space-between; padding: 12px 2px; }
.ct-b { height: 54px; display: grid; place-items: center; border-radius: 999px; font-weight: 560; background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); }
</style>
</head>
<body>
<div class="bar">
  <select id="dev" aria-label="Device"><option value="phone">Phone</option><option value="ipad">iPad</option></select>
  <select id="ics" aria-label="Icons"><option value="both">With and without icons</option><option value="1">With icons</option><option value="0">Without icons</option></select>
  <select id="jump" aria-label="Jump to"></select>
</div>
<main id="out"></main>

/* The box's pieces. ic = this frame shows icons. A row is a string: "Label=value:icon" + ! red, * the current one, ~ greyed. */
function kit(ic) {
  const row = s => {
    if (typeof s !== 'string') return s.html;
    const m = s.match(/^([^=]*?)(?:=(.*?))?(?::(\w*))?([!*~]*)$/), f = m[4];
    return `<button class="bx-row${f.includes('!') ? ' red' : ''}${f.includes('*') ? ' cur' : ''}${f.includes('~') ? ' off' : ''}">${ic && m[3] ? svg(m[3]) : ''}<span>${m[1]}</span>${m[2] ? `<small>${m[2]}</small>` : ''}</button>`;
  };
  const K = {
    row,
    rows: list => `<div class="bx-list">${list.map(row).join('')}</div>`,
    head: (t, m) => t || m ? `<div class="bx-head">${t ? `<b>${t}</b>` : ''}${m ? `<p>${m}</p>` : ''}</div>` : '',
    btns: (no, ok) => `<div class="bx-btns">${no ? `<button>${no}</button>` : ''}${ok ? `<button class="cta">${ok}</button>` : ''}</div>`,
    hero: t => `<div class="bx-hero">${t}</div>`,
    keys: () => `<div class="bx-keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '.', 0, '⌫'].map(k => `<span>${k}</span>`).join('')}</div>`,
    seg: (a, b) => `<div class="bx-seg"><span class="on">${a}</span><span>${b}</span></div>`,
    sw: (label, i, on) => ({ html: `<div class="bx-row">${ic && i ? svg(i) : ''}<span>${label}</span><i class="bx-sw${on ? ' on' : ''}"></i></div>` }),
    step: (label, n, i) => ({ html: `<div class="bx-row">${ic && i ? svg(i) : ''}<span>${label}</span><div class="bx-step">${svg('minus')}<b style="font-weight:500">${n}</b>${svg('plus')}</div></div>` }),
    find: t => `<div class="bx-find">${ic ? svg('search') : ''}${t}</div>`,
  };
  return K;
}

sheet('es-again', 'Make another', 'sell', 'tile', k => k.head('PVC Elbow 1/2"') + k.rows(['1 × ₱12.00=₱12.00:box', '1 × ₱12.00=₱12.00:box']) + k.btns('', 'Make another'), { note: 'Today the cart rises for this, with the other lines faded. Here only the item’s own lines show.' });
sheet('es-cust-edit', 'New customer', 'customers', 'fab', k => k.head('New customer') + k.rows(['Name=Add name:person', 'Phone=Add phone:phone', 'Email=Add email:mail', 'Address=Add address:home', k.sw('Credit', 'card')]) + k.btns('Cancel', 'Save'), { note: 'Fits, but it is a page of typing: the keyboard would push this box off a phone screen.' });
sheet('es-start', 'Start shift', 'shift', 'btn', k => k.head('Starting cash?') + k.hero('₱0.00') + k.keys() + k.btns('', 'Start shift'));
sheet('es-count', 'Count the cash', 'shift', 'btn', k => k.head('Count the cash in the drawer') + k.hero('₱0.00') + k.keys() + k.btns('Skip', 'Next'));
sheet('es-result', 'Count result', 'shift', 'btn', k => k.head('Over / short') + k.hero('₱0.00') + k.row('Expected=₱1,500.00:cal') + k.row('Counted=₱1,500.00:wallet') + k.row('Note:note') + k.btns('Recount', 'Close shift'));
sheet('es-leave', 'Leave in drawer?', 'shift', 'btn', k => k.head('Leave in drawer?') + k.hero('₱0.00') + k.keys() + k.btns('', 'Close shift'));
sheet('es-cash', 'Cash in / out', 'shift', 'fab', k => k.head('Cash in') + k.hero('₱0.00') + k.row('Category=None ⌃⌄:folder') + k.keys() + k.btns('', 'Save'));
sheet('ls-customers', 'Customers list', 'cart', 'cust', k => k.head('Customers') + k.find('Search name, phone or address') + k.rows(['Walk-in:person*', 'Ana Cruz=₱1,200.00:person', 'Jun Reyes:person', 'Mara Santos=₱300.00:person', 'Rico Dela Cruz:person', 'Tita Baby:person']) + k.btns('', 'New customer'));
sheet('ls-variants', 'Variants list', 'sell', 'tile', k => k.head('PVC Elbows', '3 variants') + k.find('Search') + k.rows(['1/2"=₱12.00:layers', '3/4"=₱16.00:layers', '1"=₱22.00:layers']));
sheet('ls-category', 'Category list', 'sell', 'tile', k => k.head('Plumbing', '24 items') + k.find('Search') + k.rows(['PVC Elbows=₱12.00:box', 'PVC Pipes &amp; Tees=₱85.00:box', 'Brass Faucet 1/2"=₱145.00:box', 'Teflon Tape 1/2"=₱18.00:box', 'Hose Clamp=₱25.00:box', 'Gate Valve=₱320.00:box', 'P-Trap=₱110.00:box']));
sheet('pk-hold', 'Hold a tile (peek)', 'sell', 'tile', k => k.head('PVC Elbows', '3 variants') + k.rows(['1/2"=₱12.00:layers', '3/4"=₱16.00:layers', '1"=₱22.00:layers']));
sheet('ls-scan', 'Barcode scanner', 'sell', 'scan', k => k.head('Scan barcode') + '<div class="bx-cam">Point the camera at the barcode</div>', { note: 'Too big for this box: a camera wants the whole screen so the code can be lined up.' });
const COL = ['#E5484D', '#F07A5A', '#F2994A', '#F2C94C', '#4CAF7A', '#2BB3A3', '#38BDF8', '#4388F7', '#5B6CF0', '#9B5DE5', '#B9A6F5', '#EC6FA9', '#9A9A9A', '#9DB39A', '#A07A5A'];
sheet('st-icon', 'Payment type › Icon', 'pay', 'Icon', k => k.head('Icon') + `<div class="bx-tile">${svg('wallet')}</div><div class="bx-tiles">${COL.map(c => `<i style="background:${c}"></i>`).join('')}</div><div class="bx-tiles" style="grid-template-columns:repeat(6,1fr)">${['wallet', 'coin', 'card', 'phone', 'qr', 'purse', 'home', 'exchange', 'note', 'tag', 'person', 'more'].map(n => `<span>${svg(n)}</span>`).join('')}</div>`, { note: 'Not rows any more: colours and symbols are a grid, so only the frame is the box.' });
sheet('st-receipt', 'Receipt preview', 'receipt', 'Preview', k => k.head('Receipt') + '<div class="bx-paper">      EJ Hardware\n   Matina, Davao City\n\nPVC Elbow 1/2"     ₱12.00\nPVC Elbow 3/4"     ₱16.00\n\nTotal              ₱28.00\nCash               ₱50.00\nChange             ₱22.00\n\nKeep for returns and exchanges.</div>', { note: 'Too big for this box: a receipt is long and narrow, so this shows only a short one; a real sale would scroll inside it.' });

const KINDS = {
  1: ['Action lists', 'These go straight across. This is what the box is for.'],
  2: ['Questions', 'They work: title and explanation on top, the answers as rows. Nothing dims behind, so they feel lighter than today.'],
  3: ['Small forms', 'The look carries over. The box is wider here, and typing brings up the keyboard, which it has to stay above.'],
  4: ['Larger sheets', 'Lists fit. Anything with number keys comes out tall, and a few cannot really be this box; those are marked.'],
};

/* Draw */
const BY = Object.fromEntries(CASES.map(c => [c.id, c]));
const $ = s => document.querySelector(s), out = $('#out'), W = { phone: 393, ipad: 1180 };
function boxHtml(c, d, ic) {
  const k = kit(ic);
  let inner;
  if (c.rows) {
    const rows = typeof c.rows === 'function' ? c.rows(d) : c.rows;
    inner = (c.back ? `<button class="bx-row">${svg('back')}<span><b style="font-weight:600">${c.back}</b></span></button>` : k.head(c.title)) + (c.find ? k.find(c.find) : '') + k.rows(rows);
  } else inner = c.draw(k);
  return `<div class="bx${c.wide ? ' wide' : ''}"${c.cap ? ` style="--cap:${c.cap}"` : ''}>${inner}</div>`;
}
// By the button that opens it: under it when it fits, else over it; the box's side lines up with the button's nearer side
function place(fr, c) {
  const b = fr.querySelector('.bx'), a = c.at && fr.querySelector(`[data-at="${CSS.escape(c.at)}"]`), F = fr.getBoundingClientRect();
  const s = F.width / fr.offsetWidth, FW = fr.offsetWidth, FH = fr.offsetHeight, cs = getComputedStyle(fr);
  const edge = +cs.getPropertyValue('--bx-edge'), near = parseFloat(cs.getPropertyValue('--bx-near'));
  const w = b.offsetWidth, h = b.offsetHeight;
  if (!a || c.centre) { b.style.left = (FW - w) / 2 + 'px'; b.style.top = (FH - h) / 2 + 'px'; return; }
  const r = a.getBoundingClientRect(), L = (r.left - F.left) / s, R = (r.right - F.left) / s, T = (r.top - F.top) / s, B = (r.bottom - F.top) / s;
  const col = a.closest('.ct, .pg, .sell-l').getBoundingClientRect(), mid = ((col.left + col.right) / 2 - F.left) / s;
  const left = R - L > w ? (L + R - w) / 2 : (L + R) / 2 > mid ? R - w : L;
  b.style.left = Math.max(edge, Math.min(FW - edge - w, left)) + 'px';
  const roomB = FH - edge - B - near, roomT = T - near - edge, under = h <= roomB || roomB >= roomT;
  if (h > (under ? roomB : roomT)) b.style.maxHeight = Math.max(under ? roomB : roomT, 0) + 'px';
  const hh = b.offsetHeight;
  b.style.top = (under ? B + near : T - near - hh) + 'px';
}
function fill(fr) {
  if (fr.dataset.done) return; fr.dataset.done = 1;
  const c = BY[fr.dataset.id], d = fr.dataset.dev;
  fr.innerHTML = (pageHtml(d, c.page) + boxHtml(c, d, fr.dataset.ic === '1')).replaceAll('⌃⌄', svg('updown').replace('class="ic"', 'class="ic ud"'));
  place(fr, c);
}
window.fillAll = () => document.querySelectorAll('.fr').forEach(fill);   // for the screenshot script
const lazy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { fill(e.target); lazy.unobserve(e.target); } }), { rootMargin: '900px 0px' });
function scale() { const d = $('#dev').value; out.style.setProperty('--s', Math.min(1, innerWidth / W[d])); }
function draw() {
  const d = $('#dev').value, v = $('#ics').value, list = v === 'both' ? ['1', '0'] : [v];
  out.className = 'dev-' + d;
  scale();
  out.innerHTML = Object.entries(KINDS).map(([n, [h, p]]) => `<section class="kind"><h2>${h}</h2><p>${p}</p></section>` +
    CASES.filter(c => c.kind == n).map(c => `<article class="case" id="${c.id}"><h3>${c.name}</h3>${c.note ? `<p class="note">${c.note}</p>` : ''}
      <div class="strip">${list.map(i => `<figure><figcaption>${i === '1' ? 'With icons' : 'Without icons'}</figcaption><div class="wrap"><div class="fr" data-id="${c.id}" data-dev="${d}" data-ic="${i}"></div></div></figure>`).join('')}</div></article>`).join('')).join('');
  document.querySelectorAll('.fr').forEach(f => lazy.observe(f));
}
$('#jump').innerHTML = '<option value="">Jump to…</option>' + Object.entries(KINDS).map(([n, [h]]) => `<optgroup label="${h}">${CASES.filter(c => c.kind == n).map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</optgroup>`).join('');
$('#jump').onchange = e => { const el = document.getElementById(e.target.value); el?.scrollIntoView(); e.target.value = ''; };
$('#dev').value = Math.min(screen.width, screen.height) >= 600 ? 'ipad' : 'phone';
$('#dev').onchange = $('#ics').onchange = draw;
addEventListener('resize', scale);
document.fonts.ready.then(draw);
</script>
