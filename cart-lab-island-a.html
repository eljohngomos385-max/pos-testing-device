<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Rows Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   CART LAB ISLAND-A: "ROWS, NOT TITLES". Still one floating white card (soft shadow, 18px radius) on a tinted page,
   but nothing in it is a title. The top is a plain customer row: name left, chevron right, the whole row is the
   tap target and opens the customer list. The item count lives in Flush's tinted band ("8 items" / "Amount"),
   and the rows are Flush's rows. Lost sale / Save receipt / Clear are a quiet text toolbar under the list.
   Footer: Total (tap for Subtotal / Discount / VAT), fulfilment + a plain Discount, then Check out.
   Fulfilment adapts: 2 types = a two-way segmented control; 3+ = one button showing the choice, opening a list.
   ?empty=1 starts empty, ?many=1 seeds 24 lines, ?ful=2|3|5 sets the number of fulfilment types.
   Money is integer centavos; prices are VAT-inclusive.
   =========================================================================== */
:root {
  --font:      "Inter";
  --page:      #F6F6F7;
  --card:      #FFFFFF;
  --tile:      #F9F9F9;
  --soft:      #F9F9F9;
  --line:      #ECECEC;
  --outline:   #E1E1E1;
  --ring:      #E6E6E6;
  --track:     #EFEFEF;
  --ink:       #303030;
  --ink-2:     #616161;
  --ink-3:     #8C8C8C;
  --down:      #D72C0D;
  --down-tint: #FBEDEA;
  --data-1:    #BCD7FA;
  --data-tint: #DCE9FB;
  --data-ink:  #1F5FB8;
  --hover:     #F4F4F4;
  --press:     #EDEDED;
  --shadow:    0 1px 2px -1px rgb(26 26 26 / .07);   /* THE card shadow (bo-blocks.css --card-shadow) */
  --pop:       0 8px 24px rgba(0,0,0,.08);           /* menus */
  --r-input:   10px;
  --r-btn:     12px;
  --r-island:  18px;
  --m:         20px;                                  /* page margin = grid gutter = the island's inset = Flush's row gutter */
  --tap:       44px;
  --cust-h:    50px;
  --cart-w:    clamp(340px, 30vw, 410px);
  --ease:      cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--page); color: var(--ink);
  font: 13px/1.4 var(--font), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:disabled { cursor: default; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--data-1); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) var(--cart-w); gap: var(--m); height: 100vh; height: 100dvh; padding: var(--m); }

/* ---------- products (same in every lab) ---------- */
.shop { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px; min-width: 0; }
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid var(--outline); border-radius: var(--r-input); background: var(--card); color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-content: start; overflow-y: auto; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: clamp(84px, 11vh, 112px); padding: 8px 12px;
        border: 0; border-radius: var(--r-input); background: var(--tile); box-shadow: inset 0 0 0 1px var(--ring); text-align: center; transition: background-color .12s, transform .1s; }
.tile[hidden] { display: none; }
.tile:hover { background: var(--hover); }
.tile:active { transform: scale(.98); background: var(--press); }
.tile b { font-size: 14px; font-weight: 560; line-height: 1.25; }
.tile span { color: var(--ink-3); font-size: 12.5px; }

/* ---------- the island ---------- */
.cart { position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r-island); box-shadow: var(--shadow); overflow: hidden; }

/* the customer: one settings-style row, the whole row is the button */
.who { display: flex; align-items: center; gap: 10px; width: 100%; height: var(--cust-h); padding: 0 16px 0 var(--m); border: 0; background: none; text-align: left;
       font-size: 14px; font-weight: 560; transition: background-color .12s; }
.who:hover, .who[aria-expanded="true"] { background: var(--hover); }
.who:active { background: var(--press); }
.who .chev { color: var(--ink-2); }
.who span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 16px; height: 16px; stroke-width: 2; color: var(--ink-3); transition: transform .2s var(--ease); }
[aria-expanded="true"] > .chev { transform: rotate(180deg); }

/* Flush's band and rows, verbatim (only --page → --card, the island's white) */
.i-head { display: flex; justify-content: space-between; gap: 12px; padding: 11px var(--m); background: var(--soft); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
          color: var(--ink-2); font-size: 12px; font-weight: 500; }
.lines { overflow-y: auto; overscroll-behavior: contain; }
.line + .line { border-top: 1px solid var(--line); }
.line.open { background: var(--soft); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 45px; padding: 7px var(--m); border: 0; background: none; text-align: left; }
.row .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.row .nm span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.row .nm small { display: block; color: var(--ink-3); font-size: 12px; }
.row .amt { font-size: 13px; font-weight: 600; white-space: nowrap; }
.line.flash { animation: flash .7s var(--ease); }
@keyframes flash { from { background: var(--data-tint); } }
.tray { display: flex; align-items: center; gap: 8px; padding: 0 var(--m) 10px; }
.step { display: flex; align-items: center; height: 44px; border: 1px solid var(--outline); border-radius: var(--r-input); background: var(--card); }
.step button { display: grid; place-items: center; width: 44px; height: 100%; border: 0; background: none; color: var(--ink-2); }
.step button:active { background: var(--press); }
.step output { min-width: 32px; text-align: center; font-size: 15px; font-weight: 600; }
.price { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; height: 44px; padding: 0 10px; border: 1px solid var(--outline); border-radius: var(--r-input); background: var(--card); color: var(--ink-3); }
.price:focus-within { border-color: var(--data-1); outline: 2px solid var(--data-1); outline-offset: -1px; }
.price input { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: none; color: var(--ink); font-size: 14px; font-weight: 500; }
.del { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 0; border-radius: var(--r-input); background: none; color: var(--down); }
.del:hover { background: var(--down-tint); }
.del[hidden] { display: none; }

.empty { display: grid; place-content: center; height: 100%; padding: 24px; color: var(--ink-3); text-align: center; }

/* the quiet toolbar: plain words, their text on the row gutter */
.tools { display: flex; gap: 2px; padding: 4px calc(var(--m) - 10px); border-top: 1px solid var(--line); }
.tl { height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-size: 13px; font-weight: 500; transition: background-color .12s; }
.tl:hover { background: var(--hover); }
.tl:active { background: var(--press); }
.tl.clr { margin-left: auto; color: var(--down); }
.tl.clr:hover { background: var(--down-tint); }
.tl:disabled { opacity: .35; pointer-events: none; }

/* footer */
.foot { display: grid; gap: 12px; padding: 14px var(--m) var(--m); border-top: 1px solid var(--line); }
.sum { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; padding: 0; border: 0; background: none; text-align: left; }
.sum .l { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 14px; font-weight: 500; }
.sum .v { font-size: 28px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; }
.cart.empty-cart .sum .v { color: var(--ink-3); }
.break { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }
.break.open { grid-template-rows: 1fr; }
.break > div { min-height: 0; overflow: hidden; }
.break p { display: flex; justify-content: space-between; margin: 0; padding: 3px 0; color: var(--ink-2); font-size: 13px; }
.break p:first-child { padding-top: 0; }
.break p:last-child { padding-bottom: 8px; }

.opts { display: flex; gap: 8px; }
.opts > #ful { flex: 1; min-width: 0; display: flex; }
/* 2 types: a two-way switch */
.seg { flex: 1; display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 2px; height: var(--tap); padding: 3px; border-radius: var(--r-btn); background: var(--track); }
.seg button { min-width: 0; border: 0; border-radius: 9px; background: none; color: var(--ink-2); font-size: 14px; font-weight: 500; transition: background-color .15s, color .15s, box-shadow .15s; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 560; }
/* 3+ types: one button that shows the choice and opens the list */
.sel, .btn { display: inline-flex; align-items: center; gap: 8px; height: var(--tap); padding: 0 16px; border: 1px solid var(--outline); border-radius: var(--r-btn); background: var(--card);
             color: var(--ink); font-size: 14px; font-weight: 560; white-space: nowrap; transition: background-color .12s; }
.sel { flex: 1; min-width: 0; justify-content: space-between; padding: 0 12px 0 14px; }
.sel span { overflow: hidden; text-overflow: ellipsis; }
.sel:hover, .sel[aria-expanded="true"], .btn:hover { background: var(--hover); }
.btn { justify-content: center; }
.btn.on { background: var(--data-tint); border-color: var(--data-1); color: var(--data-ink); }
.disc { display: flex; gap: 8px; }
.disc[hidden] { display: none; }
.disc .seg { flex: none; width: 96px; }
.go { height: 52px; width: 100%; border: 1px solid var(--ink); border-radius: var(--r-btn); background: var(--ink); color: #fff; font-size: 16px; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 0 rgba(0,0,0,.2); transition: background-color .12s, opacity .2s; }
.go:hover { background: #1F1F1F; }
.go:active { background: #000; }
.go:disabled { opacity: .3; pointer-events: none; }

/* the one popover (customer list, fulfilment list) */
.pop { position: absolute; z-index: 20; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-input); background: var(--card); box-shadow: var(--pop); }
.pop[hidden] { display: none; }
.pop button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: var(--tap); padding: 0 12px; border: 0; border-radius: 7px;
              background: none; text-align: left; font-size: 14px; }
.pop button:hover { background: var(--soft); }
.pop button[aria-selected="true"] { font-weight: 600; }
.pop .ic { color: var(--data-ink); stroke-width: 2; }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 8px 0 16px; border-radius: var(--r-input);
         background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; box-shadow: var(--pop); transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
         transition: opacity .2s, transform .25s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast:not(:has(button)) { padding-right: 16px; }
.toast button { height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
/* the tiles fill the screen like the real sell page: 4 across, 5 down, no empty band under them */
.shop { min-height: 0; }
.grid { grid-template-rows: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); align-content: stretch; overflow: hidden; }
.grid .tile { height: auto; min-height: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>
</svg>

<div class="app">
  <section class="shop" aria-label="Products">
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search products or scan" autocomplete="off"></label>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart" aria-label="Receipt">
    <button type="button" class="who" id="who" aria-haspopup="listbox" aria-expanded="false" aria-label="Customer"><span id="cust"></span><svg class="ic chev"><use href="#i-down"/></svg></button>
    <div class="i-head"><span class="num" id="count"></span><span>Amount</span></div>
    <div class="lines" id="lines"></div>
    <div class="tools">
      <button type="button" class="tl" data-act="lost">Lost sale</button>
      <button type="button" class="tl" data-act="save">Save receipt</button>
      <button type="button" class="tl clr" data-act="clear">Clear</button>
    </div>

    <footer class="foot">
      <div class="total">
        <div class="break" id="break"><div id="breakIn"></div></div>
        <button type="button" class="sum" id="sum" aria-expanded="false"><span class="l">Total<svg class="ic chev"><use href="#i-down"/></svg></span><span class="v num" id="total"></span></button>
      </div>
      <div class="opts">
        <div id="ful"></div>
        <button type="button" class="btn" id="discBtn">Discount</button>
      </div>
      <form class="disc" id="disc" hidden>
        <div class="seg" role="group" aria-label="Discount type">
          <button type="button" data-k="%" aria-pressed="true">%</button>
          <button type="button" data-k="₱" aria-pressed="false">₱</button>
        </div>
        <label class="price"><input id="discIn" inputmode="decimal" placeholder="Amount" autocomplete="off"></label>
        <button type="button" class="del" id="discOff" aria-label="Remove discount"><svg class="ic"><use href="#i-trash"/></svg></button>
        <button type="submit" class="btn">Apply</button>
      </form>
      <button type="button" class="go" id="go">Check out</button>
    </footer>
    <div class="pop" id="pop" role="listbox" hidden></div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const peso = c => '₱' + (c / 100).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toC = s => Math.round((parseFloat(String(s).replace(/[^\d.]/g, '')) || 0) * 100);

// ---------- catalogue (centavos) ----------
const PRODUCTS = [
  ['PLB-1001', 'PVC Elbow 1/2"', 1200], ['PLB-1002', 'PVC Elbow 3/4"', 1600], ['PLB-1003', 'PVC Tee 1/2"', 1450], ['PLB-1010', 'PVC Pipe 1/2" × 3m', 14500],
  ['PLB-1020', 'Brass Faucet 1/2"', 18500], ['PLB-1030', 'Teflon Tape 1/2"', 2500], ['ELC-2001', 'LED Bulb 9W Daylight', 8900], ['ELC-2010', 'Duplex Outlet 2-Gang', 6500],
  ['ELC-2011', 'Switch 1-Gang', 4800], ['ELC-2020', 'Electrical Tape Black', 3500], ['ELC-2030', 'Circuit Breaker 30A', 42000], ['FST-3001', 'Wood Screw #8 × 1"', 250],
  ['FST-3010', 'Hex Bolt M10 × 100mm', 1800], ['FST-3011', 'Flat Washer M10', 150], ['TLS-4001', 'Claw Hammer 16oz', 28500], ['TLS-4002', 'Phillips Screwdriver #2', 14500],
  ['TLS-4003', 'Combination Pliers 8"', 22000], ['TLS-4004', 'Tape Measure 5m', 16500], ['TLS-4005', 'Hacksaw Frame 12"', 19500], ['TLS-4006', 'Aluminum Level 24"', 38500],
].map(([sku, name, price]) => ({sku, name, price}));
// ponytail: only ?many=1 needs these, to reach 24 lines and to test a long name
const EXTRA = [
  ['CNS-5001', 'Common Wire Nail 2" (1 kg pack)', 8500], ['CNS-5002', 'GI Tie Wire #16 (1 kg roll)', 9500], ['CNS-5003', 'Portland Cement 40kg Bag, Type 1', 26500],
  ['CNS-5004', 'Marine Plywood 1/4" 4 × 8 ft Phenolic Board, Heavy Duty Exterior Grade', 68500],
].map(([sku, name, price]) => ({sku, name, price}));
const ALL = [...PRODUCTS, ...EXTRA];
const CUSTOMERS = ['Walk-in customer', 'Ricardo Construction', 'Santos Hardware'];

// ---------- state ----------
const qs = new URLSearchParams(location.search);
const FUL = ['Pickup', 'Delivery', 'Grab', 'Lalamove', 'Courier'].slice(0, Math.min(5, Math.max(2, +qs.get('ful') || 2)));
let cart = qs.has('empty') ? [] : qs.has('many')
  ? ALL.map((p, i) => ({sku: p.sku, qty: 1 + (i * 7) % 5, price: p.price}))
  : [[0, 4], [3, 2], [5, 1], [6, 3], [10, 1], [12, 10], [13, 10], [15, 1]].map(([i, qty]) => ({sku: PRODUCTS[i].sku, qty, price: PRODUCTS[i].price}));
let cust = 0, fulfil = FUL[0], disc = null, discKind = '%', openSku = null, lastCart = null;
const bySku = sku => ALL.find(p => p.sku === sku);

function totals() {
  const sub = cart.reduce((s, l) => s + l.qty * l.price, 0);
  const off = !disc ? 0 : Math.min(sub, disc.kind === '%' ? Math.round(sub * disc.val / 100) : disc.val);
  const total = sub - off;
  return {sub, off, total, vat: Math.round(total * 12 / 112)};   // VAT is included in the price
}
// self-check: the money path
(() => { const keep = [cart, disc]; cart = [{qty: 1, price: 11200}]; disc = {kind: '%', val: 10};
  const t = totals(); console.assert(t.sub === 11200 && t.off === 1120 && t.total === 10080 && t.vat === 1080, 'totals', t);
  disc = {kind: '₱', val: 99999}; console.assert(totals().total === 0, 'discount capped at subtotal'); [cart, disc] = keep; })();

// ---------- render ----------
$('#grid').innerHTML = PRODUCTS.map(p => `<button type="button" class="tile" data-sku="${p.sku}"><b>${esc(p.name)}</b><span class="num">${peso(p.price)}</span></button>`).join('');
const svg = (id, cls = '') => `<svg class="ic ${cls}"><use href="#i-${id}"/></svg>`;
// fulfilment: 2 types = a switch, 3+ = one button that opens the list
$('#ful').innerHTML = FUL.length === 2
  ? `<div class="seg" role="group" aria-label="Fulfilment">${FUL.map(f => `<button type="button" data-f="${f}">${f}</button>`).join('')}</div>`
  : `<button type="button" class="sel" id="fulBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Fulfilment"><span id="fulLbl"></span>${svg('down', 'chev')}</button>`;

function renderLines() {
  const el = $('#lines');
  if (!cart.length) { el.innerHTML = `<div class="empty">Tap a product to add it.</div>`; return; }
  el.innerHTML = cart.map(l => {
    const p = bySku(l.sku), open = l.sku === openSku;
    return `<div class="line${open ? ' open' : ''}" data-sku="${l.sku}">
      <button type="button" class="row" aria-expanded="${open}"><span class="nm"><span>${esc(p.name)}</span><small class="num">${l.qty} × ${peso(l.price)}</small></span><span class="amt num">${peso(l.qty * l.price)}</span></button>
      ${open ? `<div class="tray">
        <div class="step"><button type="button" data-q="-1" aria-label="Less">${svg('minus')}</button><output class="num">${l.qty}</output><button type="button" data-q="1" aria-label="More">${svg('plus')}</button></div>
        <label class="price" title="Unit price">₱<input class="num" data-price inputmode="decimal" value="${(l.price / 100).toFixed(2)}"></label>
        <button type="button" class="del" data-del aria-label="Remove">${svg('trash')}</button></div>` : ''}
    </div>`;
  }).join('');
}
function renderFoot() {
  const t = totals(), n = cart.length;
  $('#cust').textContent = CUSTOMERS[cust];
  $('#count').textContent = n ? `${n} item${n === 1 ? '' : 's'}` : 'No items';
  $('#total').textContent = peso(t.total);
  $('#breakIn').innerHTML = `<p><span>Subtotal</span><span class="num">${peso(t.sub)}</span></p>`
    + (t.off ? `<p><span>Discount${disc.kind === '%' ? ` (${disc.val}%)` : ''}</span><span class="num">−${peso(t.off)}</span></p>` : '')
    + `<p><span>VAT (12% incl.)</span><span class="num">${peso(t.vat)}</span></p>`;
  $('#discBtn').classList.toggle('on', !!disc);
  $('#discBtn').textContent = disc ? (disc.kind === '%' ? `Discount −${disc.val}%` : `Discount −${peso(disc.val).replace(/\.00$/, '')}`) : 'Discount';
  document.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === fulfil));
  if ($('#fulLbl')) $('#fulLbl').textContent = fulfil;
  $('#go').disabled = !n;
  $('.cart').classList.toggle('empty-cart', !n);
  $('[data-act="save"]').disabled = $('[data-act="clear"]').disabled = !n;
}
const render = () => { renderLines(); renderFoot(); };

let tt;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = esc(msg) + (undo ? '<button type="button">Undo</button>' : '');
  if (undo) el.querySelector('button').onclick = () => { undo(); el.classList.remove('show'); };
  el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), undo ? 4000 : 1800);
}

// ---------- the one popover: a short list under (or over) its button ----------
const pop = $('#pop'); let popFor = null, popPick = null;
function openPop(anchor, list, cur, pick) {
  if (popFor === anchor) return closePop();
  closePop();
  pop.innerHTML = list.map((t, i) => `<button type="button" role="option" aria-selected="${t === cur}" data-i="${i}">${esc(t)}${t === cur ? svg('check') : ''}</button>`).join('');
  pop.hidden = false; popFor = anchor; popPick = pick; anchor.setAttribute('aria-expanded', 'true');
  const c = $('.cart').getBoundingClientRect(), a = anchor.getBoundingClientRect();
  const w = Math.max(200, Math.min(a.width, 280)), h = pop.offsetHeight, below = a.bottom - c.top + 6;
  pop.style.width = w + 'px';
  pop.style.left = Math.min(a.left - c.left + (anchor === $('#who') ? 12 : 0), c.width - w - 8) + 'px';
  pop.style.top = (below + h < c.height - 8 ? below : a.top - c.top - 6 - h) + 'px';
  (pop.querySelector('[aria-selected="true"]') || pop.firstChild).focus({preventScroll: true});
}
function closePop() { if (!popFor) return; pop.hidden = true; popFor.setAttribute('aria-expanded', 'false'); popFor = null; }
pop.onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; popPick(+b.dataset.i); const a = popFor; closePop(); a.focus({preventScroll: true}); };
document.addEventListener('click', e => { if (popFor && !pop.contains(e.target) && !popFor.contains(e.target)) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

// ---------- actions ----------
$('#grid').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const line = cart.find(l => l.sku === t.dataset.sku);
  if (line) line.qty++; else cart.push({sku: t.dataset.sku, qty: 1, price: bySku(t.dataset.sku).price});
  render();
  const row = $(`.line[data-sku="${t.dataset.sku}"]`);
  row.scrollIntoView({block: 'nearest', behavior: 'smooth'}); row.classList.add('flash');
});
$('#lines').addEventListener('click', e => {
  const line = e.target.closest('.line'); if (!line) return;
  const l = cart.find(x => x.sku === line.dataset.sku);
  const q = e.target.closest('[data-q]');
  if (e.target.closest('.row')) openSku = openSku === l.sku ? null : l.sku;
  else if (q) { l.qty += +q.dataset.q; if (l.qty < 1) { removeLine(l); return; } }
  else if (e.target.closest('[data-del]')) { removeLine(l); return; }
  else return;
  render();
});
$('#lines').addEventListener('change', e => {
  if (!e.target.matches('[data-price]')) return;
  cart.find(x => x.sku === e.target.closest('.line').dataset.sku).price = toC(e.target.value);
  render();
});
function removeLine(l) {
  const i = cart.indexOf(l); cart.splice(i, 1); openSku = null; render();
  toast(`Removed ${bySku(l.sku).name}`, () => { cart.splice(i, 0, l); render(); });
}
$('#who').onclick = e => openPop(e.currentTarget, CUSTOMERS, CUSTOMERS[cust], i => { cust = i; renderFoot(); });
$('#ful').onclick = e => {
  const seg = e.target.closest('[data-f]');
  if (seg) { fulfil = seg.dataset.f; renderFoot(); return; }
  const btn = e.target.closest('#fulBtn');
  if (btn) openPop(btn, FUL, fulfil, i => { fulfil = FUL[i]; renderFoot(); });
};
$('#sum').onclick = () => { const o = $('#break').classList.toggle('open'); $('#sum').setAttribute('aria-expanded', o); };

// discount: a tiny inline form, % or ₱
function setKind(k) { discKind = k; document.querySelectorAll('[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k)); }
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { setKind(b.dataset.k); $('#discIn').focus(); });
$('#discBtn').onclick = () => {
  const f = $('#disc'); f.hidden = !f.hidden;
  $('#discOff').hidden = !disc;
  if (!f.hidden) { setKind(disc ? disc.kind : '%'); $('#discIn').value = disc ? (disc.kind === '%' ? disc.val : disc.val / 100) : ''; $('#discIn').focus(); }
};
$('#discOff').onclick = () => { disc = null; $('#disc').hidden = true; renderFoot(); toast('Discount removed'); };
$('#disc').onsubmit = e => {
  e.preventDefault();
  const raw = parseFloat($('#discIn').value) || 0;
  disc = raw <= 0 ? null : discKind === '%' ? {kind: '%', val: Math.min(100, raw)} : {kind: '₱', val: toC(raw)};
  $('#disc').hidden = true; renderFoot();
  toast(disc ? 'Discount applied' : 'Discount removed');
};

// the toolbar: Lost sale, Save receipt, Clear
document.querySelector('.tools').onclick = e => {
  const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
  if (a === 'lost') toast('Lost sale recorded');
  if (a === 'save') toast('Receipt saved');
  if (a === 'clear') { lastCart = {cart, disc}; cart = []; disc = null; openSku = null; render(); toast('Cleared', () => { ({cart, disc} = lastCart); render(); }); }
};
$('#go').onclick = () => labCheckout.open({  // the real POS checkout (cart-lab-checkout.js)
  lines: cart.map(l => ({name: bySku(l.sku).name, qty: l.qty, price: l.price})), totals: totals(),
  customer: cust ? CUSTOMERS[cust] : '', fulfil: String(fulfil),
  onCustomer: () => { cust = (cust + 1) % CUSTOMERS.length; render(); return cust ? CUSTOMERS[cust] : ''; },
  onSold: () => { cart = []; disc = null; openSku = null; render(); },
});
$('#q').oninput = e => { const s = e.target.value.toLowerCase(); document.querySelectorAll('.tile').forEach(t => t.hidden = !t.textContent.toLowerCase().includes(s)); };

render();
</script>
<script>document.body.append(Object.assign(document.createElement('script'), { src: /[?&]co=simple2/.test(location.search) ? 'cart-lab-checkout-2.js' : 'cart-lab-checkout.js' }));  // Simplified 2 lives in its own copy</script>
</body>
