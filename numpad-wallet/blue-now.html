<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue Now</title>
<style>
/* today's light-theme Check out pill (styles.css .ph-bar + the iOS capsule rule), copied as is; only the colour changes.
   Blue = Ultra's cerulean, the owner's pick from sky-buttons.html (2026-10-28). Lab only: the app is untouched. */
:root { --canvas: #F2F2F2; --ink: #303030; --sub: #8C8C8C; --bar-h: 44px; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--canvas); color: var(--ink); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  min-height: 100vh; display: grid; place-content: center; gap: 40px; padding: 32px 16px; }
section { display: grid; justify-items: center; gap: 14px; }
h2 { font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .02em; text-transform: uppercase; }
.row { display: flex; gap: 12px; }

.btn { --c: #303030; --c-down: #000; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px;
  background: var(--c); color: #fff; font: inherit; font-size: 15px; font-weight: 550; cursor: pointer; font-variant-numeric: tabular-nums;
  background-image: linear-gradient(rgb(255 255 255 / .14), rgb(255 255 255 / 0) 60%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .3), inset 0 0 0 .5px rgb(255 255 255 / .12), 0 2px 8px -2px rgb(0 0 0 / .3); }
.btn:active { background-color: var(--c-down); }
.bar { width: min(100vw - 48px, 260px); height: var(--bar-h); padding: 0 20px; }
.bar span + span::before { content: '·'; margin-right: 8px; }
.blue { --c: #50A8DE; --c-down: #4596D4; }

/* the owner's four button photos (2026-10-28), copied onto today's shapes. Each sits on the ground it came on */
.tile { border-radius: 28px; padding: 28px 20px; display: grid; justify-items: center; gap: 14px; width: min(100vw - 32px, 360px); }
.tile.dark { background: #000; } .tile.night { background: #121317; } .tile.pale { background: #F4F5F9; }
.cp { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; font: inherit; font-size: 15px;
  font-variant-numeric: tabular-nums; cursor: pointer; transition: transform .18s cubic-bezier(.3,.7,.4,1.4), filter .2s; }
.cp:active { transform: scale(.96); filter: brightness(.96); }
.cp.bar { width: min(100% - 8px, 260px); }
/* 1 · Get Started: frosted, blue at the left, peach at the right. No stroke, no white line, 5's soft shadow (owner 2026-10-28) */
.c1 { color: #15233A; font-weight: 600;
  background: radial-gradient(38% 120% at 6% 55%, #5590F6, transparent 75%), radial-gradient(30% 140% at 97% 50%, #E6D8CB, transparent 85%),
    radial-gradient(30% 60% at 45% 105%, rgb(225 238 255 / .4), transparent), linear-gradient(90deg, #6CA2F7, #74A8F5 30%, #8EB2E8 60%, #BCC6DC 78%, #E5D7CC);
  box-shadow: 0 1px 2px color-mix(in srgb, color-mix(in srgb, #5590F6 75%, #000) 45%, transparent), 0 2px 7px 1px color-mix(in srgb, #5590F6 32%, transparent); }
/* 2 · Jetzt starten: sky blue with mint light from below, just the pill. No stroke, no white line, 5's soft shadow (owner 2026-10-28) */
.c2 { color: #fff; font-weight: 500;
  background: radial-gradient(75% 80% at 50% 120%, #BEE4DE, transparent 85%), linear-gradient(#89BCF9, #6EABF6 50%, #84BBF8);
  box-shadow: inset 0 0 14px rgb(255 255 255 / .25), 0 1px 2px color-mix(in srgb, color-mix(in srgb, #6EABF6 75%, #000) 45%, transparent), 0 2px 7px 1px color-mix(in srgb, #6EABF6 32%, transparent); }
/* 3 · the arrow: deep sky in the middle, pale at the ends. No stroke, no white line, 5's soft shadow (owner 2026-10-28) */
.c3 { color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgb(40 130 210 / .4);
  background: radial-gradient(52% 125% at 47% 50%, #74C5F7, #8CCEF7 35%, #AEDBF7 63%, #D2E8F6 95%);
  box-shadow: 0 1px 2px color-mix(in srgb, color-mix(in srgb, #74C5F7 75%, #000) 45%, transparent), 0 2px 7px 1px color-mix(in srgb, #74C5F7 32%, transparent); }
/* 4 · Create: blue light from the top, a white glow at the bottom, navy words. No stroke, no white line, 5's soft shadow (owner 2026-10-28) */
.c4 { color: #1B3460; font-weight: 600;
  background: radial-gradient(35% 40% at 50% 106%, #fff, transparent), radial-gradient(70% 95% at 50% 15%, #4282F5, #76A7F8 45%, #C4DAFB 88%);
  box-shadow: 0 1px 2px color-mix(in srgb, color-mix(in srgb, #4282F5 75%, #000) 45%, transparent), 0 2px 7px 1px color-mix(in srgb, #4282F5 32%, transparent); }
/* 5 · 持仓: flat bright blue, lighter top-left, darker bottom-right, a soft line on top and a blue glow, on a grey bar.
   Matched by rendering it at the photo's size over the photo's ground (mean gap 2.5 / 255, about the JPEG's noise) */
.tile.slate { background: #3D3C41; }
.c5 { color: #fff; font-weight: 500;
  background: linear-gradient(160deg, #5492F9, #4388F7 40%, #397CEC 62%, #2D69D6);
  box-shadow: inset 0 1px 0 rgb(140 180 250 / .45), 0 1px 2px rgb(30 80 170 / .45), 0 2px 7px 1px rgb(50 110 220 / .32); }
</style>
</head>
<body>
  <section>
    <h2>Now</h2>
    <button class="btn bar"><span>2 items</span><span>₱157.00</span></button>
  </section>
  <section>
    <h2>Blue</h2>
    <button class="btn bar blue"><span>2 items</span><span>₱157.00</span></button>
  </section>
  <section>
    <h2>Your five</h2>
    <div class="tile dark"><button class="cp bar c1"><span>2 items</span><span>₱157.00</span></button></div>
    <div class="tile night"><button class="cp bar c2"><span>2 items</span><span>₱157.00</span></button></div>
    <div class="tile pale"><button class="cp bar c3"><span>2 items</span><span>₱157.00</span></button></div>
    <div class="tile night"><button class="cp bar c4"><span>2 items</span><span>₱157.00</span></button></div>
    <div class="tile slate"><button class="cp bar c5"><span>2 items</span><span>₱157.00</span></button></div>
  </section>
</body>
</html>
