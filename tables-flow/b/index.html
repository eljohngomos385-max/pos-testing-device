<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tables flow B</title><style>
body{margin:0;background:#EDEDED;color:#1A1A1A;font:15px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif}
main{max-width:1500px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:28px;margin:0 0 4px}.sub{color:#8C8C8C;margin:0 0 32px}
section{margin:0 0 48px}h2{font-size:20px;margin:0 0 16px}h2 b{color:#8C8C8C;font-weight:600;margin-right:8px}
.dev{color:#8C8C8C;font-size:13px;font-weight:600;margin:16px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
figure{margin:0;flex:none}figure img{display:block;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);background:#fff}
.ph img{width:240px}.ip img{width:520px}
figcaption{font-size:13px;color:#4D4D4D;margin-top:8px}.ph figcaption{width:240px}.ip figcaption{width:520px}
figcaption b{color:#1A1A1A;margin-right:4px}.new figcaption b::after{content:" new";color:#4388F7;font-weight:600}
</style></head><body><main><h1>Tables, candidate B: the big-number page</h1><p class="sub">Same flow as <a href="../a/" style="color:inherit">candidate A</a>; the table picker and the Tables page take the checkout's look. Steps marked new are the ones that changed.</p><section><h2><b>A</b>Taking a dine-in order</h2><div class='dev'>Phone</div><div class='strip'><figure class='ph'><img src='phone-a1-dinein.png'><figcaption><b>A1</b>Cart as today. Fulfilment says Dine-in.</figcaption></figure><figure class='ph new'><img src='phone-a2-choose.png'><figcaption><b>A2</b>Check out opens the checkout page itself: "Choose a table" over the total. Pay now on top, tables as payment rows, the number where the logo is. Busy tables are blue with their bill.</figcaption></figure><figure class='ph'><img src='phone-a3-addtable.png'><figcaption><b>A3</b>Add table: the number pad, Save. Only for tonight.</figcaption></figure><figure class='ph'><img src='phone-a4-saved.png'><figcaption><b>A4</b>Tap Table 4: saved, new items to the kitchen, cart empty for the next guest.</figcaption></figure></div><div class='dev'>iPad</div><div class='strip'><figure class='ip'><img src='ipad-a1-dinein.png'><figcaption><b>A1</b>Cart as today. Fulfilment says Dine-in.</figcaption></figure><figure class='ip new'><img src='ipad-a2-choose.png'><figcaption><b>A2</b>Check out opens the checkout page itself: "Choose a table" over the total. Pay now on top, tables as payment rows, the number where the logo is. Busy tables are blue with their bill.</figcaption></figure><figure class='ip'><img src='ipad-a3-addtable.png'><figcaption><b>A3</b>Add table: the number pad, Save. Only for tonight.</figcaption></figure><figure class='ip'><img src='ipad-a4-saved.png'><figcaption><b>A4</b>Tap Table 4: saved, new items to the kitchen, cart empty for the next guest.</figcaption></figure></div></section><section><h2><b>B</b>Finding the bill</h2><div class='dev'>Phone</div><div class='strip'><figure class='ph new'><img src='phone-b1-menu.png'><figcaption><b>B1</b>☰ › Tables (already in the menu).</figcaption></figure><figure class='ph new'><img src='phone-b2-tables.png'><figcaption><b>B2</b>Tables is a big-number page too: all that is still open on top, one row per open bill. Only tables with something on them show.</figcaption></figure></div><div class='dev'>iPad</div><div class='strip'><figure class='ip new'><img src='ipad-b1-menu.png'><figcaption><b>B1</b>☰ › Tables (already in the menu).</figcaption></figure><figure class='ip new'><img src='ipad-b2-tables.png'><figcaption><b>B2</b>Tables is a big-number page too: all that is still open on top, one row per open bill. Only tables with something on them show.</figcaption></figure></div></section><section><h2><b>C</b>Back at the table</h2><div class='dev'>Phone</div><div class='strip'><figure class='ph'><img src='phone-c1-bill.png'><figcaption><b>C1</b>Tap a bill: it is the cart. Sent items sit in a grey block. ✕ where ☰ was. Phone: Add item. iPad: Table 4, tap to move.</figcaption></figure><figure class='ph'><img src='phone-c2-additem.png'><figcaption><b>C2</b>Phone only, Add item: the grid with ✕. Bottom pill says what is new.</figcaption></figure><figure class='ph'><img src='phone-c3-billnew.png'><figcaption><b>C3</b>Phone: back on the bill, the new item under the sent block.</figcaption></figure><figure class='ph new'><img src='phone-c4-asknew.png'><figcaption><b>C4</b>Check out with new items: the same page, "Send to Table 4, or pay", Table 4 picked.</figcaption></figure><figure class='ph'><img src='phone-c5-pay.png'><figcaption><b>C5</b>Nothing new: Check out goes straight to pay. Paid = leaves Tables, goes to Orders.</figcaption></figure><figure class='ph'><img src='phone-c6-leave.png'><figcaption><b>C6</b>✕ with new items not sent: Save or Discard.</figcaption></figure></div><div class='dev'>iPad</div><div class='strip'><figure class='ip'><img src='ipad-c1-bill.png'><figcaption><b>C1</b>Tap a bill: it is the cart. Sent items sit in a grey block. ✕ where ☰ was. Phone: Add item. iPad: Table 4, tap to move.</figcaption></figure><figure class='ip new'><img src='ipad-c4-asknew.png'><figcaption><b>C4</b>Check out with new items: the same page, "Send to Table 4, or pay", Table 4 picked.</figcaption></figure><figure class='ip'><img src='ipad-c5-pay.png'><figcaption><b>C5</b>Nothing new: Check out goes straight to pay. Paid = leaves Tables, goes to Orders.</figcaption></figure><figure class='ip'><img src='ipad-c6-leave.png'><figcaption><b>C6</b>✕ with new items not sent: Save or Discard.</figcaption></figure></div></section><section><h2><b>D</b>A QR order</h2><div class='dev'>Phone</div><div class='strip'><figure class='ph new'><img src='phone-d1-qr.png'><figcaption><b>D1</b>Lands on Tables: the QR tile and the blue dot.</figcaption></figure><figure class='ph'><img src='phone-d2-qrbill.png'><figcaption><b>D2</b>Open it: main button is Accept. No table picked yet: iPad shows No table, tap to pick.</figcaption></figure></div><div class='dev'>iPad</div><div class='strip'><figure class='ip new'><img src='ipad-d1-qr.png'><figcaption><b>D1</b>Lands on Tables: the QR tile and the blue dot.</figcaption></figure><figure class='ip'><img src='ipad-d2-qrbill.png'><figcaption><b>D2</b>Open it: main button is Accept. No table picked yet: iPad shows No table, tap to pick.</figcaption></figure></div></section></main></body></html>
