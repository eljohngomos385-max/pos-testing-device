<!doctype html>
<html lang="en" class="bo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F6F3" />
  <title>EJ Hardware — Back Office</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Geist:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=153" />
  <link rel="stylesheet" href="/bo-products.css?v=120" />
  <link rel="stylesheet" href="/bo-item.css?v=12" />
  <link rel="stylesheet" href="/bo-inventory.css?v=104" />
  <link rel="stylesheet" href="/bo-sales.css?v=97" />
  <link rel="stylesheet" href="/bo-suppliers.css?v=97" />
  <link rel="stylesheet" href="/bo-staff.css?v=98" />
  <link rel="stylesheet" href="/bo-insights.css?v=3" />
  <link rel="stylesheet" href="/bo-blocks.css?v=63" />
  <link rel="stylesheet" href="/bo-calm.css?v=55" />
</head>
<body class="bo-body bo-light">
  <div id="app" class="bo-app">

    <!-- ============== TOPBAR (black strip) ============== -->
    <!-- ponytail: no topbar. The hamburger only matters below 1024px, where the
         sidebar overlays; CSS hides it on desktop. -->
    <button id="boSidebarToggle" class="bo-hamburger" aria-label="Toggle menu" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- ============== SIDEBAR ============== -->
    <aside class="sidebar bo-sidebar">
      <div class="side-resizer" id="sideResizer" title="Drag to resize · double-click to reset"></div>
      <!-- Location switcher: a store badge, the location you switch, and a ⌄ beside it. -->
      <div class="side-switch-wrap">
        <!-- In Settings, ← Back takes the switcher's slot (owner, 2026-09-27); paint() swaps the two. Before #locBtn: its menu must stay its nextElementSibling. -->
        <button class="side-link" type="button" data-set-back hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
          <span>Back</span>
        </button>
        <button class="side-switch" id="locBtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="ss-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/></svg></span>
          <span class="ss-text"><span class="ss-label" id="locBiz">EJ Hardware</span><span class="ss-name" id="locName">Main Store</span></span>
          <svg class="ss-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="side-menu" id="locMenu" role="menu" hidden></div>
        <!-- Folds the sidebar to an icon rail (desktop). After the menu: wireSwitchers() opens a switch's nextElementSibling. -->
        <button class="side-rail-btn" id="sideRailBtn" type="button" aria-label="Fold sidebar" aria-expanded="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 5a2 2 0 0 1 2-2h4v18H5a2 2 0 0 1-2-2z" fill="currentColor"/></svg>
        </button>
      </div>

      <nav class="side-nav">
        <button class="side-label" type="button" data-fold="main-menu" aria-expanded="true">Main menu<svg class="side-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-fold"><div class="side-fold-in">
          <button class="side-link active" data-view="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect class="f" width="7" height="9" x="3" y="3" rx="1"/><rect class="f" width="7" height="5" x="14" y="3" rx="1"/><rect class="f" width="7" height="9" x="14" y="12" rx="1"/><rect class="f" width="7" height="5" x="3" y="16" rx="1"/></svg>
            <span>Dashboard</span>
          </button>
          <button class="side-link" data-view="sales">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><rect class="f" x="15" y="5" width="4" height="12" rx="1"/><rect class="f" x="7" y="8" width="4" height="9" rx="1"/></svg>
            <span>Sales</span>
          </button>
          <button class="side-link" data-view="transactions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/><path class="k" d="M14 8H8M16 12H8M13 16H8"/></svg>
            <span>Transactions</span>
          </button>
          <button class="side-link has-sub" data-view="products">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="f" transform="matrix(-1 0 0 1 24 0)" d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle class="hole" cx="16.5" cy="7.5" r="1.5"/></svg>
            <span>Products</span><svg class="side-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="side-sub" data-view="inventory"><div class="side-fold-in"><button class="side-sublink" type="button" data-sub="overview">Stock history</button></div></div>
          <button class="side-link" data-view="customers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle class="f" cx="12" cy="8" r="5"/><path class="f" d="M20 21a8 8 0 0 0-16 0"/></svg>
            <span>Customers</span>
          </button>
        </div></div>
        <button class="side-label" type="button" data-fold="stock" aria-expanded="true">Stock<svg class="side-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-fold"><div class="side-fold-in">
          <button class="side-link" data-view="suppliers" data-sub="suppliers orders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path class="f" d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle class="f k" cx="17" cy="18" r="2"/><circle class="f k" cx="7" cy="18" r="2"/></svg>
            <span>Suppliers</span>
          </button>
        </div></div>
      </nav>

      <!-- Settings swaps the sidebar for its own sections (owner, 2026-09-26, Shopify-style). paint() shows
           this nav on the settings and payments views; ← Back, in the switcher slot above, returns to the last page outside them. -->
      <nav class="side-nav side-setnav" hidden>
        <div class="side-label">Settings</div>
        <button class="side-link" type="button" data-set="store">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M4 11h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path class="f" d="M2 8l2-5h16l2 5a3 3 0 0 1-5 2.2 3 3 0 0 1-5 0 3 3 0 0 1-5 0A3 3 0 0 1 2 8z"/></svg>
          <span>Store</span>
        </button>
        <button class="side-link" type="button" data-set="tax">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle class="f" cx="7" cy="7" r="3"/><circle class="f" cx="17" cy="17" r="3"/><path d="M19 5 5 19"/></svg>
          <span>Tax</span>
        </button>
        <button class="side-link" type="button" data-set="payments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect class="f" width="20" height="14" x="2" y="5" rx="2"/><path class="k" d="M2 10h20M6 14h2"/></svg>
          <span>Payments</span>
        </button>
        <button class="side-link" type="button" data-set="receipt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z"/><path class="k" d="M14 8H8M16 12H8M13 16H8"/></svg>
          <span>Receipt &amp; printing</span>
        </button>
        <button class="side-link" type="button" data-set="staff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle class="f" cx="10" cy="8" r="5"/><path class="f" d="M18 21a8 8 0 0 0-16 0"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
          <span>Staff &amp; access</span>
        </button>
        <button class="side-link" type="button" data-set="appearance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle class="f" cx="12" cy="12" r="10"/><circle class="hole" cx="8" cy="10" r="1.5"/><circle class="hole" cx="12" cy="7" r="1.5"/><circle class="hole" cx="16" cy="10" r="1.5"/></svg>
          <span>Appearance</span>
        </button>
        <button class="side-link" type="button" data-set="data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse class="f" cx="12" cy="5" rx="9" ry="3"/><path class="f" d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path class="k" d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
          <span>Data</span>
        </button>
      </nav>

      <div class="side-footer">
        <!-- Settings sits at the bottom, over the account; opening it swaps the nav above for .side-setnav and hides this row (paint()). -->
        <button class="side-link" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle class="hole" cx="12" cy="12" r="3"/></svg>
          <span>Settings</span>
        </button>
        <!-- Account switcher: a user badge, name + role. No chevron; only the store gets one. -->
        <div class="side-switch-wrap">
          <button class="side-switch acct" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="ss-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span>
            <span class="ss-text"><span class="ss-name" id="acctName">El John</span><span class="ss-label" id="acctRole">Owner</span></span>
          </button>
          <div class="side-menu up" id="acctMenu" role="menu" hidden></div>
        </div>
      </div>
    </aside>

    <!-- ============== MAIN ============== -->
    <div class="main bo-main">

      <!-- ============================================
           DASHBOARD
           ============================================ -->
      <!-- The calm Dashboard (dashboard-calm-lab.html, ported as is; styles in bo-calm.css).
           Left: the four KPIs as folder tabs over the bars, then recent transactions.
           Right: daily target, monthly target, low stock, payment methods, each on or off from the Widgets menu. backoffice.js → renderDashboard. -->
      <section class="view view-dashboard calm-dash active" data-view="dashboard">
        <div class="c-main">
          <div class="bar">
            <h1 id="dashGreeting">Welcome back</h1>
            <button class="pick" id="dashWBtn" popovertarget="dashW">Widgets</button>
            <div class="menu" id="dashW" popover role="menu"></div>
            <button class="pick" id="dashPick" popovertarget="dashRange"></button>
            <div class="menu" id="dashRange" popover role="menu"></div>
          </div>
          <div class="dash" id="dashGrid">
            <div class="col">
              <section class="card trend">
                <div class="strip" id="dashStrip" role="tablist" aria-label="Chart shows"></div>
                <div class="panel"><div class="plot" id="dashPlot"></div></div>
              </section>
              <section class="card txcard">
                <div class="head"><span class="lbl">Recent transactions</span><a id="dashTxAll" href="/admin/transactions">View all ›</a></div>
                <div id="dashTx"></div>
              </section>
            </div>
            <div class="rail" id="dashRail"></div>
          </div>
        </div>
        <dialog id="dashPop"><div class="pop" id="dashPopIn"></div></dialog>
      </section>

      <!-- Sales: markup lives in bo-sales.js -->
      <section class="view view-sales" data-view="sales" hidden></section>

      <!-- Transactions: markup lives in bo-transactions.js -->
      <section class="view view-tx calm-tx" data-view="transactions" hidden></section>

      <!-- Products: markup lives in bo-products.js -->
      <section class="view view-products" data-view="products" hidden></section>

      <!-- Inventory: markup lives in bo-inventory.js -->
      <section class="view view-inv" data-view="inventory" hidden></section>

      <!-- ============================================
           CUSTOMERS
           ============================================ -->
      <section class="view view-customers calm-cust" data-view="customers" hidden>
        <header class="view-head">
          <div class="view-title-wrap">
            <span id="custBack" hidden></span>
            <h1 id="custTitle">Customers</h1>
          </div>
          <div class="view-actions">
            <button class="primary-btn small" id="custAddBtn">Add customer</button>
          </div>
        </header>

        <div id="custList">
          <div class="w cust-strip" id="custStrip"></div>
          <div class="list-filters">
            <input class="search-input small q-input" id="custSearch" placeholder="Search customers..." />
            <select class="bo-select" data-cust="status" aria-label="Balance status"><option value="">Any balance</option><option value="Clear">Clear</option><option value="Active">Active</option><option value="In use">In use</option><option value="Near limit">Near limit</option></select>
            <select class="bo-select" data-cust="last" aria-label="Last order"><option value="">Any last order</option><option value="7">Bought in last 7 days</option><option value="30">Bought in last 30 days</option><option value="90">Bought in last 90 days</option><option value="-90">No order in 90+ days</option></select>
          </div>
          <section class="bo-card blk-table">
            <div class="bo-card-head">
              <span class="bo-card-label">All accounts</span>
            </div>
            <div class="bo-card-inset flush">
              <div class="table-wrap">
                <table class="data-table cust-table" id="custTable">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Phone</th>
                      <th class="num">Orders</th>
                      <th class="num">Spent</th>
                      <th>Last order</th>
                      <th class="num">Balance</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="custPager"></div>
            </div>
          </section>
        </div>

        <!-- The account screen: its figures sit in its first card (the list's are in #custStrip). -->
        <div id="custDetail" hidden></div>
        <dialog id="custDlg" class="bo-dialog adj-dlg"></dialog>
      </section>

      <!-- Suppliers: markup lives in bo-suppliers.js -->
      <section class="view view-suppliers" data-view="suppliers" hidden></section>

      <!-- Insights: markup lives in bo-insights.js -->
      <section class="view view-insights" data-view="insights" hidden></section>

      <!-- ============================================
           SETTINGS
           ============================================ -->
      <section class="view" data-view="payments" hidden></section>

      <!-- Settings: one section per URL (/admin/settings/<section>), one column of cards.
           Typed values read as rows (label, value, ›); a row opens its card's fields in #setDlg.
           On/off and pick-one settings save the moment they change, like Appearance (per device)
           and Staff & access (bo-staff.js). No Save bar. -->
      <section class="view view-settings" data-view="settings" hidden>
        <div class="set-pane" data-pane="store" hidden>
          <header class="view-head"><div class="view-title-wrap"><h1>Store</h1></div></header>
          <div class="set-col">
            <section class="bo-card blk-table">
              <div class="bo-card-head"><span class="bo-card-label">Store details</span></div>
              <div class="bo-card-inset flush set-rows" data-set-rows="store"></div>
            </section>
          </div>
        </div>

        <div class="set-pane" data-pane="tax" hidden>
          <header class="view-head"><div class="view-title-wrap"><h1>Tax</h1></div></header>
          <div class="set-col">
            <section class="bo-card blk-table">
              <div class="bo-card-head"><span class="bo-card-label">VAT</span></div>
              <div class="bo-card-inset flush set-rows">
                <div class="setting-row"><label for="setVatRegistered">VAT registered</label><input type="checkbox" id="setVatRegistered" data-set-now></div>
                <div data-set-rows="tax"></div>
              </div>
            </section>
          </div>
        </div>

        <div class="set-pane" data-pane="receipt" hidden>
          <header class="view-head"><div class="view-title-wrap"><h1>Receipt &amp; printing</h1></div></header>
          <div class="set-col">
            <section class="bo-card blk-table">
              <div class="bo-card-head"><span class="bo-card-label">Printing</span></div>
              <div class="bo-card-inset flush set-rows">
                <div class="setting-row"><label for="setPrinterWidth">Printer width</label>
                  <select class="bo-select" id="setPrinterWidth" data-set-now><option value="58mm">58 mm</option><option value="80mm">80 mm</option></select></div>
                <div class="setting-row"><label for="setPrintOnSale">Print on sale</label><input type="checkbox" id="setPrintOnSale" data-set-now></div>
                <div class="setting-row"><label for="setLogoOnReceipt">Logo on receipt</label><input type="checkbox" id="setLogoOnReceipt" data-set-now></div>
              </div>
            </section>
          </div>
        </div>

        <!-- Staff & access: bo-staff.js renders into this pane. -->
        <div class="set-pane" data-pane="staff" id="staffPane" hidden></div>

        <div class="set-pane" data-pane="appearance" hidden>
          <header class="view-head"><div class="view-title-wrap"><h1>Appearance</h1></div></header>
          <div class="set-col">
            <section class="bo-card blk-table">
              <div class="bo-card-head"><span class="bo-card-label">This device</span><span class="bo-card-sub">Applies as you pick</span></div>
              <div class="bo-card-inset flush set-rows">
                <div class="setting-row">
                  <label for="settingsChartHue">Chart colours
                    <small>The second line on the sales chart (gross profit).</small>
                  </label>
                  <select class="bo-select" id="settingsChartHue"><option value="violet">Blue + violet</option><option value="blues">Two blues</option></select>
                </div>
                <div class="setting-row">
                  <label for="settingsChartStyle">Chart style
                    <small>Lines or bars on every sales chart.</small>
                  </label>
                  <select class="bo-select" id="settingsChartStyle"><option value="line">Line</option><option value="bars">Bars</option></select>
                </div>
                <div class="setting-row">
                  <label for="settingsDensityToggle">Back office row size
                    <small>Height and text size of every list. Larger is easier on the eyes.</small>
                  </label>

  <script>
    // ---- Back office: sidebar state (see "Sidebar state" in docs/backoffice.md) ----
    // 1024px+ : the sidebar is always there, full or the icon rail (.side-rail, a saved per-device pref).
    // Under it: an overlay, shut unless .side-open -- in memory only, dropped on every crossing of 1024px.
    (function () {
      var app = document.getElementById('app');
      var btn = document.getElementById('boSidebarToggle');
      if (!app) return;
      var wide = window.matchMedia('(min-width: 1024px)');
      function setOpen(on) { app.classList.toggle('side-open', !!on && !wide.matches); }
      wide.addEventListener('change', function () { setOpen(false); });
      btn.addEventListener('click', function () { setOpen(!app.classList.contains('side-open')); });
      document.addEventListener('click', function (e) {
        if (!app.classList.contains('side-open')) return;
        var t = e.target;
        if (btn.contains(t)) return;
        // Picking a page shuts it (peeking a tree with the chevron doesn't); so does a tap on the backdrop.
        if (t.closest('.bo-sidebar') ? t.closest('.side-link, .side-sublink') && !t.closest('.side-chev') : true) setOpen(false);
      });

      // Drag the sidebar's right edge to resize (desktop only); the width is a per-device pref.
      var grip = document.getElementById('sideResizer');
      // Dragged left of FOLD_AT it previews the icon rail; back past OPEN_AT (hysteresis, so it
      // doesn't flicker on the line) it opens again. Only letting go commits the fold.
      var MIN_W = 168, MAX_W = 320, FOLD_AT = 96, OPEN_AT = 128;
      var dragFromW = '', foldedAt = 0;
      function setSideW(w) { document.body.style.setProperty('--po-sidebar-w', w + 'px'); }
      var savedW = +HWPOS_STORE.ui.get('sidebarW');
      if (savedW >= MIN_W && savedW <= MAX_W) {
        // Apply with transitions off so the page doesn't slide in from the default width on load.
        app.classList.add('side-resizing');
        setSideW(savedW);
        void app.offsetWidth;
        app.classList.remove('side-resizing');
      }
      if (grip) {
        grip.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          grip.setPointerCapture(e.pointerId);
          app.classList.add('side-resizing');
          dragFromW = document.body.style.getPropertyValue('--po-sidebar-w');
        });
        // One width change per frame: every change re-lays out the page beside it, and a mouse can
        // fire several moves a frame.
        var dragX = null;
        grip.addEventListener('pointermove', function (e) {
          if (!grip.hasPointerCapture(e.pointerId)) return;
          if (dragX === null) requestAnimationFrame(dragTo);
          dragX = e.clientX;
        });
        function dragTo() {
          var x = dragX;
          dragX = null;
          if (x === null) return;   // let go before this frame
          var railed = app.classList.contains('side-rail');
          if (railed ? x <= OPEN_AT : x < FOLD_AT) {
            if (!railed) {   // transitions back on, so the preview folds in its one motion
              app.classList.remove('side-resizing');
              setRail(true);
              foldedAt = Date.now();
            }
            return;
          }
          // Under MIN_W the edge still follows, at half speed, so it leans into the fold rather than
          // stopping dead at 168 and then jumping; letting go there springs back to MIN_W.
          setSideW(Math.round(x < MIN_W ? MIN_W - (MIN_W - x) / 2 : Math.min(MAX_W, x)));
          if (railed) { setRail(false); foldedAt = Date.now(); }
          // Let an open/fold finish its .24s slide before the drag goes back to tracking 1:1.
          if (Date.now() - foldedAt > 240) app.classList.add('side-resizing');
        }
        grip.addEventListener('lostpointercapture', function () {
          dragTo();   // a flick let go before its frame still lands where it was let go
          app.classList.remove('side-resizing');
          if (app.classList.contains('side-rail')) {
            // Folded: keep the width it had before the drag for when it unfolds.
            if (dragFromW) document.body.style.setProperty('--po-sidebar-w', dragFromW);
            else document.body.style.removeProperty('--po-sidebar-w');
            setRail(true, true);
          } else if (parseInt(document.body.style.getPropertyValue('--po-sidebar-w'), 10) < MIN_W) {
            setSideW(MIN_W);
          }
          HWPOS_STORE.ui.set('sidebarW', parseInt(document.body.style.getPropertyValue('--po-sidebar-w'), 10) || '');
        });
        grip.addEventListener('dblclick', function () {
          document.body.style.removeProperty('--po-sidebar-w');
          HWPOS_STORE.ui.set('sidebarW', '');
        });
      }

      // Fold to an icon rail (desktop only -- CSS ignores .side-rail below 1024px, where the
      // overlay's .side-open rules). A per-device pref, like the width.
      var railBtn = document.getElementById('sideRailBtn');
      function setRail(on, save) {
        app.classList.toggle('side-rail', on);
        railBtn.setAttribute('aria-expanded', String(!on));
        document.querySelectorAll('.bo-sidebar .side-link').forEach(function (l) {
          var t = l.querySelector('span');
          if (on && t) l.title = t.textContent.trim(); else l.removeAttribute('title');
        });
        if (save) HWPOS_STORE.ui.set('sidebarRail', on ? '1' : '');
      }
      if (HWPOS_STORE.ui.get('sidebarRail') === '1') {
        app.classList.add('side-resizing');   // no slide on load, as with the saved width
        setRail(true);
        void app.offsetWidth;
        app.classList.remove('side-resizing');
      }
      railBtn.addEventListener('click', function () {
        if (typeof closeSideMenus === 'function') closeSideMenus();
        setRail(!app.classList.contains('side-rail'), true);
      });
      // The store and account menus need the full width, so a badge clicked on the rail unfolds first.
      document.querySelectorAll('.bo-sidebar .side-switch').forEach(function (b) {
        b.addEventListener('click', function () {
          if (app.classList.contains('side-rail') && wide.matches) setRail(false, true);
        });
      });
    })();
  </script>
