<!doctype html>
<html lang="en" class="bo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F6F3" />
  <title>EJ Hardware — Back Office</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Geist:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=125" />
  <link rel="stylesheet" href="/bo-products.css?v=97" />
  <link rel="stylesheet" href="/bo-inventory.css?v=90" />
  <link rel="stylesheet" href="/bo-sales.css?v=87" />
  <link rel="stylesheet" href="/bo-suppliers.css?v=85" />
  <link rel="stylesheet" href="/bo-staff.css?v=86" />
  <link rel="stylesheet" href="/bo-insights.css?v=3" />
  <link rel="stylesheet" href="/bo-blocks.css?v=29" />
</head>
<body class="bo-body bo-light">
  <div id="app" class="bo-app">

    <!-- ============== TOPBAR (black strip) ============== -->
    <!-- ponytail: no topbar. The hamburger only matters below 1024px, where the
         sidebar overlays; CSS hides it on desktop. -->
    <button id="boSidebarToggle" class="bo-hamburger" aria-label="Toggle menu" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- ============== SIDEBAR ============== -->
    <aside class="sidebar bo-sidebar">
      <div class="side-resizer" id="sideResizer" title="Drag to resize · double-click to reset"></div>
      <!-- Location switcher: business on the small line, the location you switch on the big one. -->
      <div class="side-switch-wrap">
        <button class="side-switch" id="locBtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="ss-mark" id="locMark">EJ</span>
          <span class="ss-text"><span class="ss-label" id="locBiz">EJ Hardware</span><span class="ss-name" id="locName">Main Store</span></span>
          <svg class="ss-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        </button>
        <div class="side-menu" id="locMenu" role="menu" hidden></div>
      </div>

      <nav class="side-nav">
        <button class="side-label" type="button" data-fold="main-menu" aria-expanded="true">Main menu<svg class="side-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-fold"><div class="side-fold-in">
          <button class="side-link active" data-view="dashboard">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
            <span>Dashboard</span>
          </button>
          <button class="side-link" data-view="sales">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" stroke-width="3.4" d="M5 20v-5M10 20V9M15 20v-7M20 20V4"/></svg>
            <span>Sales</span>
          </button>
          <button class="side-link" data-view="sales" data-sub="tx">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path class="i-cut" d="M9 8.5h6M9 12.5h6"/></svg>
            <span>Transactions</span>
          </button>
          <button class="side-link" data-view="customers">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg>
            <span>Customers</span>
          </button>
        </div></div>
        <button class="side-label" type="button" data-fold="stock" aria-expanded="true">Stock<svg class="side-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-fold"><div class="side-fold-in">
          <button class="side-link" data-view="products">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle class="i-hole" cx="7.5" cy="7.5" r="1.8"/></svg>
            <span>Products</span>
          </button>
          <button class="side-link" data-view="inventory" data-sub="prices">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M3 3v18h18"/><path d="M7 17v-2.5l4-4 3 3 6-6V17z"/></svg>
            <span>Price history</span>
          </button>
          <button class="side-link" data-view="inventory">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path class="i-cut" fill="none" d="m3.5 8.3 8.5 4.7 8.5-4.7M12 13v8"/></svg>
            <span>Inventory</span>
          </button>
          <button class="side-link" data-view="inventory" data-sub="reorder">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M2 3h3l1.2 5"/><path d="M6.2 8h15.3l-1.6 7a2 2 0 0 1-2 1.5H9.6a2 2 0 0 1-2-1.6z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
            <span>Needs buying</span>
          </button>
          <button class="side-link" data-view="suppliers" data-sub="orders">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="8.5" y="2" width="7" height="3.5" rx="1"/><path class="i-cut" d="M9 11h6M9 15h4"/></svg>
            <span>Purchase orders</span>
          </button>
          <button class="side-link" data-view="suppliers" data-sub="suppliers">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17V6a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v11z"/><path d="M14 9h4l4 4v4h-8z"/><circle class="i-cut" cx="6.5" cy="17.5" r="2.8"/><circle class="i-cut" cx="17.5" cy="17.5" r="2.8"/></svg>
            <span>Suppliers</span>
          </button>
        </div></div>
        <button class="side-label" type="button" data-fold="reports" aria-expanded="true">Reports<svg class="side-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-fold"><div class="side-fold-in">
          <button class="side-link" data-view="insights" data-sub="cash stockouts dead sell lost counts">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path class="i-cut" fill="none" d="M6 12h2.5l2-4 3 8 2-4H18"/></svg>
            <span>Stock health</span>
          </button>
          <button class="side-link" data-view="insights" data-sub="reorder leads prices">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M12 3v9m-4-4 4 4 4-4"/><path d="M3 15h18v3a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/></svg>
            <span>Buying</span>
          </button>
          <button class="side-link" data-view="insights" data-sub="cycles basket deliveries">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path class="i-cut" fill="none" d="M16 12a4 4 0 1 1-1.2-2.9M16 7v3h-3"/></svg>
            <span>Customer habits</span>
          </button>
          <button class="side-link" data-view="insights" data-sub="days staff">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M8 3v3M16 3v3"/><rect x="3" y="5" width="18" height="16" rx="2.5"/><path class="i-cut" d="M3 10h18"/></svg>
            <span>Days &amp; staff</span>
          </button>
        </div></div>
        <button class="side-label" type="button" data-fold="manage" aria-expanded="true">Manage<svg class="side-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="side-fold"><div class="side-fold-in">
          <button class="side-link" data-view="staff">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0z"/><path fill="none" d="M16 4.3a3.5 3.5 0 0 1 0 6.4M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>
            <span>Staff</span>
          </button>
          <button class="side-link" data-view="staff" data-sub="attendance">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path class="i-cut" fill="none" d="M12 7v5l3 2"/></svg>
            <span>Attendance</span>
          </button>
          <button class="side-link" data-view="payments">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path class="i-cut" d="M2 10h20M6 15h4"/></svg>
            <span>Payments</span>
          </button>
          <button class="side-link" data-view="settings">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="none" d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
            <span>Settings</span>
          </button>
        </div></div>
      </nav>

      <div class="side-footer">
        <!-- Account switcher: name + role, no avatar. -->
        <div class="side-switch-wrap">
          <button class="side-switch acct" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="ss-text"><span class="ss-name" id="acctName">El John</span><span class="ss-label" id="acctRole">Owner</span></span>
            <svg class="ss-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
          </button>
          <div class="side-menu up" id="acctMenu" role="menu" hidden></div>
        </div>
      </div>
    </aside>

    <!-- ============== MAIN ============== -->
    <div class="main bo-main">

      <!-- ============================================
           DASHBOARD
           ============================================ -->
      <section class="view view-dashboard active" data-view="dashboard">
        <header class="view-head">
          <div class="view-title-wrap">
            <h1 id="dashGreeting">Welcome back</h1>
          </div>
          <div class="view-actions">
            <button class="secondary-btn small" id="dashEditBtn" aria-pressed="false">Edit</button>
            <button class="pct-toggle" id="statDeltaToggle" title="Change vs previous period">%</button>
            <!-- One control: the range and the day it ends on -->
            <div class="range-picker" id="rangePicker">
              <button class="range-btn" id="rangeBtn" aria-expanded="false" aria-haspopup="true">
                <span id="rangeBtnLabel">Today</span>
                <span class="rp-date" id="rangeBtnDate"></span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="rp-menu" id="rangeMenu" hidden>
                <button class="rp-opt" data-range="today">Today</button>
                <button class="rp-opt" data-range="7d">Last 7 days</button>
                <button class="rp-opt" data-range="15d">Last 15 days</button>
                <button class="rp-opt" data-range="30d">Last 30 days</button>
                <label class="rp-date-row">Ends on<input type="date" class="bo-date" id="dashDate" /></label>
              </div>
            </div>
            <button class="primary-btn small" id="dashExportBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 20h16"/></svg>
              Export CSV
            </button>
          </div>
        </header>

        <!-- Left is fixed: four KPIs, the chart, recent transactions — same order in every store.
             Right is the owner's rail of widgets (backoffice.js → DASH_WIDGETS); Edit adds, removes and reorders them. -->
        <div class="dash-stack show-delta" id="dashStack">
          <div class="dash-main">
            <div class="stat-grid show-delta" id="dashKpis"></div>

            <section class="bo-card blk-chart">
              <span class="bo-card-label">Sales trend</span>
              <div class="blk-keys" id="trendKeys">
                <button class="blk-key s0" aria-pressed="true"><i></i>Revenue <b id="trendKey0"></b></button>
                <button class="blk-key s1" aria-pressed="true"><i></i>Gross profit <b id="trendKey1"></b></button>
              </div>
              <div class="blk-plot" id="salesChart"></div>
            </section>

            <!-- Recent transactions -->
            <section class="bo-card blk-table">
              <div class="bo-card-head">
                <span class="bo-card-label">Recent transactions<span class="bo-card-count" id="txCount"></span></span>
                <button class="link-btn" data-jump="sales" data-sub="tx">View all →</button>
              </div>
              <div class="bo-card-inset flush">
                <div class="table-wrap">
                  <table class="data-table" id="txTable">
                    <thead>
                      <tr>
                        <th>Receipt</th>
                        <th>Time</th>
                        <th>Customer</th>
                        <th>Staff</th>
                        <th>Fulfilment</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th class="num">Total</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>

          <div class="dash-rail" id="dashRail"></div>
        </div>
      </section>

      <!-- Sales: markup lives in bo-sales.js -->
      <section class="view view-sales" data-view="sales" hidden></section>

      <!-- Products: markup lives in bo-products.js -->
      <section class="view view-products" data-view="products" hidden></section>

      <!-- Inventory: markup lives in bo-inventory.js -->
      <section class="view view-inv" data-view="inventory" hidden></section>

      <!-- ============================================
           CUSTOMERS
           ============================================ -->
      <section class="view view-customers" data-view="customers" hidden>
        <header class="view-head">
          <div class="view-title-wrap">
            <span id="custBack" hidden></span>
            <h1 id="custTitle">Customers</h1>
          </div>
          <div class="view-actions">
            <button class="primary-btn small" id="custAddBtn">Add customer</button>
          </div>
        </header>

        <div class="kpi-row" id="custKpis"></div>

        <div id="custList">
          <section class="bo-card blk-table">
            <div class="bo-card-head">
              <span class="bo-card-label">All accounts</span>
              <input class="search-input small q-input" id="custSearch" placeholder="Search customers..." />
            </div>
            <div class="bo-card-inset flush">
              <div class="table-wrap">
                <table class="data-table cust-table" id="custTable">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Phone</th>
                      <th>Address</th>
                      <th class="num">Credit limit</th>
                      <th class="num">Balance</th>
                      <th class="num">Available</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div id="custPager"></div>
            </div>
          </section>
        </div>

        <div id="custDetail" hidden></div>
        <dialog id="custDlg" class="bo-dialog adj-dlg"></dialog>
      </section>

      <!-- Suppliers: markup lives in bo-suppliers.js -->
      <section class="view view-suppliers" data-view="suppliers" hidden></section>

      <!-- Staff: markup lives in bo-staff.js -->
      <section class="view view-staff" data-view="staff" hidden></section>

      <!-- Insights: markup lives in bo-insights.js -->
      <section class="view view-insights" data-view="insights" hidden></section>

      <!-- ============================================
           SETTINGS
           ============================================ -->
      <section class="view" data-view="payments" hidden></section>

      <section class="view view-settings" data-view="settings" hidden>
        <header class="view-head">
          <div class="view-title-wrap">
            <h1>Settings</h1>
          </div>
        </header>

        <div class="settings-grid">
          <div class="panel">
            <div class="panel-head"><div class="panel-title">Store</div></div>
            <div class="setting-row"><label>Store name</label><input class="text-input" id="setStoreName"></div>
            <div class="setting-row"><label>Address</label><input class="text-input" id="setStoreAddress"></div>
            <div class="setting-row"><label>Phone</label><input class="text-input" id="setStorePhone"></div>
            <div class="setting-row"><label>Currency</label><input class="text-input" id="setCurrency"></div>
          </div>

          <div class="panel">
            <div class="panel-head"><div class="panel-title">Tax</div></div>
            <div class="setting-row"><label>VAT registered</label><input type="checkbox" id="setVatRegistered"></div>
            <div class="setting-row"><label>VAT rate</label><input class="text-input" id="setVatRate"></div>
            <div class="setting-row"><label>TIN</label><input class="text-input" id="setTin"></div>
          </div>

          <div class="panel">
            <div class="panel-head"><div class="panel-title">Sync</div></div>
            <div class="setting-row"><label>Backend URL</label><input class="text-input" id="setBackendUrl" placeholder="Set when backend is ready"></div>
            <div class="setting-row"><label>Sync interval</label><input class="text-input" id="setSyncInterval"></div>
            <div class="setting-row"><label>Allow offline sales</label><input type="checkbox" id="setAllowOffline"></div>
          </div>

          <div class="panel">
            <div class="panel-head"><div class="panel-title">Printing</div></div>
            <div class="setting-row"><label>Printer width</label><input class="text-input" id="setPrinterWidth"></div>
            <div class="setting-row"><label>Print on sale</label><input type="checkbox" id="setPrintOnSale"></div>
            <div class="setting-row"><label>Logo on receipt</label><input type="checkbox" id="setLogoOnReceipt"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <div class="panel-title">Appearance</div>
            </div>
            <div class="setting-row">
              <label>Chart colours
                <div class="muted" style="font-size:var(--blk-t-micro);margin-top:2px">The second line on the sales chart (gross profit), on this device.</div>
              </label>
              <div class="seg" id="settingsChartHue" role="tablist">
                <button class="seg-btn active" data-hue="violet">Blue + violet</button>
                <button class="seg-btn" data-hue="blues">Two blues</button>
              </div>
            </div>
            <div class="setting-row">
              <label>Back office row size
                <div class="muted" style="font-size:var(--blk-t-micro);margin-top:2px">Height and text size of every list on this device. Larger is easier on the eyes.</div>
              </label>
              <div class="seg" id="settingsDensityToggle" role="tablist">
                <button class="seg-btn" data-density="sm">S</button>
                <button class="seg-btn active" data-density="md">M</button>
                <button class="seg-btn" data-density="lg">L</button>
              </div>
            </div>
            <div class="setting-row">
              <label>Sell-screen tile size
                <div class="muted" style="font-size:var(--blk-t-micro);margin-top:2px">Affects the POS Sell grid (S = 30/page, M = 20/page, L = 12/page)</div>
              </label>
              <div class="seg" id="settingsSizeToggle" role="tablist">
                <button class="seg-btn" data-size="sm">S</button>
                <button class="seg-btn active" data-size="md">M</button>
                <button class="seg-btn" data-size="lg">L</button>
              </div>
            </div>
            <div class="setting-row">
              <label>Show price on tiles</label>
              <input type="checkbox" id="settingsShowPrice">
            </div>
          </div>

          <div class="panel">
            <div class="panel-head"><div class="panel-title">Backup</div></div>
            <div class="setting-row">
              <label>Full local backup
                <div class="muted" style="font-size:var(--blk-t-micro);margin-top:2px">Exports products, orders, customers, settings, folders, groups, and POS display preferences.</div>
              </label>
              <button class="primary-btn" id="backupExportBtn">Export backup</button>
            </div>
            <div class="setting-row">
              <label>Restore backup
                <div class="muted" style="font-size:var(--blk-t-micro);margin-top:2px">Replaces this browser/device data with a Hardware POS backup file.</div>
              </label>
              <button class="secondary-btn" id="backupImportBtn">Restore backup</button>
              <input type="file" id="backupImportFile" accept="application/json,.json" hidden>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <dialog id="orderDlg" class="bo-dialog"></dialog>
  <!-- Outside the views: a dialog in a hidden section never shows. Targets opens from the dashboard and Sales. -->
  <dialog id="targetDlg" class="bo-dialog adj-dlg"></dialog>
  <dialog id="staffDlg" class="bo-dialog"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script>
    // ---- Back office: hamburger + topbar wiring (white mode) ----
    (function () {
      var app = document.getElementById('app');
      var btn = document.getElementById('boSidebarToggle');
      var title = document.getElementById('boTopbarTitle');
      if (!app) return;

      // Default collapsed on mobile, open on desktop
      var isDesktop = window.matchMedia('(min-width: 1024px)').matches;
      if (!isDesktop) app.classList.add('sidebar-collapsed');

      if (btn) {
        btn.addEventListener('click', function () {
          app.classList.toggle('sidebar-collapsed');
        });
      }

      // Close sidebar on mobile when user picks a nav item
      document.querySelectorAll('.side-link').forEach(function (link) {
        link.addEventListener('click', function (e) {
          if (e.target.closest('.side-chev')) return;   // peeking a tree is not picking a page
          if (!window.matchMedia('(min-width: 1024px)').matches) {
            app.classList.add('sidebar-collapsed');
          }
          // Update topbar title to match current section
          var view = link.dataset.view || '';
          if (title && view) {
            title.textContent = view.charAt(0).toUpperCase() + view.slice(1);
          }
        });
      });

      // Drag the sidebar's right edge to resize (desktop only); the width is a per-device pref.
      var grip = document.getElementById('sideResizer');
      var MIN_W = 168, MAX_W = 320;
      function setSideW(w) { document.body.style.setProperty('--po-sidebar-w', w + 'px'); }
      var savedW = +HWPOS_STORE.ui.get('sidebarW');
      if (savedW >= MIN_W && savedW <= MAX_W) {
        // Apply with transitions off so the page doesn't slide in from the default width on load.
        app.classList.add('side-resizing');
        setSideW(savedW);
        void app.offsetWidth;
        app.classList.remove('side-resizing');
      }
      if (grip) {
        grip.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          grip.setPointerCapture(e.pointerId);
          app.classList.add('side-resizing');
        });
        grip.addEventListener('pointermove', function (e) {
          if (!grip.hasPointerCapture(e.pointerId)) return;
          setSideW(Math.round(Math.min(MAX_W, Math.max(MIN_W, e.clientX))));
        });
        grip.addEventListener('lostpointercapture', function () {
          app.classList.remove('side-resizing');
          HWPOS_STORE.ui.set('sidebarW', parseInt(document.body.style.getPropertyValue('--po-sidebar-w'), 10) || '');
        });
        grip.addEventListener('dblclick', function () {
          document.body.style.removeProperty('--po-sidebar-w');
          HWPOS_STORE.ui.set('sidebarW', '');
        });
      }

      // Tapping the dimmed backdrop on mobile closes the overlay
      document.addEventListener('click', function (e) {
        if (window.matchMedia('(min-width: 1024px)').matches) return;
        if (app.classList.contains('sidebar-collapsed')) return;
        var sidebar = document.querySelector('.bo-sidebar');
        if (sidebar && !sidebar.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
          app.classList.add('sidebar-collapsed');
        }
      });
    })();
  </script>
