<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big number pop-in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=910">
<style>
  /* lab only: drafts for how the big number (checkout, custom price) comes in. Tokens from styles.css */
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-stack); overflow: hidden; }
  .hp-bar { position: fixed; inset: 0 0 auto; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); }
  .hp-bar select, .hp-bar button { height: 36px; padding: 0 12px; border-radius: var(--es-r); background: var(--tile); color: var(--ink); font: 500 14px var(--font-stack); border: 0; }
  .hp-bar button.cta { background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); }
  .hp-stage { position: relative; height: 100%; max-width: 430px; margin: 0 auto; }
  .hp-hint { position: absolute; top: calc(var(--hero-y) - 30px); width: 100%; text-align: center; color: var(--ink-tertiary); font-size: 15px; }
  .hp-num { position: absolute; top: var(--hero-y); width: 100%; text-align: center; font-family: var(--hero-font); font-size: var(--hero-fs); font-weight: var(--hero-fw);
            letter-spacing: -.04em; line-height: var(--hero-fs); font-variant-numeric: tabular-nums; white-space: nowrap; transition: color .3s ease-out; }
  .hp-num.empty { color: var(--ink-tertiary); }   /* nothing typed: a grey ₱0, as Phantom's $0 */
  .hp-below { position: absolute; top: calc(var(--hero-y) + var(--hero-fs) + var(--hero-gap)); inset-inline: 16px; display: grid; gap: 8px; }
  .hp-row { height: 56px; border-radius: var(--es-r); background: var(--tile); display: flex; align-items: center; padding: 0 16px; font-size: 17px; }
  .hp-keys { grid-template-columns: repeat(3, 1fr); }
  .hp-keys button { height: 60px; border-radius: var(--es-r); background: var(--tile); color: var(--ink); font: 500 24px var(--font-stack); border: 0; }
  .hp-keys button:active { background: var(--surface-hover); }
  .hp-keys .cta { grid-column: 1 / -1; height: 52px; font-size: 17px; background: var(--cta-bg); color: var(--cta-ink); box-shadow: var(--cta-shadow); }

  /* one character in its own box, so it can move on its own; it grows from its foot, as Phantom's */
  .ch, .ch > i { display: inline-block; font-style: normal; transform-origin: 50% 85%; }
  .ghost { position: absolute; top: 0; pointer-events: none; }

  /* ── opening ── */
  .op-blur .ch  { animation: nd-in .34s ease-out both; animation-delay: calc(var(--i) * 20ms); }   /* Check out's own blur (nd-in), a touch slower */
  .op-blurup    { animation: blurup .5s cubic-bezier(.32, .72, 0, 1) both; }
  .op-grow .ch  { animation: grow .5s cubic-bezier(.32, .72, 0, 1) both; animation-delay: calc(var(--i) * 18ms); }
  @keyframes blurup { from { opacity: 0; filter: blur(10px); transform: translateY(10px); } }
  @keyframes grow   { from { opacity: 0; filter: blur(4px); transform: scale(.5); } }
</style>
</head>
<body>
<div class="hp-bar">
  <select id="screen" aria-label="Screen"><option value="co">Checkout</option><option value="cp">Custom price</option></select>
  <select id="open" aria-label="Opening">
    <option value="">Opening: Now (none)</option>
    <option value="grow" selected>Opening: Grow</option>
    <option value="blur">Opening: Blur (Check out's)</option>
    <option value="blurup">Opening: Blur up</option>
  </select>
  <select id="type" aria-label="Typing" hidden>
    <option value="">Typing: Now (none)</option>
    <option value="smooth" selected>Typing: Smooth</option>
    <option value="phantom">Typing: Phantom (as theirs)</option>
    <option value="blur">Typing: Blur (Check out's)</option>
  </select>
  <select id="theme" aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option></select>
  <button class="cta" id="replay">Replay</button>
</div>
<div class="hp-stage">
  <div class="hp-hint" id="hint"></div>
  <div class="hp-num" id="num"></div>
  <div class="hp-below" id="below"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' });   // lab stand-in for peso()
const sym = fmt.formatToParts(0).find((p) => p.type === 'currency').value;
const TOTAL = 1250;
const IOS = 'cubic-bezier(.32, .72, 0, 1)';   // iOS's sheet curve: quick start, long soft landing, no bounce
let typed = '';   // custom price as typed: "125.5"

// typing: the rest glide to their new place in `ms`; a new character grows from `scale` there, a gone one shrinks back.
// Its fade is its own, short (`fadeIn` / `fadeOut`): on the glide's long soft landing a fade lingered, faint, for ~.25s
const TY = {
  smooth:  { ms: 380, ease: IOS, scale: .5, blur: 4, fadeIn: 160, fadeOut: 110 },
  phantom: { ms: 160, ease: 'cubic-bezier(.2, .8, .2, 1)', scale: .5, blur: 0, fadeIn: 130, fadeOut: 110 },
  blur:    { ms: 300, ease: 'ease-out', scale: 1, blur: 5, fadeIn: 260, fadeOut: 200 },
};

// the typed amount as characters with lasting keys: a digit keeps its key as more are typed, a comma is keyed by the
// digits to its right, so "5,000" -> "50,000" slides the comma over instead of swapping it
function parts(s) {
  const out = [{ k: 's', c: sym }];
  if (!s) return [...out, { k: 'z', c: '0' }];
  const [i, d] = s.split('.');
  [...i].forEach((c, j) => { out.push({ k: 'd' + j, c }); const r = i.length - 1 - j; if (r && r % 3 === 0) out.push({ k: 'c' + r, c: ',' }); });
  if (d !== undefined) { out.push({ k: 'p', c: '.' }); [...d].forEach((c, j) => out.push({ k: 'f' + j, c })); }
  return out;
}

function render(list, mode) {
  const n = $('num'), T = TY[mode];
  const box = n.getBoundingClientRect();
  const mid = (e) => { const r = e.getBoundingClientRect(); return (r.left + r.right) / 2; };   // where it shows now, mid-slide included
  const old = new Map([...n.querySelectorAll('.ch:not(.ghost)')].map((e) => [e.dataset.k + e.textContent, { el: e, x: mid(e) }]));
  const els = list.map((p) => {
    const e = old.get(p.k + p.c)?.el;
    if (e) return e;
    const s = document.createElement('span');
    s.className = 'ch';
    s.dataset.k = p.k;
    s.append(Object.assign(document.createElement('i'), { textContent: p.c }));
    return s;
  });
  const olds = [...old.values()];
  // a gone one's look as it is now, read while still on the page
  const gone = olds.filter((o) => !els.includes(o.el)).map((o) => {
    const cs = getComputedStyle(o.el.firstChild);
    return { ...o, op: +cs.opacity, sc: cs.transform === 'none' ? 1 : new DOMMatrix(cs.transform).a };
  });
  n.replaceChildren(...els);
  n.classList.toggle('empty', $('screen').value === 'cp' && !typed);
  if (!T) return;
  // plain `transform` only, so any phone runs it: the box (.ch) slides, the letter in it (i) grows and fades.
  // Typing fast, a slide still running is stopped and a new one starts from where the character is on screen
  const kept = els.filter((e) => old.get(e.dataset.k + e.textContent)?.el === e);
  kept.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
  // how far each kept character moves; a new or gone one rides halfway between the kept ones either side, so a comma
  // opens (or closes) in the middle of the gap between its 5 and 0, never on top of either while they slide
  const dx = new Map(kept.map((e) => [e, mid(e) - old.get(e.dataset.k + e.textContent).x]));
  const ride = (list, i) => {
    let a, b;
    for (let j = i - 1; j >= 0 && !a; j--) if (dx.has(list[j])) a = list[j];
    for (let j = i + 1; j < list.length && !b; j++) if (dx.has(list[j])) b = list[j];
    return a && b ? (dx.get(a) + dx.get(b)) / 2 : dx.get(a || b) || 0;
  };
  const fade = (from, to) => [{ opacity: from, filter: `blur(${to ? T.blur : 0}px)` }, { opacity: to, filter: `blur(${to ? 0 : T.blur}px)` }];
  const move = { duration: T.ms, easing: T.ease };
  const slide = (e, from, to, o = {}) => e.animate({ transform: [`translateX(${from}px)`, `translateX(${to}px)`] }, { ...move, ...o });
  const grow = (e, from, to, o = {}) => e.animate({ transform: [`scale(${from})`, `scale(${to})`] }, { ...move, ...o });
  els.forEach((e, i) => {
    if (dx.has(e)) { if (Math.abs(dx.get(e)) > .5) slide(e, -dx.get(e), 0); return; }
    slide(e, -ride(els, i), 0);
    grow(e.firstChild, T.scale, 1);
    e.firstChild.animate(fade(0, 1), { duration: T.fadeIn, easing: 'ease-out' });
  });
  gone.forEach((o) => {   // a removed character shrinks back where it was, carried along with its neighbours; gone in fadeOut
    const g = o.el, by = ride(olds.map((x) => x.el), olds.findIndex((x) => x.el === g));
    g.className = 'ch ghost';
    n.append(g);   // first: off the page it has no width, and its running animations can't be found to stop
    [g, g.firstChild].forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
    g.style.left = o.x - box.left - g.offsetWidth / 2 + 'px';
    slide(g, 0, by, { fill: 'forwards' });
    grow(g.firstChild, o.sc, T.scale, { fill: 'forwards' });
    g.firstChild.animate(fade(o.op, 0), { duration: T.fadeOut, easing: 'ease-out', fill: 'forwards' }).onfinish = () => g.remove();
  });
}

function open() {
  const co = $('screen').value === 'co', a = $('open').value, n = $('num');
  $('type').hidden = co;
  $('hint').textContent = co ? 'Total' : 'Custom item';
  $('below').className = 'hp-below' + (co ? '' : ' hp-keys');
  $('below').innerHTML = co
    ? ['Cash', 'Card', 'QR'].map((m) => `<div class="hp-row">${m}</div>`).join('')
    : [1, 2, 3, 4, 5, 6, 7, 8, 9, '.', 0, '⌫'].map((k) => `<button data-k="${k}">${k}</button>`).join('') + '<button class="cta">Add</button>';
  typed = '';
  n.replaceChildren();
  render(co ? [...fmt.format(TOTAL)].map((c, i) => ({ k: 'o' + i, c })) : parts(''));
  n.querySelectorAll('.ch').forEach((e, i) => e.style.setProperty('--i', i));
  n.className = 'hp-num' + (co ? '' : ' empty');
  void n.offsetWidth;
  if (a) n.classList.add('op-' + a);
}

function key(k) {
  const before = typed;
  if (k === '⌫') typed = typed.slice(0, -1);
  else if (k === '.') { if (!typed.includes('.')) typed = (typed || '0') + '.'; }
  else if (!/\.\d\d$/.test(typed) && typed.replace('.', '').length < 7) typed = (typed === '0' ? '' : typed) + k;
  if (typed === before) return;
  $('num').classList.remove('op-' + $('open').value);   // the opening is done; typing takes over
  render(parts(typed), $('type').value);
}

$('below').addEventListener('click', (e) => { const k = e.target.closest('[data-k]')?.dataset.k; if (k !== undefined) key(k); });
addEventListener('keydown', (e) => { if (/^[0-9.]$/.test(e.key)) key(e.key); if (e.key === 'Backspace') key('⌫'); });
$('theme').onchange = () => { document.body.classList.toggle('light-theme', $('theme').value === 'light'); };
for (const id of ['screen', 'open', 'replay']) $(id).addEventListener(id === 'replay' ? 'click' : 'change', open);
open();
</script>
</body>
</html>
