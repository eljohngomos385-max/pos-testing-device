<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Our menu black</title>
<!-- The dark-menu-copy.html format with our rows and icons (owner 2026-11-10). A mock-up, not wired into the app. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root { --bg: #000; --pill: #191919; --ink: #fff; --icon: #868686; --bar: #0d0d0d; --edge-1: #2c2c2c; --edge-2: #242424; --edge-3: #1b1b1b; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 500 17px/24px Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
.top { display: flex; align-items: center; gap: 8px; height: 44px; margin-top: calc(var(--ph-top, env(safe-area-inset-top, 0px)) + 8px); padding: 0 16px 0 26px; }
.ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 20px; letter-spacing: -.2px; }
.menu { padding: 16px 0 110px; }
.row { position: relative; display: flex; align-items: center; height: 48.125px; padding-left: 60.4px; }
.row.on::before { content: ""; position: absolute; inset: 0 64px auto 8px; height: 48px; border-radius: 16px; background: var(--pill); }
.row > * { position: relative; }
.row .ic { position: absolute; left: 26px; top: 50%; width: 20px; height: 20px; margin-top: -10px; fill: none; stroke: var(--icon); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.row .ic .dot { fill: var(--icon); stroke: none; }
.row.on .ic { stroke: var(--ink); }
.row.on .ic .f { fill: var(--ink); }
.bar { position: fixed; left: 50%; bottom: 28px; display: flex; gap: 8px; transform: translateX(-50%); }
.bar > *, .sw { display: flex; align-items: center; justify-content: center; flex: none; height: 56px; padding: 0; border: 0; border-radius: 28px; background: var(--bar); color: var(--ink); font: inherit; box-shadow: inset 0 0 0 .34px var(--edge-1), inset 0 0 0 .67px var(--edge-2), inset 0 0 0 1px var(--edge-3); }
.bar .round { width: 56px; }
.sw { width: 44px; height: 44px; }
.sw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bar .who { gap: 9.3px; min-width: 147px; max-width: calc(100vw - 144px); padding: 0 14px 0 12px; }
.who i { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bar); font: 600 12px/20px Inter, -apple-system, system-ui, sans-serif; text-align: center; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header class="top"><span class="ttl">EJ Hardware</span><button class="sw" aria-label="All items, tap for My page"><svg viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg></button></header>
<nav class="menu">
  <a class="row on"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M4 10.3a2 2 0 0 1 .8-1.6l6-4.5a2 2 0 0 1 2.4 0l6 4.5a2 2 0 0 1 .8 1.6V19a2 2 0 0 1-2 2h-3.5v-4.5a2.5 2.5 0 0 0-5 0V21H6a2 2 0 0 1-2-2z"/></svg><span>Sell</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="4.5" y="3" width="15" height="18" rx="4"/><path class="d" d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg><span>Orders</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3" y="6" width="18" height="5" rx="2"/><path d="M7 11v8M17 11v8"/></svg><span>Tables</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M3.5 5.5a2 2 0 0 1 2-2h5.7a2 2 0 0 1 1.4.6l7.6 7.6a2.5 2.5 0 0 1 0 3.5l-5.3 5.3a2.5 2.5 0 0 1-3.5 0l-7.6-7.6a2 2 0 0 1-.3-1.4z"/><circle class="d" cx="8" cy="8" r="1.5"/></svg><span>Items</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><circle class="f" cx="12" cy="8" r="4"/><path class="f" d="M4.5 19c0-3.2 3.4-5.5 7.5-5.5s7.5 2.3 7.5 5.5a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/></svg><span>Customers</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="8.5"/><path class="d" d="M12 7.5V12l3 2"/></svg><span>Shift</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="17" height="17" rx="5"/><path class="d" d="M8.5 16v-3M12 16V8M15.5 16v-5"/></svg><span>Reports</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><path class="f" d="M12 3.5c-4.9 0-8.5 3.4-8.5 7.7 0 2.2 1 4.2 2.6 5.6l-.6 3.1a.6.6 0 0 0 .9.6l3.3-1.8c.7.1 1.5.2 2.3.2 4.9 0 8.5-3.4 8.5-7.7S16.9 3.5 12 3.5z"/><path class="d" d="M8.5 9.8h7M8.5 13h4"/></svg><span>Chat</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="2.5"/><circle class="dot" cx="15" cy="15" r="1.4"/><circle class="dot" cx="19" cy="19" r="1.4"/><circle class="dot" cx="19" cy="15" r="1.4"/><circle class="dot" cx="15" cy="19" r="1.4"/></svg><span>QR codes</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="4" y="7" width="16" height="10" rx="2"/><circle class="d" cx="12" cy="12" r="2"/></svg><span>Cash in &amp; out</span></a>
  <a class="row"><svg class="ic" viewBox="0 0 24 24"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="13.5" width="7" height="7" rx="2.5"/></svg><span>Back office</span></a>
</nav>
<div class="bar">
  <button class="round" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10.3 3.4a1.8 1.8 0 0 1 3.4 0l.3.8a1.8 1.8 0 0 0 2.4 1l.8-.4a1.8 1.8 0 0 1 2.4 2.4l-.4.8a1.8 1.8 0 0 0 1 2.4l.8.3a1.8 1.8 0 0 1 0 3.4l-.8.3a1.8 1.8 0 0 0-1 2.4l.4.8a1.8 1.8 0 0 1-2.4 2.4l-.8-.4a1.8 1.8 0 0 0-2.4 1l-.3.8a1.8 1.8 0 0 1-3.4 0l-.3-.8a1.8 1.8 0 0 0-2.4-1l-.8.4a1.8 1.8 0 0 1-2.4-2.4l.4-.8a1.8 1.8 0 0 0-1-2.4l-.8-.3a1.8 1.8 0 0 1 0-3.4l.8-.3a1.8 1.8 0 0 0 1-2.4l-.4-.8a1.8 1.8 0 0 1 2.4-2.4l.8.4a1.8 1.8 0 0 0 2.4-1z"/><circle cx="12" cy="12" r="3" fill="var(--bar)"/></svg></button>
  <div class="who"><i>E</i><span>El John · POS 1</span></div>
  <button class="round" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
</div>
</body>
</html>
