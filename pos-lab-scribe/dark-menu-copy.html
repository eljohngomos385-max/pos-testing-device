<style>
:root { --bg: #000; --pill: #191919; --ink: #fff; --icon: #868686; --bar: #0d0d0d; --muted: #c7c7c7; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 500 17px/24px Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
.menu { padding: calc(var(--ph-top, env(safe-area-inset-top, 0px)) + 44px) 0 110px; }
.row { position: relative; display: flex; align-items: center; height: 48.125px; padding-left: 60.4px; }
.row.on::before { content: ""; position: absolute; inset: 0 64px auto 8px; height: 48px; border-radius: 16px; background: var(--pill); }
.row > * { position: relative; }
.row .ic { position: absolute; left: 26px; top: 50%; width: 20px; height: 20px; margin-top: -10px; fill: none; stroke: var(--icon); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.row .ic.solid { stroke: var(--bg); }
.row .ic.solid .tile { fill: var(--icon); stroke: none; }
.down { position: absolute; right: 27.8px; top: 50%; width: 16px; height: 10px; margin-top: -3.6px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.head { display: flex; align-items: center; gap: 12px; height: 24px; margin: 23.25px 0 14.75px; padding-left: 24.3px; font-size: 15px; font-weight: 600; }
.head.dim { gap: 10px; margin-top: 23px; color: var(--muted); }
.head svg { width: 9px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar { position: fixed; left: 50%; bottom: 28px; display: flex; gap: 8px; transform: translateX(-50%); }
.bar button { display: flex; align-items: center; justify-content: center; height: 56px; padding: 0; border: 0; border-radius: 28px; background: var(--bar); color: var(--ink); font: inherit; box-shadow: inset 0 0 0 .34px #2c2c2c, inset 0 0 0 .67px #242424, inset 0 0 0 1px #1b1b1b; }
.bar .round { width: 56px; }
.bar .quick { gap: 9.3px; width: 147px; padding-left: 2px; font-size: 17px; }
</style>
