<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales tabs lab</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   SALES TABS LAB — sales-calendar-lab.html with the sidebar, and 1 + 2 as one card:
     1 · the strip is the card's folder tabs, like the Dashboard's: the picked tab
         (Revenue · Gross profit · Receipts · Margin) is what every calendar cell shows
     2 · the calendar (month) or twelve month tiles (year), on the card's white panel
     3 · (the highlights moved into the Top 10: rank by Day or Time)
     4 · one Top 10 table: items, categories, weekdays or hours
     5 · three cards: payment methods, breakdown, staff
   Every chart and table moved into the side panel, scoped to the day or week
   you clicked. Tokens are sales-lab.html's --b-* set (→ --po-* on port).
   =========================================================================== */
:root {
  --b-font: "Inter";
  --b-page:      #FFFFFF;
  --b-card:      #F9F9F9;
  --b-raised:    #FFFFFF;
  --b-line:      #ECECEC;
  --b-outline:   #E1E1E1;
  --b-track:     #EFEFEF;
  --b-ink:       #303030;
  --b-ink-2:     #616161;
  --b-ink-3:     #8C8C8C;
  --b-up:        #047B5D;
  --b-down:      #D72C0D;
  --b-up-tint:   #D3ECDD;
  --b-down-tint: #F8D8D0;
  --b-up-soft:   #EAF6EF;     /* a good day's cell — lighter than the chip so 20 of them don't shout */
  --b-heat:      #1FA855;     /* a day over target: tinted faint (just made it) to ~half (furthest over) */
  --b-down-soft: #FCEDE9;
  --b-data:      #2B7DE9;
  --b-data-1:    #BCD7FA;
  --b-t-value:   27px;
  --b-t-label:   13px;
  --b-t-meta:    12.5px;
  --b-t-micro:   11px;
  --b-r-card:    14px;
  --b-r-cell:    10px;
  --b-r-row:     7px;
  --b-pad:       16px;
  --b-gap:       14px;
  --panel-w:     420px;
  --side-w:      208px;   /* drag the sidebar's edge: 180–300, double-click resets */
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--b-page); color: var(--b-ink);
  font-family: var(--b-font), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: var(--b-t-label); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- sidebar: from sales-calendar-sidebar-lab.html ---------- */
body { display: grid; grid-template-columns: auto minmax(0, 1fr); }
.side { position: sticky; top: 0; z-index: 2; height: 100vh; width: var(--side-w); display: flex; flex-direction: column;
        background: var(--b-page); border-right: 1px solid var(--b-line); }
.side a, .side button { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border: 0; background: none; cursor: pointer;
        border-radius: var(--b-r-row); text-decoration: none; color: var(--b-ink-2); text-align: left; white-space: nowrap; overflow: hidden; }
.side a:hover, .side button:hover { background: var(--b-card); color: var(--b-ink); }
.side svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.side .ud { width: 13px; height: 13px; margin-left: auto; color: var(--b-ink-3); }
.side .mark { width: 22px; height: 22px; flex: none; display: grid; place-items: center; background: var(--b-card); border: 1px solid var(--b-line);
              border-radius: 6px; font-size: 10px; font-weight: 600; color: var(--b-ink-2); }
.side .foot .mark { border-radius: 50%; }
.side .who b { color: var(--b-ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.side .who small { margin-left: auto; font-size: 12px; color: var(--b-ink-3); }
.side .head { padding: 20px 10px 8px; }
.side nav { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.side .grp + .grp { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--b-line); }
.side nav a svg { color: var(--b-ink-3); }
.side nav a:hover svg, .side nav a[aria-current="page"] svg { color: var(--b-ink); }
.side nav a[aria-current="page"] { background: var(--b-card); box-shadow: inset 0 0 0 1px var(--b-line); color: var(--b-ink); font-weight: 500; }
.side .foot { padding: 8px 10px 10px; border-top: 1px solid var(--b-line); }
.side .foot b { font-weight: 500; }
.grip { position: absolute; top: 0; bottom: 0; right: -4px; width: 8px; cursor: col-resize; }
.grip::after { content: ''; position: absolute; inset: 0 3px; background: var(--b-data); opacity: 0; transition: opacity .15s; }
.grip:hover::after, body.resizing .grip::after { opacity: .6; }
body.resizing { cursor: col-resize; user-select: none; }
.menu-btn, .scrim { display: none; }

/* ---------- page + panel: the calendar shrinks, it never hides ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.shell.open { grid-template-columns: minmax(0, 1fr) var(--panel-w); }
main { padding: 20px 24px 40px; max-width: 1180px; width: 100%; margin: 0 auto; container-type: inline-size; }

.note { font-size: var(--b-t-meta); color: var(--b-ink-3); margin: 0 0 14px; }
.note b { color: var(--b-ink-2); font-weight: 500; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.bar h1 { font-size: 18px; font-weight: 600; margin: 0 auto 0 0; }
.seg { display: inline-flex; background: var(--b-track); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; cursor: pointer; color: var(--b-ink-2); }
.seg button[aria-pressed="true"] { background: var(--b-raised); color: var(--b-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
.nav { display: inline-flex; align-items: center; gap: 4px; }
.nav b { min-width: 124px; text-align: center; font-weight: 600; font-size: 14px; }
.icon-btn { border: 1px solid var(--b-outline); background: var(--b-raised); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }
.icon-btn:disabled { opacity: .35; cursor: default; }

/* ---------- 1 + 2 · one card: the strip is its folder tabs (dashboard-calm-lab.html's), the calendar its white panel.
   The picked tab is white with no line under it, so it opens into the panel; the rest stay on the grey. ---------- */
.card { background: var(--b-card); border: 1px solid var(--b-line); border-radius: var(--b-r-card); }
.strip { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); border-bottom: 1px solid var(--b-line); }
.stat { position: relative; min-width: 0; width: 100%; padding: 10px 16px 12px; border: 0; border-left: 1px solid var(--b-line);
        background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; }
.stat:first-child { border-left: 0; border-top-left-radius: calc(var(--b-r-card) - 1px); }
.stat:last-child { border-top-right-radius: calc(var(--b-r-card) - 1px); }
.stat:hover { background: color-mix(in srgb, var(--b-raised) 50%, var(--b-card)); }
.stat[aria-selected="true"] { background: var(--b-raised); cursor: default; }
.stat[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--b-raised); }   /* covers the hairline */
.stat[aria-selected="true"] .lbl { color: var(--b-ink); font-weight: 500; }
.card .panel { background: var(--b-raised); padding: var(--b-pad); border-radius: 0 0 calc(var(--b-r-card) - 1px) calc(var(--b-r-card) - 1px); }
.stat .lbl { color: var(--b-ink-2); }
.stat .line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }
.stat .val { font-size: 22px; font-weight: 560; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .sub { color: var(--b-ink-3); font-size: var(--b-t-meta); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .val.up { color: var(--b-up); }
.stat .val.down { color: var(--b-down); }
.chip { font-size: var(--b-t-meta); font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--b-track);
        color: var(--b-ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.up { background: var(--b-up-tint); color: var(--b-up); }
.chip.down { background: var(--b-down-tint); color: var(--b-down); }
/* Best day and Target sit after the tabs: they aren't a measure, so a click opens the day / the target editor instead */
.stat.act:hover .lbl { color: var(--b-data); }
.stat .pct { font-size: var(--b-t-meta); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .set { color: var(--b-data); font-size: var(--b-t-meta); }
dialog.tdlg { border: 1px solid var(--b-line); border-radius: var(--b-r-card); padding: var(--b-pad); width: min(340px, calc(100vw - 32px));
              background: var(--b-raised); color: var(--b-ink); box-shadow: 0 12px 32px rgba(0,0,0,.14); }
dialog.tdlg::backdrop { background: rgba(0,0,0,.18); }
.tdlg h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
.tdlg label { display: block; color: var(--b-ink-2); }
.tdlg input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 15px; padding: 7px 10px; border: 1px solid var(--b-outline);
              border-radius: var(--b-r-row); font-variant-numeric: tabular-nums; }
.tdlg p { color: var(--b-ink-3); font-size: var(--b-t-meta); margin: 8px 0 0; }
.tdlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.tdlg button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--b-outline); background: var(--b-raised); cursor: pointer; }
.tdlg button[type="submit"] { background: var(--b-data); border-color: var(--b-data); color: #fff; font-weight: 500; }

/* ---------- 2 · the calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.15fr); gap: 8px; }
.cal .dow { text-align: center; color: var(--b-ink-3); font-size: var(--b-t-meta); padding-bottom: 2px; }
.cell { min-height: 92px; border: 1px solid var(--b-line); border-radius: var(--b-r-cell); background: var(--b-raised);
        padding: 9px 10px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
button.cell:hover { border-color: #C9C9C9; }
.cell .d { font-size: var(--b-t-meta); color: var(--b-ink-2); font-weight: 500; }
.cell .v { font-size: 15px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: auto; white-space: nowrap; }
.cell .m { font-size: var(--b-t-micro); color: var(--b-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .v .sm { display: none; }   /* phone swaps in the short figure */
.cell.good { background: var(--b-up-soft); border-color: #CFE7D9; }
.cell.good .v { color: var(--b-up); }
.cell.loss { background: var(--b-down-soft); border-color: #F2D3CB; }
.cell.loss .v { color: var(--b-down); }
.cell.shut, .cell.future { background: transparent; cursor: default; }
.cell.shut .m, .cell.future .d { color: #B5B5B5; }
.cell.pad { visibility: hidden; }
.cell.today { box-shadow: inset 0 0 0 1.5px var(--b-ink); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--b-data); }
.cell.week { background: var(--b-card); }
.cell.week .d { color: var(--b-ink-3); }
.legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 12px; color: var(--b-ink-3); font-size: var(--b-t-meta); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--b-line); }
.legend .g { background: var(--b-up-soft); border-color: #CFE7D9; }
.legend .r { background: var(--b-down-soft); border-color: #F2D3CB; }
/* heat: green above the daily bar, red below, strongest at the month's best and worst day */
.cell.heat { background: var(--heat); border-color: color-mix(in srgb, var(--heat) 85%, var(--b-ink)); }
.cell.heat .d, .cell.heat .m { color: rgba(0,0,0,.55); }   /* grey meta vanishes on a tint; darken the ink instead */
.legend .scale { width: 64px; height: 8px; border: 0; border-radius: 99px; margin: 0 8px; vertical-align: 0;
                 background: linear-gradient(90deg, color-mix(in srgb, var(--b-heat) 12%, white), color-mix(in srgb, var(--b-heat) 55%, white)); }

/* year: twelve tiles, same cell */
.months { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.months .cell { min-height: 110px; }
.months .cell .d { font-size: var(--b-t-label); }
.months .cell .v { font-size: 18px; }


/* ---------- 4 · top 10 ---------- */
.top { margin-top: 28px; background: var(--b-card); border: 1px solid var(--b-line); border-radius: var(--b-r-card); padding: 0 var(--b-pad); overflow: hidden; }
.flush { margin: 0 calc(-1 * var(--b-pad)); overflow-x: auto; }
.top table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.top th { white-space: nowrap; text-align: left; font-weight: 500; color: var(--b-ink-2); font-size: var(--b-t-meta); padding: 7px 12px; }
.top td { height: 34px; padding: 0 12px; white-space: nowrap; background: var(--b-raised); border-top: 1px solid var(--b-line); }
.top th:first-child, .top td:first-child { padding-left: var(--b-pad); }
.top th:last-child, .top td:last-child { padding-right: var(--b-pad); }
.top .empty { margin: 0; padding: 12px 0; }
/* See all is the table's last row: a link where a footer would be, only for items and categories */
.top .all { display: flex; align-items: center; height: 34px; padding-left: 24px; border-top: 1px solid var(--b-line); background: var(--b-raised);
            color: var(--b-data); text-decoration: none; font-size: var(--b-t-meta); }
.top .all:hover { background: #F6F6F6; }
/* the name column's header is the rank-by dropdown: Items / Categories / Day / Time, same row height */
.top th.sw { padding: 4px 12px 4px 10px; }
.top td.nm { padding-left: 24px; }   /* names start where the dropdown's text does: 10 + 1 border + 13 padding */
.top th select { font: inherit; font-weight: 500; color: var(--b-ink); padding: 4px 6px 4px 13px; border: 1px solid var(--b-outline);
                 border-radius: 8px; background: var(--b-raised); cursor: pointer; }
.top .nm { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top .nm small { color: var(--b-ink-3); font-size: var(--b-t-meta); margin-left: 8px; }
.top .n { text-align: right; }
.top td.amt { font-weight: 600; }
.top .sh { width: 150px; }
.top .sh span { display: inline-block; width: 90px; height: 6px; background: var(--b-track); border-radius: 99px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
.top .sh i { display: block; height: 100%; background: var(--b-data); border-radius: 99px; }
.top .cmp { color: var(--b-ink-3); font-size: var(--b-t-meta); width: 64px; }
.top .cmp.up { color: var(--b-up); }
.top .cmp.down { color: var(--b-down); }

/* ---------- 5 · payments, breakdown, staff: three equal cards, the dashboard rail's widget look ---------- */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; align-items: start; }
.w { background: var(--b-card); border: 1px solid var(--b-line); border-radius: var(--b-r-card); padding: var(--b-pad); min-width: 0; overflow: hidden; }
.w .band { display: flex; justify-content: space-between; align-items: center; min-height: 32px; margin-top: calc(-1 * var(--b-pad)); color: var(--b-ink-2); }
.w .band span { color: var(--b-ink-3); font-size: var(--b-t-meta); }
.w .rows { margin: 0 calc(-1 * var(--b-pad)) calc(-1 * var(--b-pad)); padding: 0; background: none; border-radius: 0; }
.w .row, .w .row:nth-child(odd) { background: var(--b-raised); border-radius: 0; border-top: 1px solid var(--b-line); min-height: 34px; padding: 0 var(--b-pad); }
.w .empty { margin: 0; padding-bottom: 4px; }

/* ---------- the side panel ---------- */
aside { border-left: 1px solid var(--b-line); background: var(--b-page); height: 100vh; position: sticky; top: 0;
        overflow-y: auto; padding: 18px 18px 40px; }
aside[hidden] { display: none; }
.p-top { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.p-top h2 { font-size: 15px; font-weight: 600; margin: 0 auto 0 0; }
.p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.p-head .val { font-size: var(--b-t-value); font-weight: 560; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.p-sub { color: var(--b-ink-3); font-size: var(--b-t-meta); margin: 4px 0 0; }
.p-sec { margin-top: 20px; }
.p-sec > .lbl { font-weight: 500; margin-bottom: 6px; display: flex; justify-content: space-between; }
.p-sec > .lbl span { color: var(--b-ink-3); font-weight: 400; font-size: var(--b-t-meta); }
.rows { background: var(--b-card); border-radius: 10px; padding: 4px; }
.row { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--b-r-row); }
.row:nth-child(odd) { background: var(--b-raised); }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.row .cmp { width: 46px; text-align: right; color: var(--b-ink-3); font-size: var(--b-t-meta); font-variant-numeric: tabular-nums; }
.row .t { width: 64px; color: var(--b-ink-3); font-size: var(--b-t-meta); font-variant-numeric: tabular-nums; }
.row.total .nm, .row.total .amt { font-weight: 600; }
.row.dim .nm, .row.dim .amt { color: var(--b-ink-3); text-decoration: line-through; }
.pill { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: var(--b-track); color: var(--b-ink-2); margin-left: 6px; }
.pill.warn { background: #FCEFC7; color: #7A5B00; }
.pill.down { background: var(--b-down-tint); color: var(--b-down); }
.hours { display: flex; align-items: flex-end; gap: 3px; height: 96px; background: var(--b-card); border-radius: 10px; padding: 10px 10px 0; }
.hours div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.hours i { display: block; background: var(--b-data-1); border-radius: 3px 3px 0 0; min-height: 2px; }
.hours i.top { background: var(--b-data); }
.hours-x { display: flex; gap: 3px; padding: 4px 10px 0; color: var(--b-ink-3); font-size: 10.5px; }
.hours-x span { flex: 1; text-align: center; white-space: nowrap; }
.more { border: 0; background: none; color: var(--b-data); cursor: pointer; padding: 8px 10px 2px; font-size: var(--b-t-meta); }

@media (max-width: 1100px) {
  .shell.open { grid-template-columns: minmax(0, 1fr); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: 0 0 0 auto; width: min(var(--panel-w), 100vw); box-shadow: -8px 0 24px rgba(0,0,0,.08); z-index: 5; }
}
/* six stats need ~180px each: a narrow window or an open day panel wraps them into rows of three */
@container (max-width: 1000px) {
  .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat:nth-child(n+4) { border-top: 1px solid var(--b-line); }   /* wrapped tabs: a hairline between the rows, no gap */
  .stat:nth-child(3n+1) { border-left: 0; }
}
@container (max-width: 760px) {
  .trio { grid-template-columns: minmax(0, 1fr); }
}
/* below a laptop the sidebar slides in over the page from a menu button */
@media (max-width: 1024px) {
  body { display: block; }
  .side { position: fixed; top: 0; left: 0; z-index: 10; transform: translateX(-100%); transition: transform .2s ease; }
  body.side-open .side { transform: none; box-shadow: 8px 0 24px rgba(0,0,0,.08); }
  .grip { display: none; }
  body.side-open .scrim { display: block; position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.18); }
  .menu-btn { display: grid; place-items: center; }
}
@media (max-width: 760px) {
  main { padding: 16px; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(odd) { border-left: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--b-line); }
  .stat:nth-child(n+3) { border-top: 1px solid var(--b-line); }
  .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .wk, .cal .dow.wk { display: none; }
  .cell { min-height: 56px; padding: 6px; }
  .cell .v { font-size: 11px; }
  .cell .m, .cell .v .full { display: none; }
  .cell .v .sm { display: inline; }
  .months { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top .sh, .top .qty, .top .nm small { display: none; }
  .top .avg .qty { display: table-cell; }   /* days and hours rank by the average: show it, not the total */
  .top .avg .amt { display: none; }
}
</style>
</head>
<body>
<div class="side" id="side">
  <div class="head"><button class="who" type="button"><span class="mark">EJ</span><b>Main Store</b><svg class="ud" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></button></div>
  <nav>
    <div class="grp">

<script src="/data-store.js"></script>
<script>
(async function () {
  // ---------- money + dates ----------
  const peso = v => (v < 0 ? '−₱' : '₱') + Math.round(Math.abs(v)).toLocaleString('en-PH');
  const short = v => Math.abs(v) >= 1e6 ? (v < 0 ? '−' : '') + '₱' + +(Math.abs(v) / 1e6).toFixed(2) + 'M'
    : Math.abs(v) >= 1e4 ? (v < 0 ? '−' : '') + '₱' + +(Math.abs(v) / 1e3).toFixed(1) + 'k' : peso(v);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1).getTime(); };
  const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const fmt = (t, o) => new Date(t).toLocaleDateString('en-PH', o);
  const hourText = h => (h % 12 || 12) + (h < 12 ? 'a' : 'p');
  const TODAY = dayStart(Date.now());

  // ---------- data: the back office's orders, or a demo when there are none ----------
  const store = window.HWPOS_STORE;
  let orders = [], products = [], settings = {}, folders = [];
  try { [orders, products, settings] = await Promise.all([store.orders.list(), store.products.list(), store.settings.get()]); folders = await store.folders.list(); } catch (_) {}
  const real = Array.isArray(orders) && orders.length > 0;
  if (!real) orders = demoOrders();
  settings = settings || {};
  document.getElementById('source').innerHTML = real
    ? `Reading <b>${orders.length.toLocaleString()}</b> orders from the back office.`
    : 'No orders on this origin, so this is <b>generated demo data</b>. Open it at <b>localhost:8765/sales-calendar-tabs-lab.html</b> to read the back office’s orders.';

  // Same rules as backoffice.js: a void/refund books nothing, a return row cancels its sale.
  const SIGN = { completed: 1, return: -1, refunded: 0, voided: 0, saved: 0 };
  const sign = o => SIGN[o.status || 'completed'] ?? 0;
  const prodBy = new Map((products || []).flatMap(p => [['i:' + p.id, p], ['n:' + p.name, p]]));
  const productFor = i => prodBy.get('i:' + (i.productId || i.id)) || prodBy.get('n:' + i.name);
  const folderName = new Map((folders || []).map(x => [x.id, x.name]));
  const costOf = i => i.cost != null ? +i.cost : (productFor(i)?.cost || 0);
  const itemOf = i => productFor(i)?.name || i.name;
  const catOf = i => folderName.get(productFor(i)?.folder) || i.cat || 'Uncategorized';
  const lineNet = i => i.lineTotal != null ? +i.lineTotal : (+i.price || 0) * (+i.qty || 0);
  const profit = o => (+o.total - (+o.vatAmount || 0)) - (o.items || []).reduce((s, i) => s + costOf(i) * (+i.qty || 0), 0);
  const payLabel = o => (o.paymentKind || o.paymentMethod) === 'credit' ? 'Account' : o.paymentMethodLabel || { cash: 'Cash', gcash: 'GCash', qr: 'QR', credit: 'Account', split: 'Split payment' }[o.paymentKind || o.paymentMethod] || 'Cash';

  const byDay = new Map();
  for (const o of orders) { const k = iso(o.ts); (byDay.get(k) || byDay.set(k, []).get(k)).push(o); }
  const rowsIn = (a, b) => { const out = []; for (let t = a; t < b; t = addDays(t, 1)) out.push(...(byDay.get(iso(t)) || [])); return out; };

  function metrics(list) {
    const m = { rev: 0, gp: 0, n: 0, sales: 0, ret: 0, retN: 0, disc: 0, vat: 0, voids: 0 };
    for (const o of list) {
      const s = sign(o);
      if (!s) { if (o.status === 'voided' || o.status === 'refunded') m.voids++; continue; }
      m.rev += o.total * s; m.gp += profit(o) * s; m.vat += (+o.vatAmount || 0) * s;
      if (s > 0) { m.n++; m.sales += +o.total; m.disc += +o.discount || 0; } else { m.ret += +o.total; m.retN++; }
    }
    return m;
  }
  const trend = (cur, prev, title) => {
    if (!prev) return '';
    const p = (cur - prev) / Math.abs(prev) * 100, r = Math.round(p * 10) / 10;
    return `<span class="chip ${r > 0 ? 'up' : r < 0 ? 'down' : ''}" title="${esc(title)}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</span>`;
  };

  // ---------- view state lives in the URL, like every other filter ----------
  const last = orders.reduce((a, o) => Math.max(a, o.ts), 0) || Date.now();
  const q = new URLSearchParams(location.search);
  const S = {
    view: q.get('view') === 'year' ? 'year' : 'month',
    month: q.get('month') ? fromIso(q.get('month') + '-01') : (d => new Date(d.getFullYear(), d.getMonth(), 1).getTime())(new Date(Math.min(last, Date.now()))),
    top: ['cat', 'day', 'hour'].includes(q.get('top')) ? q.get('top') : 'item',
    chart: ['gp', 'n', 'mg'].includes(q.get('chart')) ? q.get('chart') : 'rev',
    sel: q.get('day') ? { kind: 'day', at: fromIso(q.get('day')) } : q.get('week') ? { kind: 'week', at: fromIso(q.get('week')) } : null,
  };
  function saveUrl() {
    const p = new URLSearchParams();
    if (S.view === 'year') p.set('view', 'year');
    p.set('month', iso(S.month).slice(0, 7));
    if (S.sel) p.set(S.sel.kind, iso(S.sel.at));
    if (S.top !== 'item') p.set('top', S.top);
    if (S.chart !== 'rev') p.set('chart', S.chart);
    history.replaceState(null, '', '?' + p);
  }

  const monthEnd = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); };
  const weekEnd = t => Math.min(addDays(t, 7 - ((new Date(t).getDay() + 6) % 7)), monthEnd(t));   // exclusive, clipped to the month
  const daysIn = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
  // ponytail: a flat share of the monthly target per calendar day. The live target spreads what's
  // left over the days left; that's a "today" promise, and a past day needs a fixed bar to be judged by.
  let monthTarget = +(settings.targets && settings.targets.month) || 0;

  // ---------- 1 · the strip: four tabs pick the measure every calendar cell shows ----------
  const mgOf = x => x.rev ? x.gp / x.rev * 100 : 0;
  const count = v => (+v.toFixed(1)).toLocaleString('en-PH');
  const MEAS = {
    rev: { lbl: 'Revenue', of: m => m.rev, fmt: peso, sm: short, sub: m => `${m.n} receipts` },
    gp:  { lbl: 'Gross profit', of: m => m.gp, fmt: peso, sm: short, sub: m => `${mgOf(m).toFixed(1)}% margin` },
    n:   { lbl: 'Receipts', of: m => m.n, fmt: count, sm: count, sub: m => m.n ? `${peso(m.rev / m.n)} average` : '' },
    mg:  { lbl: 'Margin', of: mgOf, fmt: v => v.toFixed(1) + '%', sm: v => v.toFixed(1) + '%', sub: m => `${short(m.gp)} profit` },
  };
  const M = () => MEAS[S.chart];
  // days = days that had sales, the same average an untargeted calendar greens against
  function strip(cur, prev, prevTitle, best, unit, days, target) {
    const tab = (k, val, side, sub, tip = '') =>
      `<button class="stat" role="tab" data-chart="${k}" aria-selected="${S.chart === k}"${tip ? ` title="${esc(tip)}"` : ''}><div class="lbl">${MEAS[k].lbl}</div><div class="line"><span class="val">${val}</span>${side || ''}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</button>`;
    const perDay = v => days ? v / days : 0;
    let html = tab('rev', short(cur.rev), trend(cur.rev, prev.rev, prevTitle), days ? peso(perDay(cur.rev)) + ' daily avg' : '')
      + tab('gp', short(cur.gp), trend(cur.gp, prev.gp, prevTitle), days ? peso(perDay(cur.gp)) + ' daily avg' : '')
      + tab('n', cur.n.toLocaleString(), trend(cur.n, prev.n, prevTitle),
        days ? count(perDay(cur.n)) + ' daily avg' : '', cur.n ? peso(cur.rev / cur.n) + ' average receipt' : '')
      + tab('mg', cur.rev ? mgOf(cur).toFixed(1) + '%' : '—', trend(mgOf(cur), mgOf(prev), prevTitle), '');
    // Best follows the picked tab; a click opens that day (or month). The slowest is red on the calendar (owner 2026-09-26)
    html += `<button class="stat act" data-act="best"${best ? ` data-${unit}="${unit === 'day' ? iso(best.t) : iso(best.t).slice(0, 7)}" title="Open ${best.label}"` : ''}>`
      + `<div class="lbl">Best ${unit}</div><div class="line"><span class="val${best ? ' up' : ''}">${best ? M().sm(M().of(best.m)) : '—'}</span></div>${best ? `<div class="sub">${best.label}</div>` : ''}</button>`;
    if (target == null) return html;                                   // year view: five stats, as before
    const pct = target ? Math.round(cur.rev / target * 100) : 0;
    return html + `<button class="stat act" data-act="target" title="${target ? `${peso(cur.rev)} of ${peso(target)} · click to change` : 'Set a monthly target'}">`
      + `<div class="lbl">Target</div><div class="line">${target
        ? `<span class="val">${short(cur.rev)}</span><b class="pct">${pct}%</b></div><div class="sub">of ${short(target)}</div>`
        : '<span class="val">—</span><span class="set">Set</span></div>'}</button>`;
  }

  // ---------- 2a · month ----------
  function renderMonth() {
    const a = S.month, b = monthEnd(a), d0 = new Date(a);
    const cutoff = Math.min(b, addDays(TODAY, 1));                    // "so far" for the month you're in
    const prevA = new Date(d0.getFullYear(), d0.getMonth() - 1, 1).getTime();
    const prevB = Math.min(monthEnd(prevA), addDays(prevA, Math.round((cutoff - a) / 864e5)));
    const cur = metrics(rowsIn(a, b)), prev = metrics(rowsIn(prevA, prevB));
    const days = [];
    for (let t = a; t < b; t = addDays(t, 1)) { const rows = byDay.get(iso(t)) || []; if (rows.length) days.push({ t, m: metrics(rows) }); }
    const open = days.filter(d => d.m.n || d.m.retN), done = open.filter(d => d.t < TODAY);   // today isn't over yet
    const { of, fmt: mf, sm, sub } = M(), isRev = S.chart === 'rev';
    const best = done.reduce((x, d) => !x || of(d.m) > of(x.m) ? d : x, null);
    const worst = done.length > 1 ? done.reduce((x, d) => !x || of(d.m) < of(x.m) ? d : x, null) : null;
    const lab = d => d && (d.label = fmt(d.t, { weekday: 'short', month: 'short', day: 'numeric' }));
    lab(best); lab(worst);
    const prevTitle = `vs ${fmt(prevA, { month: 'short', day: 'numeric' })} – ${fmt(prevB - 1, { day: 'numeric' })}`;
    document.getElementById('strip').innerHTML = strip(cur, prev, prevTitle, best, 'day', open.length, monthTarget);
    document.getElementById('strip').style.setProperty('--cols', 6);

    // the bar a day is judged by: revenue keeps the daily target; the others, the month's own per-day average (margin: the month's margin)
    const bar = isRev && monthTarget ? monthTarget / daysIn(a) : S.chart === 'mg' ? mgOf(cur) : (open.length ? of(cur) / open.length : 0);
    const lead = (d0.getDay() + 6) % 7;                                // Monday-first, a hardware shop's week
    let anyLoss = false, anySlow = false;
    const barName = S.chart === 'mg' ? `the month's ${mf(bar)} margin`
      : `the ${mf(bar)}${S.chart === 'n' ? ' receipts' : ''} daily ${isRev && monthTarget ? 'target' : 'average'}`;
    // a missed day stays white; a day over the bar goes green, deeper the further over, up to the month's best day
    const hi = Math.max(0, ...open.map(d => of(d.m)));
    const heat = v => `color-mix(in srgb, var(--b-heat) ${Math.round(12 + 43 * (hi > bar ? (v - bar) / (hi - bar) : 1))}%, white)`;
    let html = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('') + '<div class="dow wk">Week</div>';
    for (let w = addDays(a, -lead); w < b; w = addDays(w, 7)) {
      for (let i = 0; i < 7; i++) {
        const t = addDays(w, i);
        if (t < a || t >= b) { html += '<div class="cell pad"></div>'; continue; }
        const dn = new Date(t).getDate(), rows = byDay.get(iso(t)) || [];
        const sel = S.sel && S.sel.kind === 'day' && S.sel.at === t ? ' sel' : '', today = t === TODAY ? ' today' : '';
        if (t > TODAY) { html += `<div class="cell future${today}"><span class="d">${dn}</span></div>`; continue; }
        if (!rows.length) { html += `<div class="cell shut${today}"><span class="d">${dn}</span><span class="m">No sales</span></div>`; continue; }
        const m = metrics(rows), v = of(m);
        let cls = '', style = '', tip = '';
        if (m.rev < 0) { cls = ' loss'; tip = 'More returns than sales'; anyLoss = true; }
        else if (bar && v >= bar) { cls = ' heat'; style = ` style="--heat:${heat(v)}"`; tip = `${mf(v - bar)} over ${barName}`; }
        else if (bar) tip = `${mf(bar - v)} short of ${barName}`;
        if (worst && worst.t === t && cls !== ' heat') { cls = ' loss'; tip = 'Slowest day of the month' + (tip ? ' · ' + tip : ''); anySlow = true; }
        html += `<button class="cell${cls}${today}${sel}" data-day="${iso(t)}"${style}${tip ? ` title="${tip}"` : ''}><span class="d">${dn}</span>`
          + `<span class="v"><span class="full">${mf(v)}</span><span class="sm">${sm(v)}</span></span><span class="m">${sub(m)}${m.retN ? ` · ${m.retN} ret` : ''}</span></button>`;
      }
      const ws = Math.max(w, a), we = Math.min(addDays(w, 7), b, addDays(TODAY, 1));
      if (ws >= we) { html += '<div class="cell week wk pad"></div>'; continue; }
      const wr = rowsIn(ws, we), wm = metrics(wr), wdays = new Set(wr.map(o => iso(o.ts))).size;
      const sel = S.sel && S.sel.kind === 'week' && S.sel.at === ws ? ' sel' : '';
      html += `<button class="cell week wk${sel}" data-week="${iso(ws)}"><span class="d">${fmt(ws, { month: 'short', day: 'numeric' })} – ${fmt(we - 1, { day: 'numeric' })}</span>`
        + `<span class="v">${mf(of(wm))}</span><span class="m">${wdays} days · ${sub(wm)}</span></button>`;
    }
    html = `<div class="cal">${html}</div><div class="legend"><span><i></i>Below ${barName}</span><span>Above<i class="scale"></i></span>`
      + (anySlow || anyLoss ? `<span><i class="r"></i>${[anySlow && 'Slowest day', anyLoss && 'Lost money'].filter(Boolean).join(' · ')}</span>` : '') + '</div>';
    document.getElementById('grid').innerHTML = html;
    document.getElementById('period').textContent = fmt(a, { month: 'long', year: 'numeric' });
    document.getElementById('next').disabled = b > TODAY;
    TOP = { rows: rowsIn(a, b), prev: rowsIn(prevA, prevB), sub: fmt(a, { month: 'long' }) + (b > TODAY ? ' so far' : '') + ' · ' + prevTitle };
    renderTop(); renderMix();
  }

  // ---------- 2b · year ----------
  function renderYear() {
    const y = new Date(S.month).getFullYear(), a = new Date(y, 0, 1).getTime(), b = new Date(y + 1, 0, 1).getTime();
    const cutoff = Math.min(b, addDays(TODAY, 1)), prevA = new Date(y - 1, 0, 1).getTime();
    const prevB = addDays(prevA, Math.round((cutoff - a) / 864e5));
    const cur = metrics(rowsIn(a, b)), prev = metrics(rowsIn(prevA, prevB));
    const months = Array.from({ length: 12 }, (_, i) => { const t = new Date(y, i, 1).getTime(); return { t, m: metrics(rowsIn(t, monthEnd(t))) }; });
    const open = months.filter(x => x.m.n), done = open.filter(x => monthEnd(x.t) <= TODAY);   // nor is this month
    const { of, fmt: mf, sub } = M(), isRev = S.chart === 'rev';
    const best = done.reduce((x, d) => !x || of(d.m) > of(x.m) ? d : x, null);
    const worst = done.length > 1 ? done.reduce((x, d) => !x || of(d.m) < of(x.m) ? d : x, null) : null;
    [best, worst].forEach(d => d && (d.label = fmt(d.t, { month: 'long' })));
    let days = 0;
    for (let t = a; t < b; t = addDays(t, 1)) if (byDay.has(iso(t))) days++;
    document.getElementById('strip').innerHTML = strip(cur, prev, `vs the same days of ${y - 1}`, best, 'month', days);
    document.getElementById('strip').style.setProperty('--cols', 5);
    const avg = S.chart === 'mg' ? mgOf(cur) : open.length ? of(cur) / open.length : 0;
    const tgt = isRev && monthTarget, goal = tgt || avg;
    const goalName = tgt ? 'Hit the monthly target' : S.chart === 'mg' ? 'Above the year’s margin' : 'Above the monthly average';
    document.getElementById('grid').innerHTML = '<div class="months">' + months.map(({ t, m }) => {
      const name = fmt(t, { month: 'long' });
      if (t > TODAY) return `<div class="cell future"><span class="d">${name}</span></div>`;
      if (!m.n) return `<div class="cell shut"><span class="d">${name}</span><span class="m">No sales</span></div>`;
      const hit = of(m) >= goal, slow = !hit && worst && worst.t === t;
      return `<button class="cell${hit ? ' good' : slow ? ' loss' : ''}" data-month="${iso(t).slice(0, 7)}"${hit ? ` title="${goalName} (${mf(goal)})"` : slow ? ' title="Slowest month of the year"' : ''}><span class="d">${name}</span>`
        + `<span class="v">${mf(of(m))}</span><span class="m">${isRev ? `${m.n.toLocaleString()} receipts · ${mgOf(m).toFixed(1)}% margin` : sub(m)}</span></button>`;
    }).join('') + `</div><div class="legend"><span><i class="g"></i>${goalName} (${mf(goal)})</span>${worst && of(worst.m) < goal ? '<span><i class="r"></i>Slowest month</span>' : ''}<span>Click a month to open its calendar</span></div>`;
    document.getElementById('period').textContent = y;
    document.getElementById('next').disabled = b > TODAY;
    TOP = { rows: rowsIn(a, b), prev: rowsIn(prevA, prevB), sub: y + (b > TODAY ? ' so far' : '') + ` · vs the same days of ${y - 1}` };
    renderTop(); renderMix();
  }

  // ---------- 4 · top 10: items, categories, weekdays or hours, for the same window as the strip ----------
  // Items: the order's total is split across its lines by line share, as bo-sales.js does, so a
  // discount can't make the items add up to more than the receipt. Days and hours take whole orders.
  let TOP = { rows: [], prev: [], sub: '' };
  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const hourSpan = h => { const ap = x => x % 24 < 12 ? 'AM' : 'PM', hh = x => x % 12 || 12;
    return ap(h) === ap(h + 1) ? `${hh(h)} – ${hh(h + 1)} ${ap(h)}` : `${hh(h)} ${ap(h)} – ${hh(h + 1)} ${ap(h + 1)}`; };
  function tops(rows, by) {
    const g = new Map(), open = new Set();
    const bucket = (k, init) => g.get(k) || g.set(k, { name: k, qty: 0, rev: 0, items: new Set(), days: new Set(), ...init }).get(k);
    for (const o of rows) {
      const s = sign(o), its = o.items || [];
      if (!s) continue;
      open.add(iso(o.ts));
      if (by === 'day' || by === 'hour') {
        const d = new Date(o.ts), b = bucket(by === 'day' ? DAYS[(d.getDay() + 6) % 7] : hourSpan(d.getHours()));
        b.rev += o.total * s; b.days.add(iso(o.ts));
        continue;
      }
      if (!its.length) continue;
      const gross = its.reduce((x, i) => x + lineNet(i), 0);
      for (const i of its) {
        const b = bucket((by === 'cat' ? catOf : itemOf)(i), { cat: catOf(i), unit: i.unit || '' });
        b.qty += (+i.qty || 0) * s; b.items.add(itemOf(i));
        b.rev += o.total * s * (gross > 0 ? lineNet(i) / gross : 1 / its.length);
      }
    }
    // a weekday averages over the days it was open; an hour over every open day in the window
    for (const b of g.values()) b.avg = b.rev / ((by === 'day' ? b.days.size : open.size) || 1);
    return g;
  }
  // the dropdown is the table's title, so there's no heading above it
  const TOP_BY = [['item', 'Top items', 'Sold'], ['cat', 'Top categories', 'Range'],
    ['day', 'Busiest days', 'Avg / day'], ['hour', 'Busiest hours', 'Avg / day']];
  function renderTop() {
    const by = S.top, [, , qtyHead] = TOP_BY.find(x => x[0] === by), cur = tops(TOP.rows, by), before = tops(TOP.prev, by);
    // weekdays rank and share by their average: a month can hold five Wednesdays and four Saturdays
    const val = b => by === 'day' ? b.avg : b.rev;
    const total = [...cur.values()].reduce((x, b) => x + val(b), 0);
    const list = [...cur.values()].sort((x, y) => val(y) - val(x)).slice(0, 10), max = list.length ? val(list[0]) : 1;
    const sw = `<select aria-label="Rank by">${TOP_BY.map(([k, l]) => `<option value="${k}"${by === k ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
    const qty = b => by === 'day' || by === 'hour' ? peso(b.avg) : by === 'cat' ? b.items.size + (b.items.size === 1 ? ' item' : ' items')
      : +b.qty.toFixed(2) + (b.unit && !/^pcs?$/.test(b.unit) ? ' ' + b.unit : '');
    const vs = b => {
      const p = before.get(b.name)?.rev;
      if (!p) return '<td class="n cmp">New</td>';
      const r = Math.round((b.rev - p) / Math.abs(p) * 1000) / 10;
      return `<td class="n cmp ${r > 0 ? 'up' : r < 0 ? 'down' : ''}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</td>`;
    };
    document.getElementById('top').innerHTML = list.length ? `<div class="flush"><table${by === 'day' || by === 'hour' ? ' class="avg"' : ''}>
      <tr><th class="sw">${sw}</th><th class="n qty">${qtyHead}</th><th class="n amt">Revenue</th><th class="sh">Share</th><th class="n cmp" title="${esc(TOP.sub)}">Trend</th></tr>
      ${list.map(b => `<tr><td class="nm">${esc(b.name)}${by !== 'item' || b.cat === 'Uncategorized' ? '' : `<small>${esc(b.cat)}</small>`}</td>
        <td class="n qty">${qty(b)}</td><td class="n amt">${peso(b.rev)}</td>
        <td class="sh"><span><i style="width:${Math.max(0, val(b) / max * 100)}%"></i></span>${total ? (val(b) / total * 100).toFixed(1) : 0}%</td>${vs(b)}</tr>`).join('')}
    </table>${by === 'item' || by === 'cat' ? `<a class="all" href="/admin/sales?by=${by === 'cat' ? 'category' : 'item'}">See all ${cur.size} ${by === 'cat' ? 'categories' : 'items'} →</a>` : ''}</div>`
      : '<p class="note empty">No sales in this period yet.</p>';
  }
  const row = (nm, amt, cmp = '', cls = '') => `<div class="row ${cls}"><span class="nm">${nm}</span><span class="amt">${amt}</span>${cmp !== null ? `<span class="cmp">${cmp}</span>` : ''}</div>`;

  // ---------- 5 · payment methods + breakdown, staff beside: the panel's lists, for the whole period ----------
  function renderMix() {
    const rows = TOP.rows, m = metrics(rows);
    const card = (id, title, body, side = '') => { document.getElementById(id).innerHTML = `<div class="band">${title}<span>${side}</span></div>${body}`; };
    if (!rows.some(sign)) {
      const none = '<p class="note empty">No sales in this period yet.</p>';
      card('pay', 'Payment methods', none); card('bd', 'Breakdown', none); card('staff', 'Staff', none);
      return;
    }
    const group = key => { const g = new Map(); for (const o of rows) { const s = sign(o); if (s) g.set(key(o), (g.get(key(o)) || 0) + o.total * s); } return [...g].sort((x, y) => y[1] - x[1]); };
    const pct = v => m.rev ? (v / m.rev * 100).toFixed(1) + '%' : '';
    card('pay', 'Payment methods', `<div class="rows">${group(payLabel).map(([k, v]) => row(esc(k) + (k === 'Account' ? '<span class="pill warn">Unpaid</span>' : ''), peso(v), pct(v))).join('')}
      ${row('Total', peso(m.rev), '', 'total')}</div>`);
    card('bd', 'Breakdown', `<div class="rows">
      ${row('Gross sales', peso(m.sales + m.disc), null)}
      ${row('Discounts', m.disc ? peso(-m.disc) : '₱0', null)}
      ${row(`Returns${m.retN ? ` (${m.retN})` : ''}`, m.ret ? peso(-m.ret) : '₱0', null)}
      ${row('VAT included', peso(m.vat), null)}
      ${row('Net sales', peso(m.rev), null, 'total')}</div>`, m.voids ? `${m.voids} voided, no revenue` : '');
    card('staff', 'Staff', `<div class="rows">${group(o => o.cashier || '—').map(([k, v]) => row(esc(k), peso(v), pct(v))).join('')}</div>`);
  }

  // the Target stat opens a small editor; saving goes through the store, like the back office's Set target
  const tdlg = document.getElementById('tdlg');
  document.getElementById('strip').onclick = e => {
    const tab = e.target.closest('[data-chart]'), best = e.target.closest('[data-act="best"]');
    if (tab) { S.chart = tab.dataset.chart; return render(); }
    if (best && best.dataset.day) { S.sel = { kind: 'day', at: fromIso(best.dataset.day) }; return render(); }
    if (best && best.dataset.month) { S.view = 'month'; S.month = fromIso(best.dataset.month + '-01'); S.sel = null; return render(); }
    if (!e.target.closest('[data-act="target"]')) return;
    tdlg.querySelector('input').value = monthTarget || '';
    tdlg.returnValue = '';
    tdlg.showModal();
  };
  tdlg.addEventListener('close', async () => {
    if (tdlg.returnValue !== 'save') return;
    const v = Math.max(0, Math.round(+tdlg.querySelector('input').value || 0));
    try { settings = await store.settings.set({ targets: { ...(settings.targets || {}), month: v } }); } catch (_) {}
    monthTarget = v;
    render();
  });

  document.getElementById('top').onchange = e => { if (e.target.matches('select')) { S.top = e.target.value; renderTop(); saveUrl(); } };

  // ---------- the side panel: everything the old page charted, for one day or one week ----------
  function renderPanel() {
    const el = document.getElementById('panel'), shell = document.getElementById('shell');
    if (!S.sel) { el.hidden = true; shell.classList.remove('open'); return; }
    const { kind, at } = S.sel, isDay = kind === 'day';
    const end = isDay ? addDays(at, 1) : weekEnd(at);
    const rows = rowsIn(at, end).sort((x, y) => y.ts - x.ts), m = metrics(rows);
    const span = Math.round((end - at) / 864e5), prevRows = rowsIn(addDays(at, -7), addDays(at, -7 + span)), pm = metrics(prevRows);
    const title = isDay ? fmt(at, { weekday: 'long', month: 'long', day: 'numeric' })
      : `${fmt(at, { month: 'short', day: 'numeric' })} – ${fmt(end - 1, { month: 'short', day: 'numeric' })}`;
    const share = v => m.rev ? (v / m.rev * 100).toFixed(1) + '%' : '';
    const sec = (lbl, body, side = '') => `<div class="p-sec"><div class="lbl">${lbl}<span>${side}</span></div>${body}</div>`;

    let html = `<div class="p-top"><h2>${title}</h2>
      <button class="icon-btn" data-step="-1" aria-label="Previous ${kind}">‹</button>
      <button class="icon-btn" data-step="1" aria-label="Next ${kind}" ${end > TODAY ? 'disabled' : ''}>›</button>
      <button class="icon-btn" data-close aria-label="Close">✕</button></div>`;
    html += `<div class="p-head"><span class="val">${peso(m.rev)}</span>${trend(m.rev, pm.rev, isDay ? 'vs the same day last week' : 'vs the week before')}</div>`
      + `<p class="p-sub">${m.n} receipts · ${peso(m.gp)} gross profit · ${m.n ? peso(m.rev / m.n) : '₱0'} average</p>`;

    if (!rows.length) { el.innerHTML = html + '<p class="p-sub" style="margin-top:20px">No sales.</p>'; }
    else {
      // hours: the ones that sold, one either side
      const hr = Array(24).fill(0);
      for (const o of rows) if (sign(o)) hr[new Date(o.ts).getHours()] += o.total * sign(o);
      const sold = hr.map((v, i) => v ? i : -1).filter(i => i >= 0);
      const h0 = sold.length ? Math.max(0, sold[0] - 1) : 7, h1 = sold.length ? Math.min(23, sold[sold.length - 1] + 1) : 18;
      const top = Math.max(...hr.slice(h0, h1 + 1), 1), peak = hr.indexOf(Math.max(...hr));
      let bars = '', xs = '';
      for (let i = h0; i <= h1; i++) {
        bars += `<div title="${hourText(i)} · ${peso(hr[i])}"><i class="${i === peak ? 'top' : ''}" style="height:${Math.max(0, hr[i]) / top * 100}%"></i></div>`;
        xs += `<span>${(i - h0) % 3 ? '' : hourText(i)}</span>`;
      }
      html += sec('By hour', `<div class="hours">${bars}</div><div class="hours-x">${xs}</div>`, `busiest ${hourText(peak)}`);

      html += sec('Breakdown', `<div class="rows">
        ${row('Gross sales', peso(m.sales + m.disc), null)}
        ${row('Discounts', m.disc ? peso(-m.disc) : '₱0', null)}
        ${row(`Returns${m.retN ? ` (${m.retN})` : ''}`, m.ret ? peso(-m.ret) : '₱0', null)}
        ${row('VAT included', peso(m.vat), null)}
        ${row('Net sales', peso(m.rev), null, 'total')}</div>`, m.voids ? `${m.voids} voided, no revenue` : '');

      const group = (key, val) => { const g = new Map(); for (const o of rows) { const s = sign(o); if (s) for (const [k, v] of key(o, s)) g.set(k, (g.get(k) || 0) + v); } return [...g].sort((x, y) => y[1] - x[1]); };
      const pays = group((o, s) => [[payLabel(o), o.total * s]]);
      html += sec('Payment methods', `<div class="rows">${pays.map(([k, v]) => row(esc(k) + (k === 'Account' ? '<span class="pill warn">Not collected</span>' : ''), peso(v), share(v))).join('')}</div>`);
      const its = group((o, s) => (o.items || []).map(i => [i.name, lineNet(i) * s]));
      html += sec('Top items', `<div class="rows">${its.slice(0, 5).map(([k, v]) => row(esc(k), peso(v), share(v))).join('')}</div>`, `${its.length} items sold`);
      const staff = group((o, s) => [[o.cashier || '—', o.total * s]]);
      html += sec('Staff', `<div class="rows">${staff.map(([k, v]) => row(esc(k), peso(v), share(v))).join('')}</div>`);

      // voids and refunds stay in the list, struck through, never filtered out
      const rc = o => {
        const s = sign(o), st = o.status || 'completed';
        const pill = st === 'completed' ? '' : `<span class="pill ${st === 'return' ? 'down' : ''}">${st[0].toUpperCase() + st.slice(1)}</span>`;
        const when = isDay ? new Date(o.ts).toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }) : fmt(o.ts, { month: 'short', day: 'numeric' });
        return `<div class="row ${s ? '' : 'dim'}"><span class="t">${when}</span><span class="nm">${esc(o.number || o.id || '')} · ${esc(payLabel(o))}${pill}</span><span class="amt">${peso(s < 0 ? -o.total : +o.total)}</span></div>`;
      };
      const list = rows.filter(o => o.status !== 'saved');
      html += sec('Receipts', `<div class="rows" id="rc">${list.slice(0, 12).map(rc).join('')}</div>${list.length > 12 ? `<button class="more" data-more>Show all ${list.length}</button>` : ''}`, `${list.length} total`);
      el.innerHTML = html;
      const more = el.querySelector('[data-more]');
      if (more) more.onclick = () => { el.querySelector('#rc').innerHTML = list.map(rc).join(''); more.remove(); };
    }
    el.hidden = false; shell.classList.add('open');
  }

  // ---------- wiring ----------
  function render() {
    document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
    if (S.view === 'year') { S.sel = null; renderYear(); } else renderMonth();
    renderPanel(); saveUrl();
  }
  document.getElementById('seg').onclick = e => { const b = e.target.closest('[data-view]'); if (b) { S.view = b.dataset.view; render(); } };
  const shift = n => { const d = new Date(S.month); S.month = S.view === 'year' ? new Date(d.getFullYear() + n, d.getMonth(), 1).getTime() : new Date(d.getFullYear(), d.getMonth() + n, 1).getTime(); S.sel = null; render(); };
  document.getElementById('prev').onclick = () => shift(-1);
  document.getElementById('next').onclick = () => shift(1);
  document.getElementById('grid').onclick = e => {
    const c = e.target.closest('button.cell'); if (!c) return;
    if (c.dataset.month) { S.view = 'month'; S.month = fromIso(c.dataset.month + '-01'); S.sel = null; }
    else { const kind = c.dataset.day ? 'day' : 'week', at = fromIso(c.dataset[kind]);
      S.sel = S.sel && S.sel.kind === kind && S.sel.at === at ? null : { kind, at }; }   // click again to close
    render();
  };
  document.getElementById('panel').onclick = e => {
    if (e.target.closest('[data-close]')) { S.sel = null; return render(); }
    const st = e.target.closest('[data-step]'); if (!st) return;
    const n = +st.dataset.step, { kind, at } = S.sel;
    // a week cell is its Monday, or the 1st when the week straddles a month: step to the cell holding the next/previous day
    const day = kind === 'day' ? addDays(at, n) : n > 0 ? weekEnd(at) : addDays(at, -1), d = new Date(day);
    const first = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    S.sel = { kind, at: kind === 'day' ? day : Math.max(first, addDays(day, -((d.getDay() + 6) % 7))) };
    S.month = first;
    render();
  };
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.body.classList.contains('side-open')) document.body.classList.remove('side-open');
    else if (S.sel) { S.sel = null; render(); }
  });
  // ---------- sidebar: slide-in under a laptop, drag the edge to resize (sales-calendar-sidebar-lab.html's) ----------
  document.getElementById('menu').onclick = () => document.body.classList.add('side-open');
  document.getElementById('scrim').onclick = () => document.body.classList.remove('side-open');
  const root = document.documentElement.style, clampW = w => Math.min(300, Math.max(180, Math.round(w)));
  const savedW = +store.ui.get('labSideW', 0);
  if (savedW) root.setProperty('--side-w', clampW(savedW) + 'px');
  const grip = document.getElementById('grip');
  grip.onpointerdown = e => {
    const x0 = e.clientX, w0 = document.getElementById('side').getBoundingClientRect().width;
    grip.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    grip.onpointermove = m => root.setProperty('--side-w', clampW(w0 + m.clientX - x0) + 'px');
    grip.onpointerup = () => {
      grip.onpointermove = grip.onpointerup = null;
      document.body.classList.remove('resizing');
      store.ui.set('labSideW', parseInt(getComputedStyle(document.documentElement).getPropertyValue('--side-w')));
    };
  };
  grip.ondblclick = () => { root.removeProperty('--side-w'); store.ui.set('labSideW', 0); };
  render();

  // ---------- demo orders, only when this origin has none ----------
  function demoOrders() {
    const ITEMS = [['Portland Cement 40kg', 265, 238, 'Cement'], ['Holcim Excel Cement 40kg', 275, 246, 'Cement'], ['Deformed Bar 12mm × 6m', 310, 262, 'Steel'], ['Deformed Bar 10mm × 6m', 215, 181, 'Steel'],
      ['Hollow Block 6"', 24, 18, 'Masonry'], ['Hollow Block 4"', 18, 13, 'Masonry'], ['GI Sheet Gauge 26', 420, 355, 'Roofing'], ['Common Nails 3" (kg)', 95, 72, 'Fasteners'],
      ['PVC Pipe 1/2"', 118, 88, 'Plumbing'], ['Boysen Latex White 4L', 690, 560, 'Paint'], ['THHN Wire #12 (m)', 38, 29, 'Electrical'], ['Plywood 1/4"', 520, 440, 'Lumber'],
      ['Gravel 3/4" (cu.m)', 1450, 1180, 'Aggregates'], ['Sand (cu.m)', 1100, 890, 'Aggregates'], ['Tie Wire #16 (kg)', 88, 66, 'Fasteners']];
    const STAFF = ['Aldrin S.', 'Liza M.', 'Joy P.', 'Maricel R.'], PAY = ['cash', 'cash', 'cash', 'cash', 'gcash', 'gcash', 'credit', 'qr'];
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const out = []; let n = 1;
    for (let t = addDays(TODAY, -200); t <= TODAY; t = addDays(t, 1)) {
      const dow = new Date(t).getDay(); if (dow === 0 && rnd() < .6) continue;
      const count = Math.round((dow === 2 ? 34 : dow === 6 ? 30 : 24) * (.7 + rnd() * .6)) * (t === TODAY ? .5 : 1);
      for (let k = 0; k < count; k++) {
        const hour = 7 + Math.floor(Math.pow(rnd(), 1.4) * 11), ts = t + hour * 36e5 + Math.floor(rnd() * 36e5);
        if (ts > Date.now()) continue;
        const items = Array.from({ length: 1 + Math.floor(rnd() * 3) }, () => { const [name, price, cost, cat] = ITEMS[Math.floor(rnd() * ITEMS.length)]; const qty = 1 + Math.floor(rnd() * 6); return { name, price, cost, cat, qty, lineTotal: price * qty }; });
        const total = items.reduce((s, i) => s + i.lineTotal, 0), r = rnd();
        const kind = PAY[Math.floor(rnd() * PAY.length)];
        out.push({ id: 'D' + n, number: 'R-' + String(n++).padStart(5, '0'), ts, total, vatAmount: Math.round(total / 1.12 * .12 * 100) / 100, items, cashier: STAFF[Math.floor(rnd() * STAFF.length)],
          paymentKind: kind, status: r < .012 ? 'voided' : 'completed' });
        if (r > .994) out.push({ id: 'D' + n, number: 'R-' + String(n++).padStart(5, '0'), ts: ts + 36e5, total, vatAmount: 0, items, cashier: STAFF[0], paymentKind: 'cash', status: 'return' });
      }
    }
    return out;
  }
})();
</script>
