<!doctype html>
<html lang="en" class="side-half">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Chat history lab</title>
<link rel="icon" href="data:," />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<!-- Three ways to show chat history (owner 2026-11-10). A drawing only: reads the app's stylesheet so it looks the same, changes nothing in pos-lab. -->
<link rel="stylesheet" href="pos-lab/styles.css" />
<style>
  .tabs { position: fixed; inset: 0 0 auto; height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: var(--canvas); z-index: 200; }
  .tabs button { flex: 1; height: 34px; border: 0; border-radius: 999px; background: none; color: var(--ink-secondary); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--surface); }
  .stage { position: fixed; inset: 48px 0 0; overflow: hidden; transform: translateZ(0); }
  .stage #app { height: 100%; }

  .m-c { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; color: var(--ink); cursor: pointer;
         background: color-mix(in srgb, var(--bg) 70%, transparent); box-shadow: 0 1px 6px rgb(0 0 0 / .043), inset 0 0 0 .7px rgb(255 255 255 / .55); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); }
  .m-c svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .m-c[hidden] { display: none; }
  .bar input:focus-visible, .m2-in:focus-visible { outline: 0 !important; box-shadow: none !important; }
  #app .side-link:hover:not(.active) { background: none; }

  /* Sell behind the menu */
  .peek { display: grid; gap: 8px; }
  .peek div { display: flex; align-items: flex-end; height: 112px; padding: 12px; border-radius: var(--es-r); background: var(--surface); font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; }

  /* the Chat page */
  .chat-head-find { margin-left: auto; position: relative; z-index: 1; }
  .rows { display: flex; flex-direction: column; }
  .rows button { display: block; width: 100%; height: 46px; padding: 0 8px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 16px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .none { padding: 24px 8px; color: var(--ink-tertiary); font-size: 15px; text-align: center; }
  .talk { display: flex; flex-direction: column; gap: 18px; padding: 8px 4px; font-size: 16px; line-height: 1.4; }
  .talk .me { align-self: flex-end; max-width: 78%; padding: 9px 14px; border-radius: 19px; background: var(--surface); }
  .talk .it { max-width: 90%; color: var(--ink-secondary); }
  .view-chat .c-scroll { padding-bottom: calc(var(--pill-b) + 72px) !important; }
  .bar { position: absolute; z-index: 3; left: 16px; right: 16px; bottom: var(--pill-b); display: flex; align-items: center; height: 48px; padding: 0 6px 0 18px; border-radius: 999px;
         background: color-mix(in srgb, var(--bg) 70%, transparent); box-shadow: 0 1px 6px rgb(0 0 0 / .06), inset 0 0 0 .7px rgb(255 255 255 / .55); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); }
  .bar input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 16px; }
  .bar input::placeholder { color: var(--ink-tertiary); }
  .bar button { flex: none; display: none; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; }
  .bar button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bar:not(.finding):has(input:not(:placeholder-shown)) #send { display: grid; }
  .bar.finding #stopFind { display: grid; background: none; color: var(--ink); }

  /* 2: the menu turns into the list */
  .sidebar > :is(.side-top, .side-nav) { transition: transform .36s cubic-bezier(.32, .72, 0, 1), opacity .24s; }
  .sidebar.m2-on > :is(.side-top, .side-nav) { transform: translateX(-28%); opacity: 0; pointer-events: none; }
  .m2 { position: absolute; inset: 0 0 calc(var(--ph-b, 10px) + 50px); display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform .36s cubic-bezier(.32, .72, 0, 1), visibility .36s; }
  .sidebar.m2-on .m2 { transform: none; visibility: visible; }
  .m2-top { flex: none; display: flex; align-items: flex-start; gap: 8px; height: 68px; padding: var(--head-y) 16px 0 16px; }
  .m2-ttl { flex: 1; line-height: 44px; text-align: center; font-size: 16px; font-weight: 500; color: var(--ink); }
  .m2-in { flex: 1; min-width: 0; display: none; height: 44px; padding: 0 16px; border: 0; outline: 0; border-radius: 999px; background: var(--side-pill); color: var(--ink); font: inherit; font-size: 16px; }
  .m2-top.finding .m2-ttl { display: none; }
  .m2-top.finding .m2-in { display: block; }
  .m2-list { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .m-row span { overflow: hidden; text-overflow: ellipsis; padding-right: 16px; }
  .m2-list .m-new { flex: none; margin-bottom: 8px; }

  /* 3: Chat opens up in the menu */
  .m3 { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.32, .72, 0, 1); }
  .m3 > div { min-height: 0; overflow: hidden; }
  .m3.open { grid-template-rows: 1fr; }
  #app .m3 .side-link { padding-left: 54.3px; }
  #app .m3 .side-link.all { color: var(--ink-tertiary); }
  .chev { display: none; transition: transform .24s; }
  body.o3 .chev { display: block; }
  .chev.open { transform: rotate(180deg); }
</style>
</head>
<body class="hairlines light-theme">
<div class="tabs"><button data-o="1">1</button><button data-o="2">2</button><button data-o="3">3</button></div>
<div class="stage">
<div id="app">
  <aside class="sidebar">
    <div class="side-top"><span class="side-ttl">COMFA</span><button type="button" class="m-c" aria-label="All items"><svg viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg></button></div>
    <nav class="side-nav"><div class="side-grp">
      <button class="side-link active" data-view="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M4 10.3a2 2 0 0 1 .8-1.6l6-4.5a2 2 0 0 1 2.4 0l6 4.5a2 2 0 0 1 .8 1.6V19a2 2 0 0 1-2 2h-3.5v-4.5a2.5 2.5 0 0 0-5 0V21H6a2 2 0 0 1-2-2z"/></svg><span>Sell</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect class="f" x="4.5" y="3" width="15" height="18" rx="4"/><path class="d" d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg><span>Orders</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect class="f" x="3" y="6" width="18" height="5" rx="2"/><path d="M7 11v8M17 11v8"/></svg><span>Tables</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M3.5 5.5a2 2 0 0 1 2-2h5.7a2 2 0 0 1 1.4.6l7.6 7.6a2.5 2.5 0 0 1 0 3.5l-5.3 5.3a2.5 2.5 0 0 1-3.5 0l-7.6-7.6a2 2 0 0 1-.3-1.4z"/><circle class="d" cx="8" cy="8" r="1.5"/></svg><span>Items</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle class="f" cx="12" cy="8" r="4"/><path class="f" d="M4.5 19c0-3.2 3.4-5.5 7.5-5.5s7.5 2.3 7.5 5.5a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19z"/></svg><span>Customers</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle class="f" cx="12" cy="12" r="8.5"/><path class="d" d="M12 7.5V12l3 2"/></svg><span>Shift</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect class="f" x="3.5" y="3.5" width="17" height="17" rx="5"/><path class="d" d="M8.5 16v-3M12 16V8M15.5 16v-5"/></svg><span>Reports</span></button>
      <button class="side-link" data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path class="f" d="M12 3.5c-4.9 0-8.5 3.4-8.5 7.7 0 2.2 1 4.2 2.6 5.6l-.6 3.1a.6.6 0 0 0 .9.6l3.3-1.8c.7.1 1.5.2 2.3.2 4.9 0 8.5-3.4 8.5-7.7S16.9 3.5 12 3.5z"/><path class="d" d="M8.5 9.8h7M8.5 13h4"/></svg><span>Chat</span><svg class="ext chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg></button>
      <div class="m3"><div id="m3Rows"></div></div>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="2.5"/><circle class="dot" cx="15" cy="15" r="1.4"/><circle class="dot" cx="19" cy="19" r="1.4"/><circle class="dot" cx="19" cy="15" r="1.4"/><circle class="dot" cx="15" cy="19" r="1.4"/></svg><span>QR codes</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect class="f" x="4" y="7" width="16" height="10" rx="2"/><circle class="d" cx="12" cy="12" r="2"/></svg><span>Cash in &amp; out</span></button>
      <button class="side-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect class="f" x="3.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="3.5" width="7" height="7" rx="2.5"/><rect class="f" x="3.5" y="13.5" width="7" height="7" rx="2.5"/><rect class="f" x="13.5" y="13.5" width="7" height="7" rx="2.5"/></svg><span>Back office</span><svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg></button>
    </div></nav>
    <div class="m2">
      <div class="m2-top" id="m2Top">
        <button type="button" class="m-c" id="m2Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
        <span class="m2-ttl">Chat</span>
        <input class="m2-in" id="m2In" placeholder="Search" autocomplete="off" />
        <button type="button" class="m-c" id="m2Find" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5l-4-4"/></svg></button>
      </div>
      <div class="m2-list" id="m2Rows"></div>
    </div>
    <div class="side-footer">
      <div class="user-row"><span class="user-avatar">E</span><span class="user-meta"><span class="user-name">El John</span><span class="user-store">· POS 1</span></span></div>
    </div>
    <button type="button" class="m-c" style="position:absolute;right:18px;bottom:var(--ph-b,10px)" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M10.3 3.4a1.8 1.8 0 0 1 3.4 0l.3.8a1.8 1.8 0 0 0 2.4 1l.8-.4a1.8 1.8 0 0 1 2.4 2.4l-.4.8a1.8 1.8 0 0 0 1 2.4l.8.3a1.8 1.8 0 0 1 0 3.4l-.8.3a1.8 1.8 0 0 0-1 2.4l.4.8a1.8 1.8 0 0 1-2.4 2.4l-.8-.4a1.8 1.8 0 0 0-2.4 1l-.3.8a1.8 1.8 0 0 1-3.4 0l-.3-.8a1.8 1.8 0 0 0-2.4-1l-.8.4a1.8 1.8 0 0 1-2.4-2.4l.4-.8a1.8 1.8 0 0 0-1-2.4l-.8-.3a1.8 1.8 0 0 1 0-3.4l.8-.3a1.8 1.8 0 0 0 1-2.4l-.4-.8a1.8 1.8 0 0 1 2.4-2.4l.8.4a1.8 1.8 0 0 0 2.4-1z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </aside>

  <div class="main">
    <section class="view lv active" data-view="sell"><div class="iv"><section class="page">
      <div class="head"><button class="sq cta-2 menu" data-act="open-sidebar" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button></div>
      <div class="c-scroll peek"><div>PVC Elbow</div><div>THHN Wire</div><div>Boysen Paint</div><div>Matcha Latte</div><div>Winterm Heater</div><div>Common Nails</div></div>
    </section></div></section>

    <section class="view view-chat lv frost" data-view="chat"><div class="iv"><section class="page" id="chatPage" style="--head-h:52px">
      <div class="head">
        <button class="sq cta-2 menu" id="hMenu" data-act="open-sidebar" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
        <button class="sq back" id="hBack" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
        <h1 class="st-ttl" id="hTtl">Chat</h1>
        <button type="button" class="m-c chat-head-find" id="hFind" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5l-4-4"/></svg></button>
      </div>
      <div class="c-scroll" id="chatBody"></div>
      <form class="bar" id="bar" autocomplete="off">
        <input id="barIn" placeholder="Message" />
        <button type="submit" class="cta" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button type="button" id="stopFind" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </form>
    </section></div></section>
  </div>
</div>
</div>

<script>
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
  const app = $('#app'), side = $('.sidebar'), body = $('#chatBody'), bar = $('#bar'), input = $('#barIn');
  const START = ['Matcha running low', 'Best sellers this week', 'Supplier for Boysen paint', 'Why was Tuesday slow', 'Cash short on Shift 2', 'Promo for rainy season', 'Return policy wording', 'Who can give discounts', 'Receipt question for BIR', 'Holiday opening hours', 'How to add a variant', 'New price for common nails'];
  let opt = 1, chats = [...START], mode = 'list', from = false;

  const menu = (open) => app.classList.toggle('sidebar-collapsed', !open);
  const go = (view) => {
    $$('.view').forEach((v) => v.classList.toggle('active', v.dataset.view === view));
    $$('.side-link').forEach((l) => l.classList.toggle('active', l.dataset.view === view));
  };
  const btn = (text, cls, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; if (cls) b.className = cls;
    const s = document.createElement('span'); s.textContent = text; b.append(s);
    b.addEventListener('click', fn);
    return b;
  };

  function stopFinding() { bar.classList.remove('finding'); input.placeholder = 'Message'; input.value = ''; }
  function page(next, title) {
    mode = next; stopFinding(); go('chat'); menu(false); body.scrollTop = 0;
    $('#hTtl').textContent = next === 'talk' ? title : 'Chat';
    $('#hFind').hidden = next !== 'list';
    $('#hBack').hidden = !(next === 'talk' && from);
    $('#hMenu').hidden = !$('#hBack').hidden;
    if (next === 'list') return listRows('');
    body.replaceChildren();
    if (next !== 'talk') return;
    const t = document.createElement('div'); t.className = 'talk';
    const me = document.createElement('div'); me.className = 'me'; me.textContent = title;
    const it = document.createElement('div'); it.className = 'it'; it.textContent = 'The reply would show here.';
    t.append(me, it); body.append(t);
  }
  function listRows(q) {
    const found = chats.filter((c) => c.toLowerCase().includes(q));
    const wrap = document.createElement('div'); wrap.className = 'rows';
    found.forEach((c) => wrap.append(btn(c, '', () => { from = true; page('talk', c); })));
    if (!found.length) { wrap.className = 'none'; wrap.textContent = 'No chats found'; }
    body.replaceChildren(wrap);
  }
  function menuRows(q) {
    const list = $('#m2Rows');
    const rows = chats.filter((c) => c.toLowerCase().includes(q)).map((c) => btn(c, 'side-link m-row', () => { from = false; page('talk', c); }));
    if (!q) {
      const n = btn('New chat', 'side-link m-row m-new', () => { from = false; page('new'); });
      n.insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>');
      rows.unshift(n);
    }
    list.replaceChildren(...rows);
  }
  function foldRows() {
    const rows = chats.slice(0, 3).map((c) => btn(c, 'side-link m-row', () => { from = false; page('talk', c); }));
    rows.push(btn('See all', 'side-link m-row all', () => page('list')));
    $('#m3Rows').replaceChildren(...rows);
  }
  function stopMenuFind() { $('#m2Top').classList.remove('finding'); $('#m2In').value = ''; menuRows(''); }

  function setOpt(n) {
    opt = n; document.body.className = 'hairlines light-theme o' + n;
    $$('.tabs button').forEach((b) => b.classList.toggle('on', +b.dataset.o === n));
    chats = [...START]; from = false;
    side.classList.remove('m2-on'); $('.m3').classList.remove('open'); $('.chev').classList.remove('open');
    stopFinding(); stopMenuFind(); foldRows(); go('sell'); menu(true);
  }

  $$('.tabs button').forEach((b) => b.addEventListener('click', () => setOpt(+b.dataset.o)));
  $$('.menu').forEach((b) => b.addEventListener('click', () => menu(true)));
  $('.main').addEventListener('click', (e) => { if (!app.classList.contains('sidebar-collapsed')) { e.stopPropagation(); menu(false); } }, true);
  $('.side-link[data-view="sell"]').addEventListener('click', () => { go('sell'); menu(false); });
  $('.side-link[data-view="chat"]').addEventListener('click', () => {
    if (opt === 1) { from = false; page('list'); }
    if (opt === 2) side.classList.add('m2-on');
    if (opt === 3) { $('.m3').classList.toggle('open'); $('.chev').classList.toggle('open'); }
  });
  $('#hBack').addEventListener('click', () => { from = false; page('list'); });
  $('#hFind').addEventListener('click', () => { bar.classList.add('finding'); input.placeholder = 'Search'; input.value = ''; input.focus(); });
  $('#stopFind').addEventListener('click', () => { stopFinding(); listRows(''); });
  input.addEventListener('input', () => { if (bar.classList.contains('finding')) listRows(input.value.trim().toLowerCase()); });
  bar.addEventListener('submit', (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t || bar.classList.contains('finding')) return;
    if (mode !== 'talk') { chats.unshift(t); menuRows(''); foldRows(); }
    from = opt === 1 || mode === 'list'; page('talk', t);
  });
  $('#m2Back').addEventListener('click', () => { side.classList.remove('m2-on'); stopMenuFind(); });
  $('#m2Find').addEventListener('click', () => {
    if ($('#m2Top').classList.contains('finding')) return stopMenuFind();
    $('#m2Top').classList.add('finding'); menuRows(''); $('#m2In').focus();
  });
  $('#m2In').addEventListener('input', (e) => menuRows(e.target.value.trim().toLowerCase()));
  body.addEventListener('scroll', () => $('#chatPage').classList.toggle('scrolled', body.scrollTop > 2));

  setOpt(1);
</script>
</body>
</html>
