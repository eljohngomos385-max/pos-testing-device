<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders compare</title>
<link rel="icon" href="data:,">
<style>
/* ponytail: one page that swaps the order-page labs in a frame; each lab keeps its own Dark/Light pill */
:root { --page: #121212; --soft: #232323; --ink: #FFFFFF; --ink-3: rgba(255,255,255,.45); --r: 10px; }
html, body { height: 100%; margin: 0; background: var(--page); }
iframe { display: block; width: 100%; height: 100%; border: 0; }
.pick { position: fixed; left: 50%; bottom: 14px; z-index: 10; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 12px;
        background: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.06); font: 500 12.5px/1 Inter, system-ui, sans-serif; }
.pick button { height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: #6B6B6B; font: inherit; cursor: pointer; }
.pick button[aria-pressed="true"] { background: #1F1F1F; color: #fff; }
</style>
</head>
<body>
<iframe id="f" title="Orders page"></iframe>
<div class="pick" id="pick">
  <button data-f="order-page-lab.html">First</button>
  <button data-f="order-page-lab-a.html">A · Tight</button>
  <button data-f="order-page-lab-b.html">B · Side by side</button>
  <button data-f="order-page-lab-c.html">C · Table</button>
  <button data-f="order-page-apple.html">Apple</button>
</div>
<script>
const btns = [...document.querySelectorAll('#pick button')];
function show(file) {
  document.getElementById('f').src = file;
  btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.f === file));
  location.hash = file.replace(/^order-page-(lab-?)?|\.html$/g, '') || 'lab';
}
btns.forEach(b => b.onclick = () => show(b.dataset.f));
const h = location.hash.slice(1);
show(btns.find(b => b.dataset.f === `order-page-lab-${h}.html` || b.dataset.f === `order-page-${h}.html`)?.dataset.f || 'order-page-apple.html');
</script>
</body>
</html>
