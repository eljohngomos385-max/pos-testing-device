  <style>
    /* Copy only (owner 2026-11-16): the store's name alone sits at the top in the glyph's place (no mark), the
       account is bottom-left with its name, Settings is a gear bottom-right. Folded, the top is only the sidebar button. */
    body.bo-light .bo-sidebar .side-loc { flex: 1; min-width: 0; margin: 0 0 0 -5px; }
    body.bo-light .bo-sidebar .side-loc .side-switch-wrap { min-width: 0; }
    /* the store name from Settings › Store › Store name (#locBiz), not the location cut from the address (#locName) */
    body.bo-light .bo-sidebar .side-loc .ss-text .ss-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; line-height: 20px; font-weight: 400; color: var(--po-sidebar-ink); }
    body.bo-light .bo-sidebar .side-loc .ss-text .ss-name { display: none; }
    body.bo-light .bo-sidebar .side-loc .side-switch { width: auto; max-width: 100%; }
    body.bo-light .bo-sidebar .side-store .acct { width: auto; padding: 0 10px 0 7px; }
    body.bo-light .bo-sidebar .side-store .acct .ss-text { display: flex; }
    body.bo-light .bo-sidebar .side-store .ss-mark { width: 22px; height: 22px; font-size: 9px; } /* 28px stood out beside the 20px icons */
    body.bo-light .bo-sidebar .side-store .side-switch { gap: 11px; } /* the name starts where the menu words do */
    /* every sidebar icon draws the same 1.56px line: the 24-grid ones (Suppliers, Back, Settings sections) need 1.875 to match the 16-grid 1.25 */
    body.bo-light .bo-sidebar .side-link > svg:first-child:not(.sp) { stroke-width: 1.875; }
    /* Settings' section icons were solid (filled parts, knocked-out holes); here they are lines like the rest */
    body.bo-light .bo-sidebar .side-setnav .side-link svg .f { fill: none; }
    body.bo-light .bo-sidebar .side-setnav .side-link svg :is(.k, .hole) { fill: none; stroke: currentColor; }
    body.bo-light .bo-sidebar .side-gear { flex: none; width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 9999px; }
    @media (min-width: 1024px) {
      body.bo-light .bo-sidebar .side-loc .ss-mark { display: none; }
      body.bo-light .bo-sidebar .side-loc .side-switch { padding-left: 6px; } /* the name starts on the icon column */
      body.bo-light .bo-app.side-rail .bo-sidebar .side-loc { display: none; }
      body.bo-light .bo-app.side-rail .bo-sidebar .side-rail-btn { opacity: 1; }
    }
    /* phone/tablet: the hamburger sits on the store's (hidden) mark, as it did on the glyph */
    @media (max-width: 1023px) { body.bo-light .bo-sidebar .side-loc .ss-mark { visibility: hidden; } }
  </style>
  <!-- Lab: New supplier as a full page (owner 2026-11-16). Look measured from the owner's reference (a settings page:
       centred column, title, white cards of rows, label left and control right) and drawn with the copy's tokens. -->
  <style>
    body.bo-light .np { width: 100%; max-width: 640px; margin-inline: auto; padding-bottom: 48px; }
    body.bo-light .np-bar { display: flex; align-items: center; justify-content: space-between; min-height: var(--po-head-h); margin-bottom: 20px; }
    body.bo-light .np-x { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9999px; background: var(--sh-fill); color: var(--sh-ink); }
    body.bo-light .np-x:hover { background: var(--sh-line); }
    body.bo-light .np-x svg { width: 16px; height: 16px; }
    body.bo-light .np-save { height: 32px; padding: 0 16px; border: 0; border-radius: 9999px; background: var(--sh-ink); color: #fff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
    body.bo-light .np h1 { margin: 0 0 24px; font-size: 22px; font-weight: 600; line-height: 28px; letter-spacing: -0.01em; color: var(--sh-ink); }
    body.bo-light .np h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; line-height: 20px; color: var(--sh-ink); }
    body.bo-light .np-card { margin-bottom: 28px; border: 1px solid var(--b-line); border-radius: var(--b-r-cell); background: var(--b-raised); box-shadow: var(--sh-card-soft); overflow: hidden; }
    body.bo-light .np-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; padding: 9px 16px; }
    body.bo-light .np-row + .np-row { border-top: 1px solid var(--sh-line); }
    body.bo-light .np-l { display: grid; gap: 2px; min-width: 0; }
    body.bo-light .np-l b { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--sh-ink); }
    body.bo-light .np-l small { font-size: 13px; line-height: 18px; color: var(--sh-ink-2); }
    body.bo-light .np .np-in {
      flex: none; width: 280px; height: 34px; margin: 0; padding: 0 12px;
      border: 1px solid var(--b-line); border-radius: var(--b-r-row); background: var(--b-raised); box-shadow: none; outline: none;
      color: var(--sh-ink); font: inherit; font-size: 14px;
    }
    body.bo-light .np .np-in::placeholder { color: var(--sh-ink-3); }
    body.bo-light .np .np-in:focus { border-color: var(--sh-ink); }   /* ink, not blue: blue is links only */
    body.bo-light .np textarea.np-in { display: block; width: 100%; height: auto; min-height: 112px; padding: 12px 16px; border: 0; border-radius: 0; line-height: 1.5; resize: none; }
    body.bo-light .np-row.bad .np-in { border-color: var(--b-down); }
    body.bo-light .np-row.bad small { color: var(--b-down); }
    @media (max-width: 1023px) { body.bo-light .np-bar { padding-left: 46px; margin-top: -5px; } }   /* clear the hamburger, as .item-head does */
    @media (max-width: 600px) {
      body.bo-light .np-row { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 16px; }
      body.bo-light .np .np-in { width: 100%; }
    }
  </style>
</head>

            <label class="np-row"><span class="np-l"><b>Email</b></span><input class="np-in" name="email" type="email"></label>
            <label class="np-row"><span class="np-l"><b>Address</b></span><input class="np-in" name="address" type="text"></label>
          </div>
          <h2>Note</h2>
          <div class="np-card"><textarea class="np-in" name="note" rows="4" aria-label="Note" placeholder="Anything to remember about this supplier"></textarea></div>
        </form>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    (function () {
      // Sidebar: the hamburger opens the overlay under 1024px; a page link goes to that page in the copy.
      var app = document.getElementById('app');
      var wide = window.matchMedia('(min-width: 1024px)');
      wide.addEventListener('change', function () { app.classList.remove('side-open'); });
      document.getElementById('boSidebarToggle').addEventListener('click', function () {
        app.classList.toggle('side-open', !app.classList.contains('side-open') && !wide.matches);
      });
      document.addEventListener('click', function (e) {
        var link = e.target.closest('.bo-sidebar .side-link[data-view], .bo-sidebar .side-sublink');
        if (link) { location.href = 'backoffice-shopify.html#/' + (link.dataset.view || 'suppliers'); return; }   // shortcut: sub-links land on Suppliers, fine for a lab
        if (app.classList.contains('side-open') && !e.target.closest('.bo-sidebar, #boSidebarToggle')) app.classList.remove('side-open');
      });

      // Save: a name is the one thing it needs; said in the row, never a browser pop-up.
      var form = document.getElementById('nsForm'), name = form.elements.name, row = document.getElementById('nsName'), hint = row.querySelector('small');
      function setBad(on) { row.classList.toggle('bad', on); hint.textContent = on ? 'Add a name' : 'Required'; }
      name.addEventListener('input', function () { if (name.value.trim()) setBad(false); });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!name.value.trim()) { setBad(true); name.focus(); return; }
        var t = document.getElementById('toast');
        t.textContent = name.value.trim() + ' saved';
        t.hidden = false; requestAnimationFrame(function () { t.classList.add('show'); });
        setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.hidden = true; }, 200); }, 1800);
      });
    })();
  </script>
</body>
</html>
