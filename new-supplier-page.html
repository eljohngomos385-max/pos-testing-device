  <!-- Lab: the New supplier page. Everything above is the copy's own CSS; these rules only lay the form out,
       every colour, radius, line and shadow is the copy's token (--b-*, --sh-*, --po-*, --card-shadow). -->
  <style>
    /* New supplier: one plain column on the page. No cards, no borders: soft grey fields, labels above,
       Save where the form ends (owner 2026-11-13: "box inside a box" was the problem; "a simple form"). */
    body.bo-light .ns { display: grid; gap: 20px; width: 100%; max-width: 560px; margin-inline: auto; padding-bottom: 40px; }
    body.bo-light .ns > .item-head { min-height: var(--po-head-h); margin-bottom: 4px; }
    body.bo-light .ns-two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; }
    body.bo-light .ns-f { display: grid; gap: 8px; min-width: 0; }
    body.bo-light .ns-f > span:first-child { font-size: 13px; font-weight: 500; line-height: 18px; color: var(--sh-ink-2); }
    body.bo-light .ns .ns-in {
      width: 100%; height: 40px; padding: 0 14px; margin: 0;
      border: 0; border-radius: var(--b-r-cell); background: var(--sh-fill);
      color: var(--sh-ink); font: inherit; font-size: 14px; outline: none; box-shadow: none;
      transition: background .12s, box-shadow .12s;
    }
    body.bo-light .ns .ns-in:focus { background: var(--b-raised); box-shadow: 0 0 0 1px var(--sh-ink); }   /* ink, not blue: blue is links only */
    body.bo-light .ns textarea.ns-in { height: auto; min-height: 104px; padding: 10px 14px; line-height: 1.5; resize: vertical; }
    body.bo-light .ns .ns-f.bad .ns-in { box-shadow: 0 0 0 1px var(--b-down); }
    body.bo-light .ns-err { font-size: 13px; color: var(--b-down); }
    body.bo-light .ns-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    body.bo-light .ns .ns-foot > * { display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: var(--b-r-cell); font-size: 14px; }
    body.bo-light .ns .ns-foot > .secondary-btn { background: var(--sh-fill); border: 0; box-shadow: none; color: var(--sh-ink); }
    @media (max-width: 480px) { body.bo-light .ns-two { grid-template-columns: minmax(0, 1fr); } }
  </style>

            <div class="side-menu up" id="locMenu" role="menu" hidden></div>
          </div>
          <div class="side-switch-wrap">
            <button class="side-switch acct" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="ss-mark" id="acctMark">EJ</span>
              <span class="ss-text"><span class="ss-name" id="acctName">El John</span><span class="ss-label" id="acctRole">Owner</span></span>
            </button>
            <div class="side-menu up" id="acctMenu" role="menu" hidden></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============== MAIN ============== -->
    <div class="main bo-main">
      <section class="view view-suppliers active" data-view="suppliers">
        <!-- New supplier: SUP_FIELDS (bo-suppliers.js), nothing else, in one column. Lab: Save checks the name and says so, it stores nothing. -->
        <form class="ns" id="nsForm" novalidate autocomplete="off">
          <header class="item-head">
            <a class="item-back" href="backoffice-shopify.html#/suppliers">Suppliers</a>
            <h1>New supplier</h1>
          </header>
          <label class="ns-f"><span>Name</span><input class="ns-in" name="name" type="text" autofocus></label>
          <label class="ns-f"><span>Contact person</span><input class="ns-in" name="contact" type="text"></label>
          <div class="ns-two">
            <label class="ns-f"><span>Phone</span><input class="ns-in" name="phone" type="tel"></label>
            <label class="ns-f"><span>Email</span><input class="ns-in" name="email" type="email"></label>
          </div>
          <label class="ns-f"><span>Address</span><input class="ns-in" name="address" type="text"></label>
          <label class="ns-f"><span>Note</span><textarea class="ns-in" name="note" rows="4"></textarea></label>
          <div class="ns-foot">
            <a class="secondary-btn" href="backoffice-shopify.html#/suppliers">Cancel</a>
            <button class="primary-btn" type="submit">Save</button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    (function () {
      // Sidebar: the hamburger opens the overlay under 1024px; a page link goes to that page in the copy.
      var app = document.getElementById('app');
      var wide = window.matchMedia('(min-width: 1024px)');
      wide.addEventListener('change', function () { app.classList.remove('side-open'); });
      document.getElementById('boSidebarToggle').addEventListener('click', function () {
        app.classList.toggle('side-open', !app.classList.contains('side-open') && !wide.matches);
      });
      document.addEventListener('click', function (e) {
        var link = e.target.closest('.bo-sidebar .side-link[data-view], .bo-sidebar .side-sublink');
        if (link) { location.href = 'backoffice-shopify.html#/' + (link.dataset.view || 'suppliers'); return; }   // ponytail: sub-links land on Suppliers
        if (app.classList.contains('side-open') && !e.target.closest('.bo-sidebar, #boSidebarToggle')) app.classList.remove('side-open');
      });

      // Save: a name is the one thing it needs; said under the field, never a browser pop-up.
      var form = document.getElementById('nsForm');
      var name = form.elements.name, field = name.closest('.ns-f');
      function setBad(on) {
        field.classList.toggle('bad', on);
        var msg = field.querySelector('.ns-err');
        if (on && !msg) field.insertAdjacentHTML('beforeend', '<span class="ns-err">Add a name</span>');
        if (!on && msg) msg.remove();
      }
      name.addEventListener('input', function () { if (name.value.trim()) setBad(false); });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!name.value.trim()) { setBad(true); name.focus(); return; }
        var t = document.getElementById('toast');
        t.textContent = name.value.trim() + ' saved';
        t.hidden = false; requestAnimationFrame(function () { t.classList.add('show'); });
        setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.hidden = true; }, 200); }, 1800);
      });
    })();
  </script>
</body>
</html>
