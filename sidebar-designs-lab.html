<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sidebar designs lab</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
/* Nine sidebar designs, each beside the same static copy of the Sales page. */
:root {
  --b-font: "Inter";
  --b-page: #FFFFFF; --b-card: #F9F9F9; --b-raised: #FFFFFF; --b-line: #ECECEC; --b-outline: #E1E1E1; --b-track: #EFEFEF;
  --b-ink: #303030; --b-ink-2: #616161; --b-ink-3: #8C8C8C;
  --b-up: #047B5D; --b-down: #D72C0D; --b-up-tint: #D3ECDD; --b-down-tint: #F8D8D0; --b-heat: #1FA855;
  --b-data: #2B7DE9; --b-data-1: #BCD7FA;
  --b-t-value: 27px; --b-t-label: 13px; --b-t-meta: 12.5px; --b-t-micro: 11px;
  --b-r-card: 14px; --b-r-cell: 10px; --b-r-row: 7px; --b-pad: 16px; --b-gap: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #EDEDED; color: var(--b-ink); font-family: var(--b-font), -apple-system, "Segoe UI", sans-serif;
       font-size: var(--b-t-label); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- gallery chrome ---------- */
.intro { max-width: 1440px; margin: 0 auto; padding: 32px 0 8px; }
.intro h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
.intro p { color: var(--b-ink-2); margin: 0; max-width: 760px; line-height: 1.5; }
.jump { position: sticky; top: 0; z-index: 50; background: rgba(237,237,237,.92); backdrop-filter: blur(8px); }
.jump div { max-width: 1440px; margin: 0 auto; padding: 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.jump a { padding: 5px 10px; border-radius: 8px; background: #fff; border: 1px solid var(--b-outline); color: var(--b-ink); text-decoration: none; font-weight: 500; }
.design { max-width: 1440px; margin: 28px auto 0; scroll-margin-top: 60px; }
.design h2 { font-size: 16px; font-weight: 600; margin: 0; }
.design h2 span { color: var(--b-ink-3); font-weight: 500; margin-right: 8px; }
.design .why { color: var(--b-ink-2); margin: 4px 0 12px; max-width: 900px; line-height: 1.5; }
.design .refs { color: var(--b-ink-3); font-size: var(--b-t-meta); margin: -6px 0 12px; }
.design:last-of-type { margin-bottom: 60px; }

/* ---------- the window each design sits in: sidebar column + the page ---------- */
.frame { width: 1440px; height: 820px; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--b-page);
         border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.06); }
.frame > .sb { min-width: 0; }
.mock { min-width: 0; overflow: hidden; background: var(--b-page); }

/* ---------- the Sales page copy (don't restyle from a design) ---------- */
.mock main { padding: 20px 24px 40px; max-width: 1180px; margin: 0 auto; }
.mock .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.mock .bar h1 { font-size: 18px; font-weight: 600; margin: 0 auto 0 0; }
.mock .seg { display: inline-flex; background: var(--b-track); border-radius: 9px; padding: 2px; }
.mock .seg b { padding: 5px 14px; border-radius: 7px; color: var(--b-ink-2); font-weight: 400; }
.mock .seg b.on { background: var(--b-raised); color: var(--b-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
.mock .ib { border: 1px solid var(--b-outline); background: var(--b-raised); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--b-ink-2); }
.mock .mo { font-size: 15px; font-weight: 600; }
.mock .note { font-size: var(--b-t-meta); color: var(--b-ink-3); margin: 0 0 14px; }
.mock .strip { background: var(--b-card); border: 1px solid var(--b-line); border-radius: var(--b-r-card); padding: var(--b-pad) 4px;
               display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 18px; }
.mock .stat { padding: 0 16px; border-left: 1px solid var(--b-line); min-width: 0; }
.mock .stat:first-child { border-left: 0; }
.mock .lbl { color: var(--b-ink-2); }
.mock .line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }
.mock .val { font-size: 22px; font-weight: 560; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mock .val.up { color: var(--b-up); }
.mock .sub { color: var(--b-ink-3); font-size: var(--b-t-meta); margin-top: 2px; white-space: nowrap; }
.mock .chip { font-size: var(--b-t-meta); font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mock .chip.up { background: var(--b-up-tint); color: var(--b-up); }
.mock .chip.down { background: var(--b-down-tint); color: var(--b-down); }
.mock .pct { font-weight: 600; font-size: var(--b-t-meta); }
.mock .cal { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.mock .dow { text-align: center; color: var(--b-ink-2); padding-bottom: 2px; }
.mock .cell { min-height: 82px; border: 1px solid var(--b-line); border-radius: var(--b-r-cell); padding: 8px 10px; display: flex; flex-direction: column; background: var(--b-page); }
.mock .cell .d { color: var(--b-ink-2); }
.mock .cell .v { margin-top: auto; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mock .cell .m { font-size: 11px; color: var(--b-ink-3); margin-top: 1px; }
.mock .cell.wk { background: var(--b-card); }
.mock .cell.fut .d { color: #BDBDBD; }
.mock .cell.today { box-shadow: inset 0 0 0 1.5px var(--b-ink); }
.mock .cell.heat { background: var(--heat); border-color: color-mix(in srgb, var(--heat) 85%, var(--b-ink)); }
.mock .cell.heat .d, .mock .cell.heat .m { color: rgba(0,0,0,.55); }
.mock .blank { border: 0; background: none; }
.mock .legend { text-align: center; color: var(--b-ink-2); font-size: var(--b-t-meta); margin: 14px 0 18px; }
.mock .hls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--b-gap); }
.mock .hl { background: var(--b-card); border: 1px solid var(--b-line); border-radius: var(--b-r-card); padding: 12px 14px; }
.mock .hl .k { display: block; font-size: var(--b-t-micro); color: var(--b-ink-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.mock .hl b { display: block; font-size: 15px; font-weight: 600; }
.mock .hl small { color: var(--b-ink-3); font-size: var(--b-t-meta); }
</style>

.d-A1 .sb .av { width: 26px; height: 26px; border-radius: 50%; background: var(--b-raised); color: var(--b-ink-2); }
</style>

      const heat = r[1] >= bar ? ` heat" style="--heat:color-mix(in srgb, var(--b-heat) ${Math.round(12 + 43 * (r[1] - bar) / (hi - bar))}%, white)` : '';
      h += `<div class="cell${heat}"><span class="d">${d}</span><span class="v">${peso(r[1])}</span><span class="m">${r[2]} receipts</span></div>`;
    } else h += `<div class="cell${d === 24 ? ' today' : ' fut'}"><span class="d">${d}</span>${d === 24 ? '<span class="m">No sales</span>' : ''}</div>`;
    if (++col === 7 || d === 30) { if (WEEKS[w]) h += `<div class="cell wk"><span class="d">${WEEKS[w][0]}</span><span class="v">${peso(WEEKS[w][1])}</span><span class="m">${WEEKS[w][2]}</span></div>`; w++; col = 0; }
  }
  return h;
}
const mock = document.getElementById('mock').innerHTML.replace('<div class="cal"></div>', `<div class="cal">${calendar()}</div>`);
for (const t of document.querySelectorAll('template.design')) {
  const id = t.dataset.id, sec = document.createElement('section');
  sec.className = 'design'; sec.id = id;
  sec.innerHTML = `<h2><span>${id}</span>${t.dataset.title || ''}</h2><p class="why">${t.dataset.why || ''}</p>`
    + (t.dataset.refs ? `<p class="refs">After: ${t.dataset.refs}</p>` : '')
    + `<div class="frame d-${id}">${t.innerHTML}${mock}</div>`;
  document.getElementById('designs').append(sec);
  document.getElementById('jump').insertAdjacentHTML('beforeend', `<a href="#${id}">${id}</a>`);
}
</script>
</body>
