<style>
/* signed-in, light, measured off gemini.google.com at 1440x860. Chat title + account are made up. */
:root { --bg: rgb(250,249,249); --side: rgb(255,255,255); --ink: rgb(31,31,31); --mute: rgba(0,0,0,.55); --dim: rgb(68,71,70); --tonal: rgb(242,240,240); --hover: rgba(0,0,0,.08);
  --side-w: 52px; --shift: 36px; --ease: cubic-bezier(.2,0,0,1); }
body.open { --side-w: 288px; --shift: 0px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Google Sans Flex", "Google Sans", Helvetica, Arial, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.ic { font-family: "Luminous Symbols"; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; font-feature-settings: "liga";
  font-variation-settings: "FILL" 0, "GRAD" 0, "ROND" 100, "opsz" 20, "wght" 320; display: inline-block; width: 1em; height: 1em; overflow: hidden; flex: none; }
.ic.l { font-size: 24px; font-variation-settings: "FILL" 0, "GRAD" 0, "ROND" 100, "opsz" 24, "wght" 300; }
.ic.s { font-size: 16px; font-variation-settings: "FILL" 0, "GRAD" 0, "ROND" 100, "opsz" 16, "wght" 330; }
.ic.g { font-family: "Google Symbols"; font-size: 18px; font-variation-settings: normal; position: relative; top: 1px; }
.t13 { font-size: 13px; line-height: 17px; font-variation-settings: "wdth" 92, "wght" 400; }
.t15 { font-size: 15px; line-height: 20px; font-variation-settings: "wdth" 92, "wght" 400; }

/* sidebar: 52px rail (page grey) <-> 288px panel (white), 300ms */
.side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w); background: var(--bg); z-index: 2; overflow: hidden;
  transition: width .3s var(--ease), background-color .3s var(--ease); }
body.open .side { background: var(--side); }
.round { position: absolute; width: 36px; height: 36px; border-radius: 9999px; display: grid; place-items: center; }
.round:hover, .item:hover, .sec:hover, .acct:hover, .filter:hover { background: var(--hover); }
.logo-btn { left: 8px; top: 10px; }
.logo-btn img { width: 22px; height: 22px; }
.logo-btn .ic { display: none; color: var(--mute); }
body:not(.open) .logo-btn:hover img { display: none; }
body:not(.open) .logo-btn:hover .ic { display: inline-block; }
body.open .logo-btn { pointer-events: none; }
.word { position: absolute; left: 46px; top: 16px; font-size: 17px; line-height: 24px; color: #000; font-variation-settings: "ROND" 20, "wdth" 94, "wght" 470; }
.close { left: 244px; top: 8px; color: var(--mute); }
/* search sits in the head when open, drops into the rail under New chat when closed */
.search { left: 208px; top: 8px; color: var(--mute); transition: left .3s var(--ease), top .3s var(--ease), color .3s; }
body:not(.open) .search { left: 8px; top: 92px; color: #000; }
/* labels fade out first, fade in after the slide (150ms, 100ms delay) */
.lbl { opacity: 1; visibility: visible; white-space: nowrap; transition: opacity 150ms linear 100ms, visibility 0s; }
body:not(.open) .lbl { opacity: 0; visibility: hidden; transition: opacity 100ms linear, visibility 0s 100ms; }

.item { position: absolute; left: 8px; width: 272px; height: 32px; padding: 0 8px; border-radius: 9999px; display: flex; align-items: center; gap: 12px; color: #000;
  transition: transform .3s var(--ease), left .3s var(--ease), width .3s var(--ease); }
.item.down { transform: translateY(var(--shift)); }   /* rail rows below Search move down one slot */
body:not(.open) .item { left: 10px; width: 32px; }
.item.on { background: var(--tonal); }
.item.on .t13 { font-variation-settings: "wdth" 92, "wght" 540; }
.sec { position: absolute; left: 0; height: 32px; padding: 1px 6px 1px 16px; border-radius: 0 9999px 9999px 0; display: flex; align-items: center; gap: 4px; color: var(--mute); }
.sec .ic { opacity: 0; color: var(--mute); transition: opacity .15s; }
.sec:hover .ic { opacity: 1; }
.filter { position: absolute; left: 250px; top: 344px; width: 24px; height: 24px; border-radius: 9999px; display: grid; place-items: center; color: var(--mute); }
.chat { padding-left: 8px; }
.chat .more { position: absolute; right: 8px; visibility: hidden; color: #000; }
.chat:hover .more { visibility: visible; }

/* foot: avatar + name left, Settings right; closed = Settings above the avatar */
.acct { position: absolute; left: 8px; bottom: 12px; height: 39px; padding: 0 6px 0 5px; border-radius: 9999px; display: flex; align-items: flex-start; gap: 8px; padding-top: 5px; color: #000; }
.acct .t15 { margin-top: 4px; }
body:not(.open) .acct { width: 39px; overflow: hidden; }
.avatar { width: 28px; height: 28px; border-radius: 9999px; background: rgb(123,31,162); color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }
.gear { left: 244px; bottom: 14px; color: #000; transition: left .3s var(--ease), bottom .3s var(--ease); }
body:not(.open) .gear { left: 8px; bottom: 57px; }
body:not(.open) .open-only { display: none; }

/* top right: Get app, Upgrade, Temporary chat */
.top { position: fixed; top: 14px; right: 12px; display: flex; align-items: center; gap: 12px; z-index: 2; }
.pill { height: 36px; padding: 0 12px; border-radius: 9999px; display: flex; align-items: center; gap: 8px; color: #000; }
.getapp { padding-left: 8px; background: var(--tonal); }
.getapp:hover { background: rgb(230,228,228); }
.upgrade { background: rgb(157,210,255); }
.upgrade:hover { background: rgb(141,199,250); }
.temp { position: static; padding: 8px; color: #000; }

/* everything right of the sidebar follows its width */
.stage, main { position: fixed; left: var(--side-w); right: 0; transition: left .3s var(--ease); }
.stage { top: 70px; bottom: 0; overflow: clip; z-index: 0; pointer-events: none; }
.stage::before, .stage::after { content: ""; position: absolute; left: 50%; top: calc(50% + 15px); width: 202.18%; max-width: 1601.27px; aspect-ratio: 1.4338 / 1; transform: translate(-50%, -50%);
  mask-image: var(--glow-mask); mask-size: 100% 200%; mask-repeat: no-repeat; -webkit-mask-image: var(--glow-mask); -webkit-mask-size: 100% 200%; -webkit-mask-repeat: no-repeat; }
.stage::before { background: #9dd2ff; mask-position: 0 0; -webkit-mask-position: 0 0; }
.stage::after { background: #fff; opacity: .5; mask-position: 0 100%; -webkit-mask-position: 0 100%; }

main { top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding-top: calc(50vh - 194px); z-index: 1; }
h1 { margin: 0; font-size: 36px; line-height: 44px; font-weight: 320; font-variation-settings: "ROND" 100, "wdth" 100, "wght" 320; color: var(--ink); text-align: center; }
.cta-wrap { position: relative; margin-top: 24px; display: inline-flex; border-radius: 9999px; isolation: isolate; }
.cta-halo { position: absolute; inset: -2px; border-radius: 9999px; pointer-events: none; opacity: .24; filter: blur(7px);
  background: conic-gradient(from var(--a, 0deg), rgb(66,133,244), rgb(155,114,203), rgb(217,101,112), rgb(255,182,131), rgb(128,218,136), rgb(161,201,255), rgb(66,133,244));
  transition: opacity .24s var(--ease), filter .24s var(--ease); }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
.cta-wrap:hover .cta-halo { opacity: .48; filter: blur(8px); animation: spin 2.4s linear infinite; }
.cta { position: relative; z-index: 1; height: 38px; padding: 0 12px; border: 1px solid rgba(255,255,255,.92); border-radius: 9999px; background: #fff; color: #000; }

.input { margin-top: 56px; width: 660px; max-width: calc(100% - 32px); height: 64px; border-radius: 32px; background: #fff; box-shadow: rgba(0,0,0,.16) 0 2px 8px -2px;
  display: flex; align-items: center; padding: 0 16px 0 20px; }
.ibtn { width: 32px; height: 32px; border-radius: 9999px; display: grid; place-items: center; color: #000; flex: none; }
.ibtn:hover, .model:hover { background: var(--hover); }
.editor { flex: 1; min-width: 0; height: 24px; padding: 0; margin-left: 8px; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 17px; line-height: 24px; font-variation-settings: "wdth" 92, "wght" 400; }
.editor::placeholder { color: rgb(95,99,104); }
.model { height: 40px; padding: 0 16px; margin: 0 16px 0 18px; border-radius: 9999px; display: flex; align-items: center; gap: 5px; color: #000; flex: none; }
.model .auto { color: var(--mute); }
.model .ic { margin: 0 -4px 0 3px; color: var(--dim); }
</style></head><body class="open">
