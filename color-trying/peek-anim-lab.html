<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peek Animations</title>
  <!-- Lab (owner 2026-10-22): the peek's way in. Round 2: A or B liked but "too slow, it should really transform" - so: today's + the tile turning into the card, on the real try-peek.html. Pick one, hold a tile. -->
  <style>
    :root { --bg: #f2f2f7; --ink: #1c1c1e; --ink-2: #6e6e73; --seg: #e3e3e8; --on: #fff; --line: rgb(0 0 0 / .08); }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f2f2f7; --ink-2: #8e8e93; --seg: #1c1c1e; --on: #3a3a3c; --line: rgb(255 255 255 / .1); } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .bar { flex: none; padding: max(10px, env(safe-area-inset-top)) 16px 10px; border-bottom: .5px solid var(--line); }
    .seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--seg); }
    .seg button { flex: 1; min-height: 32px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--on); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
    .say { margin: 8px 2px 0; color: var(--ink-2); font-size: 13px; }
    .say b { color: var(--ink); font-weight: 600; }
    iframe { flex: 1; width: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="seg" id="seg"></div>
    <p class="say" id="say"></p>
  </div>
  <iframe src="try-peek.html" title="Sell"></iframe>
  <script>
    const ways = [
      ['a', 'Now', 'today\'s: a card grows out of the tile.'],
      ['b', 'Transform', 'the tile itself becomes the card, and back. 0.3 s, a hint of bounce.'],
      ['c', 'Transform + press', 'the tile sinks in while you hold, then becomes the card with a little bounce.'],
      ['d', 'Transform, quick', 'the tile becomes the card in 0.2 s, no bounce.'],
    ];
    const seg = document.getElementById('seg'), say = document.getElementById('say');
    function pick(k) {
      window.PEEK_ANIM = k;   // try-peek.html reads it from here on each hold
      const [, name, text] = ways.find(w => w[0] === k);
      for (const b of seg.children) b.setAttribute('aria-pressed', b.dataset.k === k);
      say.innerHTML = `<b>${name}</b> — ${text} Hold a tile.`;
    }
    seg.innerHTML = ways.map(([k], i) => `<button type="button" data-k="${k}">${String.fromCharCode(65 + i)}</button>`).join('');
    seg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(b.dataset.k); });
    pick('a');
  </script>
</body>
</html>
