<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Flush Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   CART LAB 2: FLUSH COLUMN. The Sell screen's cart is the checkout page's items column, the same one:
   flush to the right, top and bottom, a hairline on its left, no box. Same width (clamp 340–420px), same 50px
   customer row, same tinted "Item / Amount" band (its left cell carries the item count), same 45px rows and
   the same pinned Total. Pressing Check out swaps only the left side; this column does not move.
   Under the Total, still inside the column, sit the Sell-only controls in checkout's grey 14px tiles:
   Pickup | Delivery as a joined pair, Discount beside it, then Check out. Lost sale / Save receipt / Clear
   sit behind a "⋯" at the end of the customer row. Tap a line for its qty / price / remove tray.
   ?empty=1 starts empty, ?many=1 seeds 24 lines. Money is integer centavos; prices are VAT-inclusive.
   =========================================================================== */
:root {
  --font:      "Inter";
  --page:      #FFFFFF;
  --tile:      #F9F9F9;
  --soft:      #F9F9F9;                               /* the band, an open line */
  --grey:      #F3F3F3;                               /* checkout's tiles */
  --grey-2:    #EDEDED;
  --line:      #ECECEC;
  --outline:   #E1E1E1;
  --btn-line:  #D4D4D4;
  --ring:      #E6E6E6;
  --ink:       #303030;
  --ink-2:     #616161;
  --ink-3:     #8C8C8C;
  --ink-4:     #C8C8C8;
  --down:      #D72C0D;
  --down-tint: #FBEDEA;
  --data-1:    #BCD7FA;
  --data-tint: #DCE9FB;
  --data-ink:  #1F5FB8;
  --hover:     #F6F6F6;
  --press:     #EDEDED;
  --pop:       0 8px 24px rgba(0,0,0,.08);
  --r-input:   10px;
  --r-btn:     12px;
  --r-tile:    14px;
  --m:         20px;                                  /* checkout's --m */
  --tap:       48px;                                  /* checkout's --tap */
  --items-w:   clamp(340px, 32vw, 420px);            /* checkout's --items-w */
  --cust-h:    50px;                                  /* checkout's --cust-h */
  --ease:      cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--page); color: var(--ink);
  font: 13px/1.4 var(--font), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--data-1); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) var(--items-w); height: 100vh; height: 100dvh; }

/* ---------- products (same in every lab) ---------- */
.shop { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px; min-width: 0; padding: var(--m) var(--m) 0; }
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid var(--outline); border-radius: var(--r-input); background: var(--page); color: var(--ink-3); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-content: start; overflow-y: auto; padding-bottom: var(--m); }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: clamp(84px, 11vh, 112px); padding: 8px 12px;
        border: 0; border-radius: var(--r-input); background: var(--tile); box-shadow: inset 0 0 0 1px var(--ring); text-align: center; transition: background-color .12s, transform .1s; }
.tile[hidden] { display: none; }
.tile:hover { background: var(--hover); }
.tile:active { transform: scale(.98); background: var(--press); }
.tile b { font-size: 14px; font-weight: 560; line-height: 1.25; }
.tile span { color: var(--ink-3); font-size: 12.5px; }

/* ---------- the column: checkout's items column, plus the Sell footer ---------- */
.cart { position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; border-left: 1px solid var(--line); }
.cust { display: flex; height: var(--cust-h); border-bottom: 1px solid var(--line); }
.i-cust { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 var(--m); border: 0; background: none;
          font-size: 14px; font-weight: 560; text-align: left; transition: background-color .12s; }
.i-cust:hover { background: var(--hover); }
.i-cust span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.i-cust .ic { color: var(--ink-2); }
.i-cust .chev { width: 16px; height: 16px; color: var(--ink-3); }
.more { display: grid; place-items: center; width: 52px; flex: none; border: 0; border-left: 1px solid var(--line); background: none; color: var(--ink-2); }
.more:hover, .more[aria-expanded="true"] { background: var(--hover); }
.more .ic { width: 20px; height: 20px; }
.menu { position: absolute; top: calc(var(--cust-h) + 4px); right: 8px; z-index: 20; min-width: 200px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-input);
        background: var(--page); box-shadow: var(--pop); }
.menu[hidden] { display: none; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 12px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 14px; }
.menu button:hover { background: var(--soft); }
.menu button:disabled { opacity: .35; pointer-events: none; }
.menu button .ic { color: var(--ink-3); }
.menu .danger, .menu .danger .ic { color: var(--down); }
.menu hr { margin: 4px -4px; border: 0; border-top: 1px solid var(--line); }

.i-head { display: flex; justify-content: space-between; gap: 12px; padding: 11px var(--m); background: var(--soft); border-bottom: 1px solid var(--line);
          color: var(--ink-2); font-size: 12px; font-weight: 500; }
.lines { overflow-y: auto; overscroll-behavior: contain; }
.line + .line { border-top: 1px solid var(--line); }
.line.open { background: var(--soft); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 45px; padding: 7px var(--m); border: 0; background: none; text-align: left; }
.row .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.row .nm span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.row .nm small { display: block; color: var(--ink-3); font-size: 12px; }
.row .amt { font-size: 13px; font-weight: 600; white-space: nowrap; }
.line.flash { animation: flash .7s var(--ease); }
@keyframes flash { from { background: var(--data-tint); } }
.tray { display: flex; align-items: center; gap: 8px; padding: 0 var(--m) 10px; }
.step { display: flex; align-items: center; height: 44px; border: 1px solid var(--outline); border-radius: var(--r-input); background: var(--page); }
.step button { display: grid; place-items: center; width: 44px; height: 100%; border: 0; background: none; color: var(--ink-2); }
.step button:active { background: var(--press); }
.step output { min-width: 32px; text-align: center; font-size: 15px; font-weight: 600; }
.price { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; height: 44px; padding: 0 10px; border: 1px solid var(--outline); border-radius: var(--r-input); background: var(--page); color: var(--ink-3); }
.price:focus-within { border-color: var(--data-1); outline: 2px solid var(--data-1); outline-offset: -1px; }
.price input { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: none; color: var(--ink); font-size: 14px; font-weight: 500; }
.del { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 0; border-radius: var(--r-input); background: none; color: var(--down); }
.del:hover { background: var(--down-tint); }
.del[hidden] { display: none; }

.empty { display: grid; place-content: center; justify-items: center; gap: 6px; height: 100%; padding: 24px; text-align: center; }
.empty .ic { width: 36px; height: 36px; stroke-width: 1.3; color: var(--ink-4); margin-bottom: 6px; }
.empty b { font-size: 15px; font-weight: 600; }
.empty span { color: var(--ink-3); }

/* the pinned summary: checkout's .i-total, with the breakdown folding out above it */
.foot { border-top: 1px solid var(--line); }
.break { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }
.break.open { grid-template-rows: 1fr; }
.break > div { min-height: 0; overflow: hidden; }
.break p { display: flex; justify-content: space-between; margin: 0; padding: 2px var(--m); color: var(--ink-2); font-size: 13px; }
.break p:first-child { padding-top: 12px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; padding: 14px var(--m) 16px; border: 0; background: none; text-align: left; }
.sum .l { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; }
.sum .l .ic { width: 14px; height: 14px; stroke-width: 2; color: var(--ink-3); transition: transform .2s var(--ease); }
.sum[aria-expanded="true"] .l .ic { transform: rotate(180deg); }
.sum .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.cart.empty-cart .sum .v { color: var(--ink-3); }
/* Sell-only: same column, same gutter, checkout's grey tiles */
.sell { display: grid; gap: 10px; padding: 0 var(--m) var(--m); }
.opts { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.gt { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; height: var(--tap); padding: 0 10px; border: 1px solid transparent; border-radius: var(--r-tile);
      background: var(--grey); color: var(--ink-2); font-size: 14px; font-weight: 560; white-space: nowrap; transition: background-color .12s, border-color .12s, color .12s; }
.gt:hover { background: var(--grey-2); }
.gt .ic { width: 17px; height: 17px; }
.pair .gt:first-child { border-radius: var(--r-tile) 6px 6px var(--r-tile); }
.pair .gt:last-child { border-radius: 6px var(--r-tile) var(--r-tile) 6px; }
.gt[aria-pressed="true"], .gt.on { background: var(--data-tint); border-color: var(--data-1); color: var(--data-ink); }
.disc { display: flex; gap: 8px; }
.disc[hidden] { display: none; }
.kind { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; flex: none; width: 96px; }
.kind .gt { height: 44px; padding: 0; }
.kind .gt:first-child { border-radius: var(--r-input) 4px 4px var(--r-input); }
.kind .gt:last-child { border-radius: 4px var(--r-input) var(--r-input) 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 1px solid var(--btn-line); border-radius: var(--r-input);
       background: var(--page); font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
.btn:hover { background: var(--hover); }
/* checkout's .btn.primary */
.go { height: 50px; width: 100%; border: 1px solid var(--ink); border-radius: var(--r-btn); background: var(--ink); color: #fff; font-size: 15px; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 0 rgba(0,0,0,.2); transition: background-color .12s, opacity .2s; }
.go:hover { background: #1F1F1F; }
.go:active { background: #000; }
.go:disabled { opacity: .3; pointer-events: none; }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0 8px 0 16px; border-radius: var(--r-input);
         background: var(--ink); color: #fff; font-size: 14px; font-weight: 500; box-shadow: var(--pop); transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
         transition: opacity .2s, transform .25s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast:not(:has(button)) { padding-right: 16px; }
.toast button { height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
/* the tiles fill the screen like the real sell page: 4 across, 5 down, no empty band under them */
.shop { min-height: 0; }
.grid { grid-template-rows: repeat(5, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); align-content: stretch; overflow: hidden; }
.grid .tile { height: auto; min-height: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18.5" cy="12" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8a1 1 0 0 1 0 1.4l-7.6 7.6a1 1 0 0 1-1.4 0z"/><circle cx="8.5" cy="8.5" r="1.4"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><rect x="2" y="6" width="12" height="10" rx="1.5"/><path d="M14 9h4l3 3.5V16h-7"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/></symbol>
  <symbol id="i-lost" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.5 6.5l11 11"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-rcpt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
</svg>

<div class="app">
  <section class="shop" aria-label="Products">
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search products or scan" autocomplete="off"></label>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart" aria-label="Receipt">
    <div class="cust">
      <button type="button" class="i-cust" id="who" title="Change customer"><svg class="ic"><use href="#i-person"/></svg><span id="cust">Walk-in customer</span><svg class="ic chev"><use href="#i-right"/></svg></button>
      <button type="button" class="more" id="more" aria-haspopup="menu" aria-expanded="false" title="More"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-act="lost"><svg class="ic"><use href="#i-lost"/></svg>Lost sale</button>
      <button type="button" role="menuitem" data-act="save"><svg class="ic"><use href="#i-save"/></svg>Save receipt</button>
      <hr>
      <button type="button" role="menuitem" data-act="clear" class="danger"><svg class="ic"><use href="#i-clear"/></svg>Clear</button>
    </div>
    <div class="i-head"><span class="num" id="count">Item</span><span>Amount</span></div>
    <div class="lines" id="lines"></div>

    <footer class="foot">
      <div class="break" id="break"><div id="breakIn"></div></div>
      <button type="button" class="sum" id="sum" aria-expanded="false"><span class="l">Total<svg class="ic"><use href="#i-down"/></svg></span><span class="v num" id="total"></span></button>
      <div class="sell">
        <form class="disc" id="disc" hidden>
          <div class="kind" role="group" aria-label="Discount type">
            <button type="button" class="gt" data-k="%" aria-pressed="true">%</button>
            <button type="button" class="gt" data-k="₱" aria-pressed="false">₱</button>
          </div>
          <label class="price"><input id="discIn" inputmode="decimal" placeholder="Amount" autocomplete="off"></label>
          <button type="button" class="del" id="discOff" aria-label="Remove discount"><svg class="ic"><use href="#i-trash"/></svg></button>
          <button type="submit" class="btn">Apply</button>
        </form>
        <div class="opts">
          <div class="pair" role="group" aria-label="Fulfilment">
            <button type="button" class="gt" data-f="pickup" aria-pressed="true"><svg class="ic"><use href="#i-bag"/></svg>Pickup</button>
            <button type="button" class="gt" data-f="delivery" aria-pressed="false"><svg class="ic"><use href="#i-truck"/></svg>Delivery</button>
          </div>
          <button type="button" class="gt" id="discBtn"><svg class="ic"><use href="#i-tag"/></svg><span id="discLbl">Discount</span></button>
        </div>
        <button type="button" class="go" id="go">Check out</button>
      </div>
    </footer>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const peso = c => '₱' + (c / 100).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toC = s => Math.round((parseFloat(String(s).replace(/[^\d.]/g, '')) || 0) * 100);

// ---------- catalogue (centavos) ----------
const PRODUCTS = [
  ['PLB-1001', 'PVC Elbow 1/2"', 1200], ['PLB-1002', 'PVC Elbow 3/4"', 1600], ['PLB-1003', 'PVC Tee 1/2"', 1450], ['PLB-1010', 'PVC Pipe 1/2" × 3m', 14500],
  ['PLB-1020', 'Brass Faucet 1/2"', 18500], ['PLB-1030', 'Teflon Tape 1/2"', 2500], ['ELC-2001', 'LED Bulb 9W Daylight', 8900], ['ELC-2010', 'Duplex Outlet 2-Gang', 6500],
  ['ELC-2011', 'Switch 1-Gang', 4800], ['ELC-2020', 'Electrical Tape Black', 3500], ['ELC-2030', 'Circuit Breaker 30A', 42000], ['FST-3001', 'Wood Screw #8 × 1"', 250],
  ['FST-3010', 'Hex Bolt M10 × 100mm', 1800], ['FST-3011', 'Flat Washer M10', 150], ['TLS-4001', 'Claw Hammer 16oz', 28500], ['TLS-4002', 'Phillips Screwdriver #2', 14500],
  ['TLS-4003', 'Combination Pliers 8"', 22000], ['TLS-4004', 'Tape Measure 5m', 16500], ['TLS-4005', 'Hacksaw Frame 12"', 19500], ['TLS-4006', 'Aluminum Level 24"', 38500],
].map(([sku, name, price]) => ({sku, name, price}));
// ponytail: only ?many=1 needs these, to reach 24 lines and to test a long name
const EXTRA = [
  ['CNS-5001', 'Common Wire Nail 2" (1 kg pack)', 8500], ['CNS-5002', 'GI Tie Wire #16 (1 kg roll)', 9500], ['CNS-5003', 'Portland Cement 40kg Bag, Type 1', 26500],
  ['CNS-5004', 'Marine Plywood 1/4" 4 × 8 ft Phenolic Board, Heavy Duty Exterior Grade', 68500],
].map(([sku, name, price]) => ({sku, name, price}));
const ALL = [...PRODUCTS, ...EXTRA];
const CUSTOMERS = ['Walk-in customer', 'Ricardo Construction', 'Santos Hardware'];

// ---------- state ----------
const qs = new URLSearchParams(location.search);
let cart = qs.has('empty') ? [] : qs.has('many')
  ? ALL.map((p, i) => ({sku: p.sku, qty: 1 + (i * 7) % 5, price: p.price}))
  : [[0, 4], [3, 2], [5, 1], [6, 3], [10, 1], [12, 10], [13, 10], [15, 1]].map(([i, qty]) => ({sku: PRODUCTS[i].sku, qty, price: PRODUCTS[i].price}));
let cust = 0, fulfil = 'pickup', disc = null, discKind = '%', openSku = null, lastCart = null;
const bySku = sku => ALL.find(p => p.sku === sku);

function totals() {
  const sub = cart.reduce((s, l) => s + l.qty * l.price, 0);
  const off = !disc ? 0 : Math.min(sub, disc.kind === '%' ? Math.round(sub * disc.val / 100) : disc.val);
  const total = sub - off;
  return {sub, off, total, vat: Math.round(total * 12 / 112)};   // VAT is included in the price
}
// self-check: the money path
(() => { const keep = [cart, disc]; cart = [{qty: 1, price: 11200}]; disc = {kind: '%', val: 10};
  const t = totals(); console.assert(t.sub === 11200 && t.off === 1120 && t.total === 10080 && t.vat === 1080, 'totals', t);
  disc = {kind: '₱', val: 99999}; console.assert(totals().total === 0, 'discount capped at subtotal'); [cart, disc] = keep; })();

// ---------- render ----------
$('#grid').innerHTML = PRODUCTS.map(p => `<button type="button" class="tile" data-sku="${p.sku}"><b>${esc(p.name)}</b><span class="num">${peso(p.price)}</span></button>`).join('');
const svg = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;

function renderLines() {
  const el = $('#lines');
  if (!cart.length) { el.innerHTML = `<div class="empty">${svg('rcpt')}<span>Tap a product to add it.</span></div>`; return; }
  el.innerHTML = cart.map(l => {
    const p = bySku(l.sku), open = l.sku === openSku;
    return `<div class="line${open ? ' open' : ''}" data-sku="${l.sku}">
      <button type="button" class="row" aria-expanded="${open}"><span class="nm"><span>${esc(p.name)}</span><small class="num">${l.qty} × ${peso(l.price)}</small></span><span class="amt num">${peso(l.qty * l.price)}</span></button>
      ${open ? `<div class="tray">
        <div class="step"><button type="button" data-q="-1" aria-label="Less">${svg('minus')}</button><output class="num">${l.qty}</output><button type="button" data-q="1" aria-label="More">${svg('plus')}</button></div>
        <label class="price" title="Unit price">₱<input class="num" data-price inputmode="decimal" value="${(l.price / 100).toFixed(2)}"></label>
        <button type="button" class="del" data-del aria-label="Remove">${svg('trash')}</button></div>` : ''}
    </div>`;
  }).join('');
}
function renderFoot() {
  const t = totals(), n = cart.length;
  $('#cust').textContent = CUSTOMERS[cust];
  $('#count').textContent = n ? `${n} item${n === 1 ? '' : 's'}` : 'Item';
  $('#total').textContent = peso(t.total);
  $('#breakIn').innerHTML = `<p><span>Subtotal</span><span class="num">${peso(t.sub)}</span></p>`
    + (t.off ? `<p><span>Discount${disc.kind === '%' ? ` (${disc.val}%)` : ''}</span><span class="num">−${peso(t.off)}</span></p>` : '')
    + `<p><span>VAT (12% incl.)</span><span class="num">${peso(t.vat)}</span></p>`;
  $('#discBtn').classList.toggle('on', !!disc);
  $('#discLbl').textContent = disc ? (disc.kind === '%' ? `−${disc.val}%` : `−${peso(disc.val).replace(/\.00$/, '')}`) : 'Discount';
  document.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === fulfil));
  $('#go').disabled = !n;
  $('.cart').classList.toggle('empty-cart', !n);
  $('[data-act="save"]').disabled = $('[data-act="clear"]').disabled = !n;
}
const render = () => { renderLines(); renderFoot(); };

let tt;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = esc(msg) + (undo ? '<button type="button">Undo</button>' : '');
  if (undo) el.querySelector('button').onclick = () => { undo(); el.classList.remove('show'); };
  el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), undo ? 4000 : 1800);
}

// ---------- actions ----------
$('#grid').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const line = cart.find(l => l.sku === t.dataset.sku);
  if (line) line.qty++; else cart.push({sku: t.dataset.sku, qty: 1, price: bySku(t.dataset.sku).price});
  render();
  const row = $(`.line[data-sku="${t.dataset.sku}"]`);
  row.scrollIntoView({block: 'nearest', behavior: 'smooth'}); row.classList.add('flash');
});
$('#lines').addEventListener('click', e => {
  const line = e.target.closest('.line'); if (!line) return;
  const l = cart.find(x => x.sku === line.dataset.sku);
  const q = e.target.closest('[data-q]');
  if (e.target.closest('.row')) openSku = openSku === l.sku ? null : l.sku;
  else if (q) { l.qty += +q.dataset.q; if (l.qty < 1) { removeLine(l); return; } }
  else if (e.target.closest('[data-del]')) { removeLine(l); return; }
  else return;
  render();
});
$('#lines').addEventListener('change', e => {
  if (!e.target.matches('[data-price]')) return;
  cart.find(x => x.sku === e.target.closest('.line').dataset.sku).price = toC(e.target.value);
  render();
});
function removeLine(l) {
  const i = cart.indexOf(l); cart.splice(i, 1); openSku = null; render();
  toast(`Removed ${bySku(l.sku).name}`, () => { cart.splice(i, 0, l); render(); });
}
$('#who').onclick = () => { cust = (cust + 1) % CUSTOMERS.length; renderFoot(); };
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { fulfil = b.dataset.f; renderFoot(); });
$('#sum').onclick = () => { const o = $('#break').classList.toggle('open'); $('#sum').setAttribute('aria-expanded', o); };

// discount: a tiny inline form, % or ₱
function setKind(k) { discKind = k; document.querySelectorAll('[data-k]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k)); }
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { setKind(b.dataset.k); $('#discIn').focus(); });
$('#discBtn').onclick = () => {
  const f = $('#disc'); f.hidden = !f.hidden;
  $('#discOff').hidden = !disc;
  if (!f.hidden) { setKind(disc ? disc.kind : '%'); $('#discIn').value = disc ? (disc.kind === '%' ? disc.val : disc.val / 100) : ''; $('#discIn').focus(); }
};
$('#discOff').onclick = () => { disc = null; $('#disc').hidden = true; renderFoot(); toast('Discount removed'); };
$('#disc').onsubmit = e => {
  e.preventDefault();
  const raw = parseFloat($('#discIn').value) || 0;
  disc = raw <= 0 ? null : discKind === '%' ? {kind: '%', val: Math.min(100, raw)} : {kind: '₱', val: toC(raw)};
  $('#disc').hidden = true; renderFoot();
  toast(disc ? 'Discount applied' : 'Discount removed');
};

// ⋯ menu
const menu = $('#menu'), more = $('#more');
const closeMenu = () => { menu.hidden = true; more.setAttribute('aria-expanded', 'false'); };
more.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; more.setAttribute('aria-expanded', !menu.hidden); };
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
menu.onclick = e => {
  const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
  closeMenu();
  if (a === 'lost') toast('Lost sale recorded');
  if (a === 'save') toast('Receipt saved');
  if (a === 'clear') { lastCart = {cart, disc}; cart = []; disc = null; openSku = null; render(); toast('Cleared', () => { ({cart, disc} = lastCart); render(); }); }
};
$('#go').onclick = () => labCheckout.open({  // the real POS checkout (cart-lab-checkout.js)
  lines: cart.map(l => ({name: bySku(l.sku).name, qty: l.qty, price: l.price})), totals: totals(),
  customer: cust ? CUSTOMERS[cust] : '', fulfil: String(fulfil),
  onCustomer: () => { cust = (cust + 1) % CUSTOMERS.length; render(); return cust ? CUSTOMERS[cust] : ''; },
  onSold: () => { cart = []; disc = null; openSku = null; render(); },
});
$('#q').oninput = e => { const s = e.target.value.toLowerCase(); document.querySelectorAll('.tile').forEach(t => t.hidden = !t.textContent.toLowerCase().includes(s)); };

render();
</script>
<script>document.body.append(Object.assign(document.createElement('script'), { src: /[?&]co=simple2/.test(location.search) ? 'cart-lab-checkout-2.js' : 'cart-lab-checkout.js' }));  // Simplified 2 lives in its own copy</script>
</body>
</html>
